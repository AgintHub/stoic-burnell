        parameters:
        - description: List of calendar years for which the alternative inflation
            index was successfully computed (from `compute_index_series.years`). Each
            element corresponds by position to an entry in `index_values`.
          name: years
          type: List[int]
        - description: Alternative inflation index values corresponding to each entry
