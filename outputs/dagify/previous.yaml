dag_type: spec
description: Generated workflow from UI.
name: high_volume_options_trading_strategy
nodes:
  acquire_market_data:
    agent: false
    description: Acquires market data from all identified sources, securely retrieves
      authentication credentials, handles rate limits, stores data in a proposed database,
      and generates informative output structures.
    name: acquire_market_data
    nodes_depended_on:
    - identify_data_sources
    nodes_dependent_on: []
    output_structure:
    - description: Whether data acquisition was successful
      key: acquisition_successful
      type: bool
    - description: List of data sources from which data was acquired
      key: data_sources
      type: str
    - description: Start timestamp of the acquired data
      key: start_timestamp
      type: str
    - description: End timestamp of the acquired data
      key: end_timestamp
      type: str
    - description: List of error messages encountered during data acquisition
      key: error_messages
      type: str
    prd:
      conceptual_info: Market data acquisition is the first step in our data pipeline.
        This node is responsible for collecting relevant market data from various
        sources.
      docstring:
        examples: []
        parameters: []
        raises: []
        returns:
          description: Output structure containing successful data acquisition indicator,
            list of used data sources, start and end timestamps of the acquired data,
            and list of error messages.
          type: dict
        summary: Acquires market data from all identified sources.
    prompt: 'Write a Python script that performs market data acquisition tasks. This
      script must:

      - Authenticate with all identified data sources using their respective APIs.

      - Handle rate limits and API constraints for each data source.

      - Store acquired market data in a proposed database.

      - Return an output structure with successful data acquisition indicator, list
      of used data sources, start and end timestamps of the acquired data, and list
      of error messages.


      Output structure should include:

      - acquisition_successful (bool): Indicator of successful data acquisition.

      - data_sources (List[str]): List of used data sources.

      - start_timestamp (str): Start timestamp of the acquired data.

      - end_timestamp (str): End timestamp of the acquired data.

      - error_messages (List[str]): List of encountered error messages.


      Perform these tasks while documenting any encountered issues or challenges.'
  clean_and_prepare_data:
    agent: false
    description: Data cleaning and preparation for modeling
    name: clean_and_prepare_data
    nodes_depended_on:
    - validate_acquired_data
    nodes_dependent_on: []
    output_structure:
    - description: Whether the data cleaning and preparation were successful
      key: cleaning_successful
      type: bool
    - description: Number of missing values handled during the cleaning process
      key: number_of_missing_values_handled
      type: int
    - description: List of derived fields calculated during the preparation process
      key: derived_fields_calculated
      type: str
    - description: Whether the dataset is ready for feature engineering
      key: dataset_ready
      type: bool
    prd:
      conceptual_info: Data Cleaning and Preparation Node
      docstring:
        examples:
        - lines:
          - 'validated_data = [{''timestamp'': 1643723900, ''value'': 10.5}, {''timestamp'':
            1643724000, ''value'': None}]'
          - cleaned_data = clean_and_prepare_data(validated_data)
          output: 'cleaned_data = [{''timestamp'': 1643723900, ''value'': 10.5}, {''timestamp'':
            1643724000, ''value'': 0.0}]'
        parameters:
        - description: The validated data to be cleaned and prepared
          name: validated_data
          type: dict
        raises:
        - description: Raised when data quality checks fail or unexpected discrepancies
            are detected
          type: DataQualityError
        returns:
          description: A cleaned and prepared dataset with relevant metadata
          type: dict
        summary: Cleans and prepares validated data for modeling by applying data
          quality checks, handling missing values, and transforming data.
    prompt: Clean and prepare the validated data for modeling by applying relevant
      data quality checks, handling missing values, aligning and transforming timestamps,
      and calculating derived fields to ensure data consistency and usability. Identify
      and address any discrepancies or inconsistencies, and provide a succinct data
      dictionary with relevant metadata. Return a clean, transformed, and well-documented
      dataset ready for feature engineering.
  define_strategy_objectives:
    agent: false
    description: Define the core financial and operational goals for a comprehensive
      options trading strategy, encompassing key performance indicators (KPIs) such
      as target annual return, volatility, drawdown, liquidity requirements, and market
      scope.
    name: define_strategy_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Target annual return for the strategy (e.g., 20.0 for 20%)
      key: target_annual_return
      type: float
    - description: Acceptable volatility for the strategy (e.g., 10.0 for 10%)
      key: acceptable_volatility
      type: float
    - description: Maximum drawdown for the strategy (e.g., 30.0 for 30%)
      key: maximum_drawdown
      type: float
    - description: Liquidity requirements for the strategy (e.g., 'high', 'medium',
        'low')
      key: liquidity_requirements
      type: str
    - description: Market scope for the strategy (e.g., 'US stocks', 'EU stocks',
        'currencies')
      key: market_scope
      type: str
    prd:
      conceptual_info: Strategy Definition
      docstring:
        examples:
        - lines:
          - node_output = define_strategy_objectives(target_annual_return=0.20, acceptable_volatility=0.10,
            maximum_drawdown=0.30, liquidity_requirements='high', market_scope='US
            stocks')
          output: 'Objectives for the options trading strategy: {target_annual_return:
            0.20, acceptable_volatility: 0.10, maximum_drawdown: 0.30, liquidity_requirements:
            ''high'', market_scope: ''US stocks''}'
        parameters:
        - description: Target annual return for the strategy (e.g., 20.0 for 20%).
          name: target_annual_return
          type: float
        - description: Acceptable volatility for the strategy (e.g., 10.0 for 10%).
          name: acceptable_volatility
          type: float
        - description: Maximum drawdown for the strategy (e.g., 30.0 for 30%).
          name: maximum_drawdown
          type: float
        - description: Liquidity requirements for the strategy (high, medium, low).
          name: liquidity_requirements
          type: str
        - description: Market scope for the strategy (US stocks, EU stocks, currencies).
          name: market_scope
          type: str
        raises: []
        returns:
          description: Objectives for the options trading strategy.
          type: List[dict]
        summary: Defines the core financial and operational goals for a comprehensive
          options trading strategy.
    prompt: 'Define the primary business objectives for a high-volume options trading
      strategy, including:

      - Target Annual Return (%)

      - Acceptable Volatility (%)

      - Maximum Drawdown (%)

      - Liquidity Requirements (high, medium, low)

      - Market Scope (US stocks, EU stocks, currencies)


      To produce these outputs, perform the following steps:

      1. Define key financial KPIs (target return, acceptable volatility, maximum
      drawdown).

      2. Establish liquidity requirements based on expected trading volumes.

      3. Determine market scope based on the portfolio''s asset allocation.

      4. Consider external factors such as economic indicators, regulatory changes,
      and industry trends.


      Ensure all outputs are precise, clear, and actionable for trade execution.'
  deploy_strategy:
    agent: false
    description: Enhanced production deployment of the strategy with containerization,
      automated CI/CD, feature-flag controlled API surface, and end-to-end observability.
      The plan ensures zero-downtime rollout, rigorous validation, secure secrets
      handling, and rapid rollback capabilities guided by predefined SLAs and runbooks.
    name: deploy_strategy
    nodes_depended_on:
    - design_order_management
    - design_risk_controls
    - design_monitoring_and_alerts
    - set_up_data_storage
    - set_up_code_repository
    - generate_reports
    nodes_dependent_on: []
    output_structure:
    - description: Whether the deployment was successful
      key: deployment_status
      type: bool
    - description: List of steps taken during deployment
      key: deployment_steps
      type: List[str]
    - description: Details of the containerization process
      key: containerization_details
      type: str
    - description: Configuration of the CI/CD pipeline
      key: ci_cd_pipeline_config
      type: str
    - description: List of API endpoints used in the deployment
      key: api_endpoints
      type: List[str]
    - description: List of monitoring hooks used in the deployment
      key: monitoring_hooks
      type: List[str]
    - description: List of items in the deployment checklist
      key: deployment_checklist
      type: List[str]
    prd:
      conceptual_info: This node orchestrates a safe, observable, and auditable production
        deployment of the strategy by combining containerization, automated CI/CD,
        controlled rollout, and robust monitoring. It balances rapid delivery with
        risk containment through canary/blue-green strategies, strict validation,
        and automatic rollback gates. The approach emphasizes security, data integrity,
        and operational resilience while preserving compatibility with existing dependencies
        and deployment environments.
      docstring:
        examples:
        - lines:
          - deploy_strategy(environment='prod', version='v2.0.0', enable_canary=True,
            canary_fraction=0.05)
          output: Deployment initiated with canary 5%; awaiting health checks and
            promotion decision.
        parameters:
        - description: Target environment (e.g., prod, staging)
          name: environment
          type: str
        - description: Strategy version tag to deploy
          name: version
          type: str
        - description: Whether to automatically rollback on deployment failure
          name: rollback_on_failure
          type: bool
        - description: Enable canary deployment with progressive traffic shift
          name: enable_canary
          type: bool
        - description: Initial traffic percentage directed to canary (0-1)
          name: canary_fraction
          type: float
        - description: Observation window (minutes) after canary before promotion
          name: wait_period
          type: int
        - description: Container image registry URL
          name: registry_url
          type: str
        - description: Helm release name for Kubernetes deployment
          name: helm_release
          type: str
        raises:
        - description: Deployment failures raise exceptions and trigger rollback/alerting
          type: Exception
        returns:
          description: Summary/status message of deployment outcome
          type: str
        summary: Deploys the strategy to production with containerization, CI/CD,
          API exposure, and observability, ensuring safe rollout and rapid rollback
          where needed.
    prompt: 'You are an automation engineer tasked with executing a production deployment
      of the strategy. Produce a structured deployment plan that populates the following
      fields: deployment_status (bool), deployment_steps (List[str]), containerization_details
      (str), ci_cd_pipeline_config (str), api_endpoints (List[str]), monitoring_hooks
      (List[str]), deployment_checklist (List[str]). The prompt must be explicit about
      WHAT to do and HOW to do it:


      1) Pre-deployment validation and alignment

      - Verify that dependent nodes outputs are ready: design_order_management, design_risk_controls,
      design_monitoring_and_alerts, set_up_data_storage, set_up_code_repository, generate_reports.

      - Confirm environment parity between staging and production, including data
      schemas, feature flags, and secret stores.


      2) Containerization plan

      - Build lightweight, reproducible container images for the strategy using a
      minimal base image with explicit versions.

      - Tag images with semantic versioning and commit hash; push to a private registry;
      enforce image signing and vulnerability scanning.

      - Determine runtime: Kubernetes (preferred) or managed container service (ECS/Fargate).
      Provide alternatives and rationale.

      - Define resource requests/limits, CPU/memory budgets, and horizontal pod autoscaling
      rules.

      - Implement health checks: readinessProbe and livenessProbe with appropriate
      timeouts; implement graceful shutdown hooks.


      3) CI/CD pipeline configuration

      - Describe build, test, security scan, artifact publication, and deployment
      stages.

      - Include unit/integration tests, static code analysis, and dependency checks.

      - Implement environment promotion: canary/blue-green strategy with explicit
      canary percentage and promotion criteria.

      - Ensure secrets management and config injection with a secure vault; rotate
      credentials on deployment.

      - Provide the pipeline config snippet (YAML) or detailed steps with triggers
      and rollback triggers.


      4) Deployment orchestration and rollout strategy

      - Blue-green or canary deployment approach with rollback guardrails.

      - Rollout strategy: initial canary %, duration, metrics for promotion.

      - Data migrations: order and risk-controlled migrations with backward compatibility.

      - Ensure idempotent deployments and deterministic rollbacks.


      5) API surface and endpoints

      - List endpoints to be exposed; verify authentication and authorization points;
      include health and readiness endpoints.

      - Document endpoint versions and deprecation plans if applicable.


      6) Monitoring, observability, and alerting

      - Instrument metrics (throughput, latency, error rate, resource usage, PnL,
      risk metrics) and log aggregation.

      - Define alert thresholds, channels, and runbooks; integrate with incident management.

      - Confirm dashboards exist and are pre-warmed prior to go-live.


      7) Validation and acceptance criteria

      - Run smoke tests, end-to-end validation, and data integrity checks; require
      explicit pass before marking deployment as successful.

      - Document expected post-deployment outcomes and KPIs.


      8) Rollback and safety nets

      - Define rollback criteria, automated rollback triggers, and manual rollback
      runbooks; ensure canary or blue-green rollback is safe.

      - Maintain audit trails for all deployment actions.


      9) Compliance, security, and governance

      - Secrets management (vault), compliance logging, role-based access control,
      and least-privilege principals.

      - Secure artifact handling and encryption in transit and at rest.


      10) Runbooks and handoff

      - Update runbooks for on-call responders and SREs; provide contact chain and
      escalation paths.


      Deliverables:

      - deployment_status: boolean; deployment_steps: list of steps; containerization_details:
      string; ci_cd_pipeline_config: string; api_endpoints: list; monitoring_hooks:
      list; deployment_checklist: list.

      - Provide thorough, unambiguous steps suitable for automation.


      Note: The content should be actionable, provable, and idempotent; assume production-ready
      infrastructure and access to required tooling. Include rationale for all non-obvious
      decisions and provide fallback options where applicable.'
  design_execution_logic:
    agent: false
    description: Enhanced execution logic node to translate strategy decisions into
      routable, auditable, and resilient order execution. Defines algorithms, routing,
      and compliance governance for automated and semi-automated trading across multiple
      venues.
    name: design_execution_logic
    nodes_depended_on:
    - design_strategy_logic
    nodes_dependent_on: []
    output_structure:
    - description: List of execution algorithms used (e.g., VWAP, TWAP, Market)
      key: execution_algorithms
      type: List[str]
    - description: Details about order routing, including routing protocols and destinations
      key: order_routing_info
      type: str
    - description: List of compliance checks performed during order execution (e.g.,
        position limits, risk checks)
      key: compliance_checks
      type: List[str]
    - description: Whether the execution is automated
      key: is_auto_execution
      type: bool
    prd:
      conceptual_info: This node implements the execution layer of the trading system.
        It translates strategy-level signals into concrete, venue-specific actions
        by selecting algorithms, orchestrating routing across venues, and enforcing
        compliance. It must be resilient, low-latency, auditable, and scalable to
        multi-venue environments. The design should accommodate dynamic routing, latency
        budgets, fault tolerance, and comprehensive observability to support testing,
        simulation, and production deployment.
      docstring:
        examples:
        - lines:
          - design_execution_logic.execute(strategy_context, market_feed, venue_config,
            compliance_config, execution_metrics)
          output: '{ "execution_algorithms": ["VWAP","TWAP"], "order_routing_info":
            "FIX:VenueA; FIX:VenueB; fallback: FIX:VenueC", "compliance_checks": ["position_limits","risk_checks","circuit_breaker"],
            "is_auto_execution": true }'
        parameters:
        - description: Contains entry/exit signals, risk_limits, and proposed order
            profile derived from design_strategy_logic.
          name: strategy_context
          type: StrategyContext
        - description: Real-time and historical market data used for price discovery,
            VWAP/TWAP calculations, and slippage estimation.
          name: market_feed
          type: MarketFeed
        - description: Routing configuration across venues including endpoints, protocol
            sessions, and per-venue routing rules.
          name: venue_config
          type: VenueConfig[]
        - description: Regulatory and firm-wide constraints to enforce during execution
            (position limits, risk checks, circuit breakers, per-venue rules).
          name: compliance_config
          type: ComplianceConfig
        - description: Telemetry and counters for latency, throughput, fill rate,
            slippage, and audit trail.
          name: execution_metrics
          type: ExecutionMetrics
        raises:
        - description: Raised if a viable route cannot be established to required
            venues.
          type: RoutingFailureException
        - description: Raised when strategy intent cannot be met by available algorithms
            or required parameters are missing.
          type: AlgorithmIncompatibilityException
        - description: Raised when routing or execution would violate regulatory or
            firm-wide constraints.
          type: ComplianceViolationException
        returns:
          description: 'Structured result containing: execution_algorithms, order_routing_info,
            compliance_checks, is_auto_execution.'
          type: ExecutionResult
        summary: Provide a detailed, implementable blueprint for the execution layer,
          including inputs, transformations, outputs, and governance considerations
          for automated and semi-automated trading.
    prompt: 'Enhance the execution layer specification by detailing how orders are
      translated from strategy outputs into actionable actions across venues. Your
      task is to produce a JSON object with the following fields exactly:

      - execution_algorithms (List[str]): List of execution algorithms to employ (e.g.,
      VWAP, TWAP, Market, Arrival-based).

      - order_routing_info (str): Detailed routing plan including routing protocols,
      venue destinations, and fallback behavior.

      - compliance_checks (List[str]): List of compliance checks performed during
      the execution (e.g., position limits, risk checks, circuit breakers, venue-specific
      constraints).

      - is_auto_execution (bool): Whether the execution path is fully automated.


      Guidance and constraints:

      1) Derive execution_algorithms from the design_strategy_logic context (e.g.,
      passive/aggressive profiles, liquidity considerations). Prioritize deterministic,
      auditable selections and provide clear rationale if multiple algorithms are
      applicable.

      2) Provide a concrete, multi-venue routing plan with protocol details (e.g.,
      FIX sessions, ITCH-like feeds, gateway routing) and per-venue destinations.
      Include tie-breakers and automatic fallback rules.

      3) Enumerate all relevant compliance checks, including firm-wide risk checks,
      position limits, regulatory constraints, and venue-specific constraints (e.g.,
      price improvement requirements).

      4) Set is_auto_execution to true only if the system can auto-submit, monitor,
      and adjust orders with safety nets (idempotent retries, reconciliation, audit
      logs, and alerting). If false, outline manual intervention points.

      5) Include non-functional requirements: end-to-end latency budget (e.g., sub-100
      ms for routing, sub-300 ms for full execution from decision), throughput targets,
      fault-tolerance strategies, idempotency guarantees, and observability hooks
      (logging, metrics, tracing).

      6) The output must be a self-contained JSON object with the four fields above
      and no extraneous text. If an element cannot be determined at design time, explicitly
      enumerate acceptable defaults or constraints rather than leaving fields blank.'
  design_monitoring_and_alerts:
    agent: false
    description: Designs and configures robust monitoring systems to ensure operational
      oversight, detecting anomalies, and triggering alerts when critical thresholds
      are breached.
    name: design_monitoring_and_alerts
    nodes_depended_on:
    - design_risk_controls
    nodes_dependent_on: []
    output_structure:
    - description: Description of the monitoring dashboard design
      key: monitoring_dashboard_design
      type: str
    - description: List of alert rules for key metrics
      key: alert_rules
      type: List[str]
    - description: List of alert channels (e.g., email, SMS, webhook)
      key: alert_channels
      type: List[str]
    - description: List of key metrics to be monitored (e.g., PnL, risk limits, system
        health)
      key: key_metrics
      type: List[str]
    - description: List of threshold values for each key metric
      key: threshold_values
      type: List[float]
    prd:
      conceptual_info: Describes the node's high-level conceptual role
      docstring:
        examples: []
        parameters:
        - description: List of key metrics monitored for operational oversight
          name: key_metrics
          type: List[str]
        - description: List of numeric threshold values defining operational limits
            and anomaly detection criteria
          name: threshold_values
          type: List[float]
        - description: List of alert channels and notification protocols for distributed
            notifications
          name: alert_channels
          type: List[str]
        raises:
        - description: Raises when an invalid threshold value is specified for a key
            metric
          type: Exception:InvalidThresholdValue
        returns:
          description: Monitoring dashboard design, alert rules configuration, and
            alert channels setup
          type: object
        summary: Designs, deploys, and configures a robust monitoring system for operational
          oversight
    prompt: Design and deploy monitoring systems for operational oversight, integrating
      data sources and triggering alerts for critical issues. Specify metrics, thresholds,
      data aggregation, and alert policies. Output a comprehensive monitoring dashboard
      design and configuration.
  design_order_management:
    agent: false
    description: Designs the order management workflow, specifies data structures
      for storing order information, and outlines the procedures for modifying and
      cancelling orders.
    name: design_order_management
    nodes_depended_on:
    - design_execution_logic
    nodes_dependent_on: []
    output_structure:
    - description: Description of the order management workflow
      key: order_workflow_description
      type: str
    - description: List of possible order status options
      key: order_status_options
      type: List[str]
    - description: List of data structures used to store order information
      key: data_structures_used
      type: List[str]
    - description: List of rules for modifying existing orders
      key: modification_rules
      type: List[str]
    - description: Description of the procedures for cancelling orders
      key: cancellation_procedures
      type: str
    - description: Whether the order management process is automated
      key: is_order_management_automated
      type: bool
    prd:
      conceptual_info: Develops a robust order management system that facilitates
        efficient order tracking, modification, and cancellation while adhering to
        business rules and regulatory requirements.
      docstring:
        examples: []
        parameters: []
        raises: []
        returns:
          description: Order management data structures and workflow design
          type: dict
        summary: Designs the order management workflow, specifies data structures,
          and outlines modification and cancellation procedures.
    prompt: 'Design the order management workflow by describing the following components:

      - Order creation and submission flow

      - Status tracking and update mechanisms

      - Cancellation processes and their triggers

      - Data structures for storing order information, such as order ID, customer
      information, product details, and order status

      - Modification rules for updating order details, including approval processes
      and version control


      To achieve this, consider the following inputs and constraints:

      - Order execution plan from the design_execution_logic node

      - Product catalog and pricing data

      - Customer information and order history

      Ensure the designed order management workflow is scalable, maintainable, and
      adaptable to changing business requirements.'
  design_risk_controls:
    agent: false
    description: Develops robust, data-driven risk management strategies to safeguard
      against market volatility and unexpected losses, optimizing position allocation
      and exposure limits.
    name: design_risk_controls
    nodes_depended_on:
    - evaluate_backtest_risk
    nodes_dependent_on: []
    output_structure:
    - description: List of position limits for each asset
      key: position_limits
      type: List[float]
    - description: List of Value-at-Risk (VaR) constraints for each asset
      key: var_constraints
      type: List[float]
    - description: List of stop-loss thresholds for each asset
      key: stop_loss_thresholds
      type: List[float]
    - description: List of risk control rules
      key: risk_control_rules
      type: List[str]
    - description: Whether the risk control rules are satisfied
      key: is_risk_control_satisfied
      type: bool
    prd:
      conceptual_info: This node develops live risk management controls to safeguard
        against market volatility and unexpected losses, optimizing trading decisions
        and minimizing exposure.
      docstring:
        examples: []
        parameters: []
        raises: []
        returns:
          description: Returns a dictionary containing the dynamic position limits,
            VaR constraints, stop-loss thresholds, risk control rules, and flag indicating
            whether the risk control rules are satisfied.
          type: dict or None
        summary: Designs robust, dynamic risk control strategies based on backtested
          risk metrics.
    prompt: Design live risk management controls that dynamically adjust position
      limits, Value-at-Risk (VaR) constraints, and stop-loss thresholds in real-time,
      leveraging backtest risk metrics to inform decision-making.
  design_strategy_logic:
    agent: false
    description: Defines the strategic decision-making algorithm for a trading system,
      encompassing entry signals, exit rules, position sizing, risk limits, and a
      high-level decision tree.
    name: design_strategy_logic
    nodes_depended_on:
    - engineer_features
    nodes_dependent_on: []
    output_structure:
    - description: List of conditions for entering a trade
      key: entry_signals
      type: List[str]
    - description: List of conditions for exiting a trade
      key: exit_rules
      type: List[str]
    - description: Method for determining position size (e.g., fixed, risk-based)
      key: position_sizing
      type: str
    - description: List of risk limits (e.g., stop-loss, take-profit levels)
      key: risk_limits
      type: List[float]
    - description: High-level overview of the decision-making process
      key: decision_tree
      type: str
    prd:
      conceptual_info: Core trading logic generator for a trading system.
      docstring:
        examples: []
        parameters: []
        raises: []
        returns:
          description: Dictionary containing the trading strategy logic components.
          type: dict
        summary: Designs the trading strategy decision-making algorithm.
    prompt: 'Develop a comprehensive trading strategy logic document detailing the
      following components:

      - Entry signals: Generate a list of conditions that trigger a new trade, including
      buy and sell signals.

      - Exit rules: Define a list of conditions that trigger the closure of an open
      trade, including take-profit and stop-loss levels.

      - Position sizing: Specify the method used to determine trade position sizes,
      including fixed or risk-based sizing.

      - Risk limits: Outline a list of risk-related thresholds, such as stop-loss,
      take-profit, and maximum exposure levels.

      - Decision tree: Provide a high-level visual representation of the decision-making
      process, including key inputs, processing steps, and outputs.'
  engineer_features:
    agent: false
    description: Develops a comprehensive feature set for strategy signals, incorporating
      volatility, Greeks, moneyness, time-toexpiration, and market sentiment indicators.
    name: engineer_features
    nodes_depended_on:
    - clean_and_prepare_data
    nodes_dependent_on: []
    output_structure:
    - description: List of feature names engineered for the strategy
      key: feature_list
      type: List[str]
    - description: Formulas or descriptions for each feature in the feature list
      key: feature_formulas
      type: List[str]
    - description: Descriptions of each feature in the feature list
      key: feature_descriptions
      type: List[str]
    prd:
      conceptual_info: Generating a set of features relevant to options trading strategies,
        including implied volatility, Greeks, moneyness, time-to-expiration, and market
        sentiment indicators.
      docstring:
        examples: []
        parameters: []
        raises: []
        returns:
          description: Three-element tuple containing the list of feature names, the
            list of formulas for each feature, and the list of descriptions for each
            feature
          type: List[tuple]
        summary: Engineers features for options trading strategy signals.
