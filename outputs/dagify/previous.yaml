    name: encoder1_ff_activation
    nodes_depended_on:
    - encoder1_ff_linear1
    nodes_dependent_on: []
    prompt: Apply ReLU activation to the output of the feed‑forward first linear layer.
  encoder1_ff_linear1:
    agent: false
    description: First linear transformation of the feed‑forward sub‑layer for the
      first encoder layer.
    name: encoder1_ff_linear1
    nodes_depended_on:
    - encoder1_layernorm_attention
    nodes_dependent_on: []
    prompt: Define a linear layer of shape (512, 2048) for the feed‑forward network.
  encoder1_ff_linear2:
    agent: false
    description: Second linear transformation of the feed‑forward sub‑layer for the
      first encoder layer.
    name: encoder1_ff_linear2
    nodes_depended_on:
    - encoder1_ff_activation
    nodes_dependent_on: []
    prompt: Define a linear layer of shape (2048, 512) to project back to model dimension.
  encoder1_k_linear:
    agent: false
    description: Project input to key vectors for the first encoder layer.
    name: encoder1_k_linear
    nodes_depended_on:
    - addembeddingposencoding
    nodes_dependent_on: []
    prompt: Define a linear projection K of shape (512, 64) to map input to keys for
      the first encoder layer.
  encoder1_layernorm_attention:
    agent: false
    description: Normalize the self‑attention output of the first encoder layer.
    name: encoder1_layernorm_attention
    nodes_depended_on:
    - encoder1_residualadd_attention
    nodes_dependent_on: []
    prompt: Apply layer normalization to the residual‑added tensor with learnable
      scale and shift.
  encoder1_layernorm_ff:
    agent: false
    description: Normalize the feed‑forward output of the first encoder layer.
    name: encoder1_layernorm_ff
    nodes_depended_on:
    - encoder1_residualadd_ff
    nodes_dependent_on: []
    prompt: Apply layer normalization to the residual‑added tensor from the feed‑forward
      sub‑layer.
  encoder1_output:
    agent: false
    description: Provide the output tensor for the next encoder layer.
    name: encoder1_output
    nodes_depended_on:
    - encoder1_layernorm_ff
    nodes_dependent_on: []
    prompt: Output the final representation of the first encoder layer.
  encoder1_q_linear:
    agent: false
    description: Project input to query vectors for the first encoder layer.
    name: encoder1_q_linear
    nodes_depended_on:
    - addembeddingposencoding
    nodes_dependent_on: []
    prompt: Define a linear projection Q of shape (512, 64) to map input to queries.
  encoder1_residualadd_attention:
    agent: false
    description: Add residual connection for the self‑attention sub‑layer of the first
      encoder layer.
    name: encoder1_residualadd_attention
    nodes_depended_on:
    - encoder1_attentionoutputlinear
    - addembeddingposencoding
    nodes_dependent_on: []
    prompt: Add the attention linear output to the original input representation element‑wise.
  encoder1_residualadd_ff:
    agent: false
    description: Add residual connection for the feed‑forward sub‑layer of the first
      encoder layer.
    name: encoder1_residualadd_ff
    nodes_depended_on:
    - encoder1_ff_linear2
    - encoder1_layernorm_attention
    nodes_dependent_on: []
    prompt: Add the feed‑forward linear output to the input of the feed‑forward sub‑layer
      element‑wise.
  encoder1_scaleddotproduct:
    agent: false
    description: Perform the attention scoring and value aggregation for the first
      encoder layer.
    name: encoder1_scaleddotproduct
    nodes_depended_on:
    - encoder1_q_linear
    - encoder1_k_linear
    - encoder1_v_linear
    nodes_dependent_on: []
    prompt: 'Compute scaled dot‑product attention: softmax((Q*K^T)/sqrt(64)) * V.'
  encoder1_v_linear:
    agent: false
    description: Project input to value vectors for the first encoder layer.
    name: encoder1_v_linear
    nodes_depended_on:
    - addembeddingposencoding
    nodes_dependent_on: []
    prompt: Define a linear projection V of shape (512, 64) to map input to values
