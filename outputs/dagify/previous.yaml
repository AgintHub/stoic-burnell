    name: encoder2_attentionoutputlinear
    nodes_depended_on:
    - encoder2_scaleddotproduct
    nodes_dependent_on: []
    prompt: Apply a linear layer of shape (64, 512) to the attention output.
  encoder2_ff_activation:
    agent: false
    description: Activate the feed‑forward hidden representation for the second encoder
