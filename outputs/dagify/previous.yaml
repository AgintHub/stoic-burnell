            length as `years`.
          name: index_values
          type: List[float]
        - description: Whether the index computation completed successfully in the
            upstream `compute_index_series` node. If False, this node should not attempt
            to build the timeline and must mark `is_timeline_successful` as False.
          name: is_index_successful
          type: bool
        - description: CSV string from `compute_category_location_breakdowns.category_spending_csv`
            containing at least the columns `Year`, `Category`, and a numeric total
            expenditure column (e.g. `TotalExpenditure`). Each row represents the
            annual total for a given category.
          name: category_spending_csv
          type: str
        - description: CSV string from `compute_category_location_breakdowns.location_spending_csv`
            containing at least the columns `Year`, `HouseholdLocation`, and a numeric
            total expenditure column (e.g. `TotalExpenditure`). Each row represents
            the annual total for a given household location.
          name: location_spending_csv
          type: str
        - description: Whether the category and location breakdown aggregation completed
            successfully in the upstream `compute_category_location_breakdowns` node.
            If False, this node should not attempt to build the timeline and must
            mark `is_timeline_successful` as False.
          name: is_breakdown_successful
          type: bool
        - description: Name of the numeric column in `category_spending_csv` that
            represents the total expenditure per (Year, Category). Default is `'TotalExpenditure'`.
            Used to construct the per‑year `CategoryTotals` mapping.
          name: category_column
          type: str
        - description: Name of the numeric column in `location_spending_csv` that
            represents the total expenditure per (Year, HouseholdLocation). Default
            is `'TotalExpenditure'`. Used to construct the per‑year `LocationTotals`
            mapping.
          name: location_column
          type: str
        raises:
        - description: Raised if `years` and `index_values` have different lengths,
            if they are empty when upstream reports success, or if required columns
            (`Year`, `Category`, `HouseholdLocation`, and the specified numeric total
            columns) are missing from the breakdown CSVs.
          type: ValueError
        - description: Raised if `is_index_successful` or `is_breakdown_successful`
            is False but the function is invoked in a mode that requires successful
            upstream computation (e.g. strict mode), or if no overlapping years can
            be found between the index series and the breakdown CSVs.
          type: RuntimeError
        - description: Raised if expected field names such as `Year`, `Category`,
            `HouseholdLocation`, or the configured numeric total columns cannot be
            found during CSV parsing or aggregation.
          type: KeyError
        - description: Raised if the data types of `years`, `index_values`, or parsed
            numeric totals are incompatible with the expected numeric operations (e.g.
            non‑numeric totals that cannot be coerced).
