dag_type: plain_text
description: Parse patient information from incoming PDF document, extract biographical
  and medical data, and initiate task assignments for benefit investigation, document
  review, and medical review.
name: patient_intake_workflow
nodes:
  create_new_patient_record:
    agent: false
    description: Create a new patient record in the electronic health record (EHR)
      system using extracted data.
    name: create_new_patient_record
    nodes_depended_on:
    - extract_biographical_data
    - extract_and_parse_patient_medical_history
    nodes_dependent_on:
    - create_new_patient_record
    prompt: Using all the extracted patient data, create a complete patient record
      with essential medical information stored in the EHR system.
  extract_and_parse_patient_medical_history:
    agent: false
    description: Parse patient medical history from extracted PDF text.
    name: extract_and_parse_patient_medical_history
    nodes_depended_on:
    - extract_medical_data
    nodes_dependent_on: []
    prompt: Identify relevant medical events and conditions extracted from the PDF
      text using NLP and ICD-10 or CPT coding. Create an electronic health record
      (EHR) with relevant sections (chief complaint, history of present illness, allergies,
      medications, and medical history).
  extract_biographical_data:
    agent: false
    description: Identify and extract patient biographical data from parsed PDF text.
    name: extract_biographical_data
    nodes_depended_on:
    - parse_pdf
    nodes_dependent_on: []
    prompt: Use Natural Language Processing (NLP) to identify key phrases in the extracted
      text, such as name, date of birth, and contact information. Extract these fields
      and return in a structured format.
  extract_medical_data:
    agent: false
    description: Identify and extract medical condition and treatment data from parsed
      PDF text.
    name: extract_medical_data
    nodes_depended_on:
    - parse_pdf
    nodes_dependent_on: []
    prompt: Use NLP to identify key phrases related to medical conditions and treatment,
      such as diagnosis codes, medication regimens, and surgical procedures. Extract
      these fields and return in a structured format.
  extract_referrer_data:
    agent: false
    description: Identify and extract referrer data from parsed PDF text.
    name: extract_referrer_data
    nodes_depended_on:
    - parse_pdf
    nodes_dependent_on: []
    prompt: Use NLP to identify key phrases related to the referrer, such as name,
      phone number, and reason for referral. Extract these fields and return in a
      structured format.
  initiate_benefit_investigation_task:
    agent: false
    description: Initiate a benefit investigation task for insurance verification,
      claims processing, and prior authorization.
    name: initiate_benefit_investigation_task
    nodes_depended_on:
    - create_new_patient_record
    nodes_dependent_on: []
    prompt: Send a notification to the claims processing department or external insurance
      service to initiate the benefit investigation and claims processing. Include
      patient data and required medical documentation for review.
  initiate_document_review_task:
    agent: false
    description: Initiate a document review task for medical record verification and
      patient chart review.
    name: initiate_document_review_task
    nodes_depended_on:
    - create_new_patient_record
    nodes_dependent_on: []
    prompt: Request a review of the patient's medical records by clinical staff to
      verify the accuracy of recorded clinical observations. This includes medical
      history documentation validation.
  initiate_medical_review_task:
    agent: false
    description: Initiate a medical review task for patient condition verification
      and treatment evaluation.
    name: initiate_medical_review_task
    nodes_depended_on:
    - create_new_patient_record
    nodes_dependent_on: []
    prompt: Request an evaluation of the patient's condition by medical professionals
      for verification of diagnoses and current treatment plans.
  parse_medical_condition_codes:
    agent: false
    description: Parse medical condition codes from parsed PDF text.
    name: parse_medical_condition_codes
    nodes_depended_on:
    - extract_medical_data
    nodes_dependent_on: []
    prompt: Read the extracted medical data and use NLP to identify relevant ICD-10
      or CPT codes corresponding to the condition descriptions. Return a list of code
      strings along with corresponding values.
  parse_pdf:
    agent: false
    description: Parse the incoming PDF document to extract page layouts and extract
      text.
    name: parse_pdf
    nodes_depended_on: []
    nodes_dependent_on:
    - split_pdf_into_pages
    prompt: Read the incoming PDF document page by page, parse the layout and extract
      text using OCR (Optical Character Recognition) techniques. Return a list of
      extracted text snippets along with corresponding metadata.
  split_pdf_into_pages:
    agent: false
    description: Separate the incoming PDF document into individual pages.
    name: split_pdf_into_pages
    nodes_depended_on: []
    nodes_dependent_on:
    - parse_pdf
    prompt: Take the incoming PDF document and split it into individual pages. Return
      a list of page file paths.
  validate_patient_data:
    agent: false
    description: Verify patient data consistency across extracted sources.
    name: validate_patient_data
    nodes_depended_on:
    - create_new_patient_record
    nodes_dependent_on: []
    prompt: Cross-match and validate patient information against existing patient
      files and external records sources to prevent duplicate entries or mismatched
      data.
