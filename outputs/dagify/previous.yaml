      type: float
    - description: Value-at-Risk (VaR) of the backtest returns at 95% confidence level
      key: value_at_risk
      type: float
    - description: Expected Shortfall (ES) of the backtest returns at 95% confidence
        level
      key: expected_shortfall
      type: float
    - description: Maximum drawdown of the backtest returns
      key: max_drawdown
      type: float
    - description: List of tail risk metrics (e.g., 1% and 5% quantile returns)
      key: tail_risk
      type: List[float]
    - description: Herfindahl-Hirschman Index (HHI) of position concentration
      key: position_concentration
      type: float
    - description: Estimated liquidity impact of the strategy (e.g., price impact,
        slippage)
      key: liquidity_impact
      type: float
    prd:
      conceptual_info: Evaluates the risks associated with the backtested trading
        strategy, offering insights into potential losses, concentration, and market
        impact.
      docstring:
        examples: []
        parameters:
        - description: Output from the backtest calculation, containing cumulative_return,
            sharpe_ratio, max_drawdown, and win_rate.
          name: backtest_output
          type: dict
        raises:
        - description: Raised when the input parameters violate assumptions underlying
            the risk analysis, such as nonsensical confidence levels.
          type: AssertionError
        returns:
          description: 'Contains risk metrics extracted from the backtest output,
            including: volatility, Value-at-Risk, Expected Shortfall, max_drawdown,
            tail risk, position concentration, and liquidity impact.'
          type: dict
        summary: Analyzes the backtest results to derive a detailed risk assessment.
    prompt: 'Process the output of the backtest (cumulative_return, sharpe_ratio,
      max_drawdown, win_rate) and provide a comprehensive risk analysis, incorporating
      volatility, tail risk, position concentration, and liquidity impact. The output
      should include:


      - volatility (Annualized volatility of the backtest returns)

      - value_at_risk (Value-at-Risk of the backtest returns at 95% confidence level)

      - expected_shortfall (Expected Shortfall of the backtest returns at 95% confidence
      level)

      - max_drawdown (Maximum drawdown of the backtest returns)

      - tail_risk (List of tail risk metrics, e.g., 1% and 5% quantile returns)

      - position_concentration (Herfindahl-Hirschman Index of position concentration)

      - liquidity_impact (Estimated liquidity impact of the strategy, e.g., price
      impact, slippage)


      To achieve this, execute the following steps:


      1. Extract volatility from past return distributions.

      2. Calculate the probability of losing a given fraction of wealth over a specified
      time frame (Value-at-Risk).

      3. Determine the average of the differences between the VaR and the actual losses
      (Expected Shortfall).

      4. Identify the maximum cumulative sum of returns (Maximum drawdown).

      5. Detect patterns in tail risk metrics, such as extreme losses, and report
      on the likelihood and expected size of future losses (Tail risk).

      6. Measure concentration risk by computing the Herfindahl-Hirschman Index of
      positions, and provide a ranking of positions by their impact on the overall
      portfolio.

      7. Quantify liquidity risk by modeling the price impact, slippage, and other
      factors that influence trading costs.


      Ensure all outputs are clear, accurate, and actionable for informed decision-making.'
