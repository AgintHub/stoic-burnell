  encoder2_layernorm_attention:
    agent: false
    description: Normalize the self‑attention output of the second encoder layer.
    name: encoder2_layernorm_attention
    nodes_depended_on:
    - encoder2_residualadd_attention
    nodes_dependent_on: []
    prompt: Apply layer normalization to the residual‑added tensor.
  encoder2_layernorm_ff:
    agent: false
    description: Normalize the feed‑forward output of the second encoder layer.
    name: encoder2_layernorm_ff
    nodes_depended_on:
    - encoder2_residualadd_ff
    nodes_dependent_on: []
    prompt: Apply layer normalization to the residual‑added tensor.
  encoder2_output:
    agent: false
    description: Provide the output tensor for the decoder.
    name: encoder2_output
    nodes_depended_on:
