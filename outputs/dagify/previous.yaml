  encoder2_ff_linear2:
    agent: false
    description: Second linear transformation of the feed‑forward sub‑layer for the
      second encoder layer.
    name: encoder2_ff_linear2
    nodes_depended_on:
    - encoder2_ff_activation
    nodes_dependent_on: []
    prompt: Define a linear layer of shape (2048, 512) to project back to model dimension.
  encoder2_k_linear:
    agent: false
    description: Project input to key vectors for the second encoder layer.
    name: encoder2_k_linear
    nodes_depended_on:
    - encoder1_output
    nodes_dependent_on: []
    prompt: Define a linear projection K of shape (512, 64) to map input to keys for
