dag_type: spec
description: Workflow that fetches household expenditure data, defines an alternative
  inflation index, computes category and household‑location breakdowns, builds a historical
  timeline, analyses inflation trends, drafts a policy proposal, and produces the
  final report.
name: alternative_inflation_index_and_policy_proposal_workflow
nodes:
  analyze_trends_and_benchmark:
    agent: false
    description: Analyze inflation trends and benchmark against existing measures.
    name: analyze_trends_and_benchmark
    nodes_depended_on:
    - generate_historical_timeline
    nodes_dependent_on: []
    output_structure:
    - description: Years corresponding to calculated inflation rates (each representing
        the end year for the year-on-year inflation rate).
      key: inflation_rate_years
      type: List[int]
    - description: Inflation rates as percent changes for each calculated year, based
        on alternative index values.
      key: inflation_rate_values
      type: List[float]
    - description: Narrative summary of inflation trends over the period and benchmarking
        results versus the official CPI.
      key: trend_summary
      type: str
    - description: Flag indicating whether inflation trend analysis and benchmarking
        were completed successfully (True) or not (False).
      key: is_analysis_successful
      type: bool
    prd:
      conceptual_info: This node parses a provided historical timeline CSV to extract
        a year-index series, computes annual inflation rates, generates a long-term
        trend summary, and benchmarks the resulting index against the official Consumer
        Price Index (CPI).
      docstring:
        examples:
        - lines:
          - csv = 'Year,Index,CategoryTotals,LocationTotals\n2018,100.0,...\n2019,102.5,...\n2020,104.6,...\n2021,108.1,...'
          - analyze_trends_and_benchmark(csv, True)
          output: ([2019, 2020, 2021], [2.5, 2.05, 3.35], 'Inflation averaged 2.6%
            (2018-2021). Trend closely tracks, but slightly outpaces CPI for 2021.
            Analysis complete.', True)
        - lines:
          - analyze_trends_and_benchmark('', False)
          output: ([], [], 'Timeline report is missing or invalid; unable to perform
            inflation trend analysis.', False)
        parameters:
        - description: 'A CSV string combining annual alternative index values and
            their corresponding years and breakdowns, with columns: Year,Index,CategoryTotals,LocationTotals
            (output from generate_historical_timeline).'
          name: timeline_report_csv
          type: str
        - description: Boolean flag indicating if the timeline CSV report generation
            was successful.
          name: is_timeline_successful
          type: bool
        raises:
        - description: Raised if the input CSV is invalid, contains insufficient data,
            or if index values are missing or malformed.
          type: ValueError
        - description: Raised if the analysis cannot be performed for any other processing
            reason.
          type: RuntimeError
        returns:
          description: 'A tuple containing: list of inflation rate years, corresponding
            inflation rates in percent, a narrative trend and benchmark summary, and
            a boolean flag indicating analytical success.'
          type: Tuple[List[int], List[float], str, bool]
        summary: Analyzes year-to-year inflation rates from an alternative index timeline,
          summarizes long-term inflation trends, and benchmarks the trends against
          the current CPI.
    prompt: Compute year‑to‑year inflation rates from the index values, summarize
      long‑term trends, and benchmark against the current CPI. Return the inflation
      rate series and a concise trend summary string.
  compute_category_location_breakdowns:
    agent: false
    description: Create category‑wise and household‑location‑wise expenditure breakdowns
      from consolidated household expenditure data.
    name: compute_category_location_breakdowns
    nodes_depended_on:
    - fetch_household_expenditure_data
    nodes_dependent_on: []
    output_structure:
    - description: CSV string containing Year, Category, and the total expenditure
        for that category in that year.
      key: category_spending_csv
      type: str
    - description: CSV string containing Year, HouseholdLocation, and the total expenditure
        for that household location in that year.
      key: location_spending_csv
      type: str
    - description: Flag indicating whether the aggregation succeeded.
      key: is_breakdown_successful
      type: bool
    prd:
      conceptual_info: 'Aggregates raw household expenditure records into two yearly
        summaries: one grouped by spending category and one grouped by household location,
        returning the summaries as CSV strings and a success flag.'
      docstring:
        examples:
        - lines:
          - expenditure_csv = (
          - '    "Year,Category,Location,Expenditure_Amount\n"'
          - '    "2020,Food,Urban,1200.5\n"'
          - '    "2020,Housing,Rural,800.0\n"'
          - '    "2020,Food,Rural,300.0\n"'
          - '    "2021,Food,Urban,1300.0\n"'
          - '    "2021,Housing,Urban,850.0"'
          - )
          - category_spending_csv, location_spending_csv, success = compute_category_location_breakdowns(expenditure_csv)
          - print(category_spending_csv)
          - print(location_spending_csv)
          - print(success)
          output: 'Year,Category,Total_Expenditure\n2020,Food,1500.5\n2020,Housing,800.0\n2021,Food,1300.0\n2021,Housing,850.0\n

            Year,HouseholdLocation,Total_Expenditure\n2020,Urban,1200.5\n2020,Rural,1100.0\n2021,Urban,2150.0\nTrue'
        parameters:
        - description: 'CSV string produced by `fetch_household_expenditure_data`.
            Each row must contain the columns: Year, Category, Location, Expenditure_Amount.'
          name: expenditure_csv
          type: str
        raises:
        - description: If `expenditure_csv` is empty, malformed, or missing required
            columns.
          type: ValueError
        - description: If an unexpected error occurs during aggregation (e.g., non‑numeric
            expenditure values).
          type: RuntimeError
        returns:
          description: A tuple containing `(category_spending_csv, location_spending_csv,
            is_breakdown_successful)`. `category_spending_csv` lists Year, Category,
            Total_Expenditure; `location_spending_csv` lists Year, HouseholdLocation,
            Total_Expenditure; `is_breakdown_successful` signals whether the aggregation
            completed without error.
          type: Tuple[str, str, bool]
        summary: Compute yearly expenditure totals per category and per household
          location from a consolidated CSV of raw household expenditure data.
    prompt: 'Aggregate the expenditure data by Category and by Household Location.
      Output two CSV strings: one for category totals per year and one for household
      location totals per year.'
  compute_index_series:
    agent: false
    description: Compute annual alternative inflation index values from consolidated
      household expenditure data and a prescribed weighting scheme.
    name: compute_index_series
    nodes_depended_on:
    - fetch_household_expenditure_data
    - define_alternative_inflation_index
    nodes_dependent_on: []
    output_structure:
    - description: List of years for which the index was calculated.
      key: years
      type: int
    - description: Corresponding index values for each year.
      key: index_values
      type: float
    - description: Indicates whether index computation succeeded.
      key: is_index_successful
      type: bool
    prd:
      conceptual_info: Generates a time‑series of an alternative inflation index by
        weighting yearly household expenditure across categories according to a user‑defined
        methodology.
      docstring:
        examples:
        - lines:
          - expenditure_csv = """Year,Category,Location,Expenditure_Amount
          - 2020,Food,Urban,1000
          - 2020,Transport,Urban,200
          - 2020,Food,Rural,800
          - 2020,Transport,Rural,150
          - 2021,Food,Urban,1100
          - 2021,Transport,Urban,210
          - 2021,Food,Rural,850
          - 2021,Transport,Rural,160
          - '"""'
          - weights_csv = """Category,Weight
          - Food,0.6
          - Transport,0.4
          - '"""'
          - years, index_vals, success = compute_index_series(expenditure_csv, weights_csv)
          - print(years, index_vals, success)
          output: '[2020, 2021] [1220.0, 1318.0] True'
        parameters:
        - description: CSV string where each row contains Year, Category, Location,
            and Expenditure_Amount.
          name: expenditure_csv
          type: str
        - description: CSV string mapping each Category to a numeric Weight (the sum
            of weights should typically equal 1).
          name: index_weights_csv
          type: str
        raises:
        - description: If either CSV string is malformed or empty.
          type: ValueError
        - description: If a Category present in the expenditure data does not have
            a corresponding weight.
          type: KeyError
        returns:
          description: A tuple containing (years, index_values, is_index_successful).
          type: Tuple[List[int], List[float], bool]
        summary: Calculate a yearly alternative inflation index using category weights
          and raw expenditure data.
    prompt: Calculate the index value for each year by applying the defined weights
      to the expenditure data. Return a list of years and corresponding index values.
  define_alternative_inflation_index:
    agent: false
    description: Specifies the methodology and weights for an alternative inflation
      index derived from household expenditure data.
    name: define_alternative_inflation_index
    nodes_depended_on:
    - fetch_household_expenditure_data
    nodes_dependent_on: []
    output_structure:
    - description: Name of the alternative inflation index whose weights are being
        defined (e.g., 'Household-Weighted Cost-of-Living Index').
      key: index_name
      type: str
    - description: CSV string containing the category weighting scheme used in the
        alternative inflation index. Must have header 'Category,Weight' and one row
        per expenditure category, with weights normalized to sum to 1.0.
      key: index_weights_csv
      type: str
    - description: Flag indicating whether the index methodology and weights were
        successfully defined from the input expenditure data.
      key: is_methodology_successful
      type: bool
    prd:
      conceptual_info: This node consumes consolidated household expenditure data
        and defines a transparent, expenditure-share-based weighting scheme for an
        alternative inflation index. It parses the raw expenditure CSV, computes average
        budget shares by category across all available years (and, where desired,
        across locations), normalizes these into a consistent set of index weights,
        and returns the index name and a Category–Weight CSV suitable for later index
        computation.
      docstring:
        examples:
        - lines:
          - expenditure_csv = '''Year,Category,Location,Expenditure_Amount
          - 2020,Food,Urban,12000
          - 2020,Housing,Urban,18000
          - 2020,Transport,Urban,6000
          - 2021,Food,Rural,8000
          - 2021,Housing,Rural,10000
          - 2021,Transport,Rural,4000
          - ''''''''
          - index_name, index_weights_csv, ok = define_alternative_inflation_index(
          - '    expenditure_csv=expenditure_csv,'
          - '    is_data_successful=True,'
          - )
          - print(index_name)
          - print(index_weights_csv)
          - print(ok)
          output: 'Household-Weighted Cost-of-Living Index (HW-COLI)

            Category,Weight

            Food,0.3333

            Housing,0.4167

            Transport,0.2500

            True'
        - lines:
          - 'bad_expenditure_csv = ''''  # Upstream node failed or returned nothing'
          - index_name, index_weights_csv, ok = define_alternative_inflation_index(
          - '    expenditure_csv=bad_expenditure_csv,'
          - '    is_data_successful=False,'
          - )
          - print(index_name, repr(index_weights_csv), ok)
          output: ''''' '''' False'
        parameters:
        - description: CSV string produced by `fetch_household_expenditure_data` with
            schema `Year,Category,Location,Expenditure_Amount`. Each row represents
            total household expenditure in a given category, location, and year (aggregated
            from survey or administrative data). The method parses this CSV to derive
            expenditure shares by category.
          name: expenditure_csv
          type: str
        - description: Flag propagated from `fetch_household_expenditure_data`. If
            `False`, the function skips methodology definition, marks the methodology
            as unsuccessful, and returns empty outputs (rather than attempting to
            parse incomplete or missing data).
          name: is_data_successful
          type: bool
        raises:
        - description: Raised if `is_data_successful` is True but `expenditure_csv`
            is empty, missing required columns, or cannot be parsed as CSV.
          type: ValueError
        - description: Raised if the parsed CSV does not contain the required columns
            `Year`, `Category`, and `Expenditure_Amount` (case-sensitive), preventing
            computation of category shares.
          type: KeyError
        - description: Raised if total expenditure across all categories is zero after
            filtering invalid rows, making it impossible to normalize category shares
            into weights.
          type: ZeroDivisionError
        - description: Raised if, after all processing steps, no valid categories
            remain or if the resulting weights fail internal validation (e.g., negative
            weights or sum outside an acceptable tolerance).
          type: RuntimeError
        returns:
          description: 'A 3-tuple `(index_name, index_weights_csv, is_methodology_successful)`
            where:


            - `index_name` (str): Human-readable name of the alternative inflation
            index. Typically a fixed, descriptive string such as ''Household-Weighted
            Cost-of-Living Index (HW-COLI)''.

            - `index_weights_csv` (str): CSV string with header `Category,Weight`
            and one row per expenditure category. `Weight` values are non-negative
            floats that sum to 1.0 (within a small numerical tolerance). These weights
            represent long-run average household budget shares and will be used later
            by `compute_index_series`.

            - `is_methodology_successful` (bool): Indicates whether the index methodology
            was successfully specified. `True` if the input data could be parsed and
            at least one valid category weight was computed; `False` if upstream data
            failed or if methodology validation checks did not pass.'
          type: Tuple[str, str, bool]
        summary: Define an alternative inflation index and its category weights from
          consolidated household expenditure data.
    prompt: Using the expenditure CSV, define an alternative inflation index. Specify
      the index name, the weighting scheme per category (as CSV with Category,Weight),
      and any calculation method notes. Output the index name and the weights CSV.
  draft_policy_proposal:
    agent: false
    description: Drafts an evidence‑based policy proposal to improve living standards
      using analyzed alternative inflation trends and benchmark results.
    name: draft_policy_proposal
    nodes_depended_on:
    - analyze_trends_and_benchmark
    nodes_dependent_on: []
    output_structure:
    - description: Executive summary of the policy proposal, explaining the inflation
        context and overarching policy strategy.
      key: policy_proposal_summary
      type: str
    - description: Structured list (bulleted or numbered text) of concrete, actionable
        policy recommendations derived from the inflation trends.
      key: policy_recommendations
      type: str
    - description: Scalar in [0, 1] indicating overall political, fiscal, and administrative
        feasibility of the proposed package.
      key: policy_feasibility_score
      type: float
    - description: Flag indicating whether the policy proposal is grounded in a successful
        and coherent analysis of inflation trends.
      key: is_policy_successful
      type: bool
    prd:
      conceptual_info: This node transforms quantitative inflation rate series and
        a narrative trend benchmark into a structured, evidence‑based policy proposal
        aimed at improving household living standards. It interprets inflation dynamics,
        maps them to real‑world welfare impacts, formulates an actionable policy package,
        and assesses its feasibility, providing outputs that feed directly into the
        final report generation.
      docstring:
        examples:
        - lines:
          - def draft_policy_proposal(
          - '    inflation_rate_years,'
          - '    inflation_rate_values,'
          - '    trend_summary,'
          - '    is_analysis_successful,'
          - '):'
          - '    # Implementation omitted in this example; logic follows the PRD.'
          - '    ...'
          - years = [2018, 2019, 2020, 2021, 2022]
          - rates = [1.8, 2.1, 1.5, 4.3, 5.0]
          - trend_text = (
          - '    "Alternative index shows mild inflation pre‑2020, "'
          - '    "then a sharp, broad‑based acceleration in 2021–2022, "'
          - '    "outpacing official CPI particularly in housing and food."'
          - )
          - result = draft_policy_proposal(
          - '    inflation_rate_years=years,'
          - '    inflation_rate_values=rates,'
          - '    trend_summary=trend_text,'
          - '    is_analysis_successful=True,'
          - )
          - print(result["policy_feasibility_score"])
          - print(result["is_policy_successful"])
          - print(result["policy_proposal_summary"].split(".\n")[0])
          output: '0.55

            True

            "The alternative inflation index indicates a recent surge in cost pressures,
            particularly in essential categories such as housing and food"'
        - lines:
          - 'years = []  # Upstream analysis effectively failed'
          - rates = []
          - 'trend_text = ""  # No usable narrative summary'
          - result = draft_policy_proposal(
          - '    inflation_rate_years=years,'
          - '    inflation_rate_values=rates,'
          - '    trend_summary=trend_text,'
          - '    is_analysis_successful=False,'
          - )
          - print(result["policy_feasibility_score"])
          - print(result["is_policy_successful"])
          - print(result["policy_recommendations"].splitlines()[0])
          output: '0.35

            False

            "Short‑term (generic, data‑light measures):"'
        parameters:
        - description: Sequential list of calendar years corresponding to each computed
            year‑over‑year inflation rate from the alternative index. Must be aligned
            one‑to‑one with `inflation_rate_values`.
          name: inflation_rate_years
          type: List[int]
        - description: List of year‑over‑year inflation rates (percent changes) for
            the alternative inflation index, expressed as percentages (e.g., 3.2 means
            3.2% inflation) and aligned with `inflation_rate_years`.
          name: inflation_rate_values
          type: List[float]
        - description: Narrative summary from the preceding analysis step describing
            long‑term inflation trends, volatility, structural shifts, and benchmarking
            against the current CPI or other official measures.
          name: trend_summary
          type: str
        - description: Indicator from the parent node specifying whether the inflation
            trend computation and benchmarking were successful and internally consistent.
            Drives whether the policy proposal is data‑driven or a conservative generic
            template.
          name: is_analysis_successful
          type: bool
        raises:
        - description: Raised if `is_analysis_successful` is True but the analysis
            inputs are structurally inconsistent (e.g., mismatched lengths of `inflation_rate_years`
            and `inflation_rate_values`, empty lists, or an empty `trend_summary`).
          type: ValueError
        - description: Raised if input types do not match the expected signatures
            (e.g., non‑numeric values in `inflation_rate_values`, non‑integer years,
            or non‑string `trend_summary`).
          type: TypeError
        returns:
          description: 'Dictionary containing the drafted policy proposal fields:
            `policy_proposal_summary` (str), `policy_recommendations` (str), `policy_feasibility_score`
            (float in [0, 1]), and `is_policy_successful` (bool).'
          type: Dict[str, object]
        summary: Draft an evidence‑based policy proposal using alternative inflation
          trend analysis, producing a summary, concrete recommendations, and a feasibility
          score.
    prompt: "Using the trend summary and inflation rates, craft a policy proposal\
      \ to improve living standards. Include a brief summary, a list of actionable\
      \ recommendations, and a feasibility score between 0 and 1.\n\nYou are given\
      \ the outputs of the inflation trend analysis step:\n- `inflation_rate_years`:\
      \ List of years corresponding to calculated inflation rates.\n- `inflation_rate_values`:\
      \ List of inflation rates (% year‑over‑year change) for each year.\n- `trend_summary`:\
      \ Narrative summary of inflation trends and benchmark results.\n- `is_analysis_successful`:\
      \ Whether the trend analysis succeeded.\n\nUsing ONLY this information:\n1.\
      \ Interpret the long‑term inflation dynamics (e.g., persistently high, volatile,\
      \ or stable), especially where they diverge from benchmark CPI.\n2. Identify\
      \ how these dynamics likely affect household living standards (real purchasing\
      \ power, vulnerability of different groups, cost of essentials, regional or\
      \ temporal stress points if inferable from the trend summary).\n3. Propose a\
      \ coherent policy package that:\n   - Targets the specific issues revealed by\
      \ the alternative inflation index trends.\n   - Prioritizes measures that are\
      \ realistically implementable in a typical OECD‑style policy environment.\n\
      \   - Clearly distinguishes short‑term relief measures from medium‑/long‑term\
      \ structural reforms.\n4. For each recommendation, ensure it is specific and\
      \ actionable (e.g., “expand benefit X indexed to alternative inflation measure”\
      \ rather than “improve social safety nets”).\n5. Assess the overall political,\
      \ fiscal, and administrative feasibility of the proposed package and convert\
      \ it into a scalar feasibility score between 0 and 1, where:\n   - 0.0–0.3:\
      \ Low feasibility (politically contentious, fiscally heavy, or administratively\
      \ complex).\n   - 0.3–0.7: Moderate feasibility (mix of easy and harder measures;\
      \ requires trade‑offs).\n   - 0.7–1.0: High feasibility (largely incremental,\
      \ low‑cost, or widely acceptable measures).\n6. If `is_analysis_successful`\
      \ is False or the inputs are clearly inconsistent (e.g., lengths of years and\
      \ values differ, missing trend_summary), you MUST:\n   - Produce a conservative,\
      \ generic policy template that does not overinterpret the data.\n   - Clearly\
      \ reflect reduced confidence in the summary.\n   - Set `is_policy_successful`\
      \ to False and choose a feasibility score in [0.2, 0.5].\n\nOutput a structured\
      \ response with:\n- `policy_proposal_summary`: 1–3 paragraphs in plain text,\
      \ providing an executive summary of the inflation situation and the broad policy\
      \ approach to improving living standards.\n- `policy_recommendations`: A clearly\
      \ delimited list (bullets or numbered) of concrete, actionable policy measures,\
      \ grouped where appropriate into short‑term, medium‑term, and long‑term recommendations.\n\
      - `policy_feasibility_score`: A float between 0 and 1 (inclusive) capturing\
      \ your best estimate of feasibility, consistent with the constraints above.\n\
      - `is_policy_successful`: Boolean flag indicating whether the proposal is based\
      \ on a successful and coherent analysis of trends."
  fetch_household_expenditure_data:
    agent: false
    description: Gather and consolidate US household expenditure data from official
      statistical sources into a normalized CSV format for downstream inflation index
      calculation and analysis.
    name: fetch_household_expenditure_data
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: 'CSV string of consolidated household expenditure data with columns:
        Year, Category, Location, Expenditure_Amount.'
      key: expenditure_csv
      type: str
    - description: Flag indicating whether data discovery, download, normalization,
        and CSV consolidation completed successfully.
      key: is_data_successful
      type: bool
    prd:
      conceptual_info: This node bootstraps the entire alternative inflation workflow
        by discovering, downloading, and harmonizing US household expenditure data
        (e.g., from the Consumer Expenditure Survey) across all available years into
        a single, schema-consistent CSV string. It abstracts away source-specific
        complexities so that downstream nodes can treat the data as a uniform panel
        of Year–Category–Location–Expenditure_Amount records.
      docstring:
        examples:
        - lines:
          - result = fetch_household_expenditure_data()
          - result.keys()
          output: dict_keys(['expenditure_csv', 'is_data_successful'])
        - lines:
          - result = fetch_household_expenditure_data()
          - print(result['is_data_successful'])
          - print('\n'.join(result['expenditure_csv'].splitlines()[:5]))
          output: 'True

            Year,Category,Location,Expenditure_Amount

            2005,Housing,Northeast,12345.67

            2005,Food,Northeast,4567.89

            2005,Transportation,Midwest,2345.10

            2005,Healthcare,South,1678.45'
        parameters: []
        raises:
        - description: If official data sources (e.g., BLS Consumer Expenditure Survey
            endpoints or bulk download servers) are unreachable, time out, or return
            HTTP errors during retrieval.
          type: ConnectionError
        - description: If downloaded datasets cannot be aligned to the required schema
            (missing essential fields like year, category, location, or expenditure;
            or irreconcilable category/location codings).
          type: ValueError
        - description: If no valid expenditure records are obtained after processing
            all available sources/years, or if the final consolidated dataset is empty.
          type: RuntimeError
        - description: If an internal CSV serialization error occurs while converting
            cleaned tabular data into a single CSV text blob.
          type: CSVError
        returns:
          description: "Dictionary with consolidated CSV data and a success flag.\n\
            \nKeys\n----\nexpenditure_csv : str\n    A single CSV string containing\
            \ household expenditure records harmonized across all available years.\n\
            \    The minimal required schema is::\n\n        Year,Category,Location,Expenditure_Amount\n\
            \        2005,Housing,Northeast,12345.67\n        2005,Food,Midwest,2345.89\n\
            \        ...\n\n    Where:\n    * ``Year`` is a four-digit integer year.\n\
            \    * ``Category`` is a normalized expenditure category label (e.g.,\
            \ 'Housing', 'Food', 'Transportation').\n    * ``Location`` is a normalized\
            \ household location descriptor (e.g., Census region, division, or metro/non-metro).\n\
            \    * ``Expenditure_Amount`` is a numeric value representing annual household\
            \ expenditure in inflation-unadjusted currency units.\n\nis_data_successful\
            \ : bool\n    Indicates whether the data fetch and consolidation workflow\
            \ completed without critical errors. Must be ``True`` for downstream nodes\
            \ to rely on ``expenditure_csv``."
          type: dict[str, object]
        summary: Fetch, normalize, and consolidate US household expenditure data from
          official sources into a single CSV suitable for inflation index construction
          and breakdown analyses.
    prompt: Collect US household expenditure data from official sources (e.g., Consumer
      Expenditure Survey) for all available years. Consolidate the data into a single
      CSV string where each row contains Year, Category, Location, and Expenditure_Amount.
  generate_historical_timeline:
    agent: false
    description: Build a comprehensive historical timeline report by joining the annual
      index series with per‑year category and household‑location expenditure breakdowns
      into a single, analysis‑ready CSV.
    name: generate_historical_timeline
    nodes_depended_on:
    - compute_index_series
    - compute_category_location_breakdowns
    nodes_dependent_on: []
    output_structure:
    - description: 'CSV string of the historical timeline with columns: Year,Index,CategoryTotals,LocationTotals.
        CategoryTotals and LocationTotals are JSON‑encoded mappings aggregated per
        year.'
      key: timeline_report_csv
      type: str
    - description: Flag indicating whether the timeline was generated successfully
        from the index series and breakdown CSVs.
      key: is_timeline_successful
      type: bool
    prd:
      conceptual_info: This node merges the computed alternative inflation index series
        with annual category‑wise and household‑location‑wise spending breakdowns,
        producing a single historical timeline CSV that downstream nodes can use for
        trend analysis and benchmarking.
      docstring:
        examples:
        - lines:
          - from pprint import pprint
          - years = [2020, 2021]
          - index_values = [100.0, 103.5]
          - is_index_successful = True
          - category_spending_csv = (
          - '    ''Year,Category,TotalExpenditure\n'''
