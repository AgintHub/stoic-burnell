          type: dict
        - description: 'Performance thresholds guiding the evaluation. Optional; defaults
            applied if absent. Suggested keys: min_cumulative_return (float), min_sharpe_ratio
            (float), max_drawdown_allowed (float), min_win_rate (float), benchmark
            (float, optional), consider_costs (bool, optional).'
          name: objectives
          type: dict
        raises:
        - description: Raised if required metrics are missing and cannot be reasonably
