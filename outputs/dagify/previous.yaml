          type: dict
        summary: Compute a structured performance assessment from backtest metrics,
          comparing them to predefined objectives. Return a dictionary conforming
          to the node's output_structure with diagnostic narrative and improvement
          guidance.
    prompt: "Analyze the backtest results produced by the run_backtest node and determine\
      \ whether the strategy meets predefined performance objectives. Produce a structured\
      \ JSON object with the following fields:\n- meets_performance_goals (bool):\
      \ Whether all objectives are satisfied given the backtest results and any applicable\
      \ thresholds.\n- cumulative_return (float): Cumulative return over the backtest\
      \ period, after accounting for transaction costs if applicable.\n- sharpe_ratio\
      \ (float): Risk-adjusted return, computed as the average excess return over\
      \ the risk-free rate divided by the standard deviation of returns; use the same\
      \ risk-free reference as in your backtest configuration.\n- max_drawdown (float):\
      \ Maximum peak-to-trough decline observed during the backtest, expressed as\
      \ a negative percentage (e.g., -0.25 for -25%).\n- win_rate (float): Percentage\
      \ of trades that were profitable.\n- strengths (List[str]): Concise statements\
      \ identifying robust aspects of the strategy as evidenced by the backtest.\n\
      - weaknesses (List[str]): Concise statements identifying vulnerabilities or\
      \ limitations exposed by the backtest.\n\nInputs and defaults:\n- backtest_metrics:\
      \ object provided by run_backtest with at least the following keys: cumulative_return\
      \ (float), sharpe_ratio (float), max_drawdown (float), win_rate (float). Optional\
      \ keys (if available in your environment) include annualized_return, max_drawdown_duration,\
      \ and drawdown_series.\n- objectives (optional): object with predefined thresholds.\
      \ If not provided, the node should apply these sensible defaults:\n  - min_cumulative_return:\
      \ 0.15 (15% over the backtest period)\n  - min_sharpe_ratio: 0.8\n  - max_drawdown_allowed:\
      \ -0.25 (maximum tolerable drawdown of 25%)\n  - min_win_rate: 0.4 (40%)\n \
      \ - optional: benchmark_return and benchmark_volatility for relative performance\
      \ context\n\nProcedure (step-by-step):\n1) Ingest backtest_metrics from run_backtest\
      \ and validate required fields exist. If any are missing, gracefully handle\
      \ with fallbacks and annotate limitations in the narrative.\n2) Normalize/interpret\
      \ metrics consistently: ensure cumulative_return is expressed as a decimal (e.g.,\
      \ 0.18 for 18%), max_drawdown as a negative decimal, and win_rate as a decimal\
      \ (0–1).\n3) Load performance objectives (from inputs or defaults) and document\
      \ the thresholds used for this evaluation.\n4) Compute meets_performance_goals\
      \ by evaluating each objective against the corresponding metric. Require all\
      \ primary objectives to be satisfied unless a weighted or conditional rule is\
      \ explicitly configured in objectives.\n5) Compile a narrative assessment that\
      \ explains which objectives were met or missed, and quantify the degree of alignment\
      \ for each metric (e.g., “Sharpe = 0.92, meets threshold by 0.12”).\n6) Surface\
      \ strengths by identifying stable profits, favorable risk-adjusted performance,\
      \ drawdown recovery characteristics, consistency across trades, and robustness\
      \ to small data perturbations.\n7) Surface weaknesses by identifying high drawdown\
      \ episodes, sensitivity to costs, inconsistent win rate, or metrics with large\
      \ confidence intervals due to sample size.\n8) Provide actionable recommendations\
      \ to improve performance, including potential parameter tweaks, risk controls\
      \ (e.g., stop-loss adjustments, position sizing rules), or data quality improvements.\n\
      9) Attach caveats relevant to backtest biases (look-ahead bias, survivorship\
      \ bias, data-snooping), and clarify how those biases could affect the interpretation\
      \ of results.\n10) Return the results strictly in the fields defined by output_structure,\
      \ preserving types and order for downstream nodes.\n\nOutput expectations:\n\
      - The returned values should be derived directly from backtest_metrics and the\
      \ thresholds in objectives; avoid introducing new metrics in this step unless\
      \ they are already part of the backtest outputs.\n- If objectives are not met,\
      \ provide clear justification in the narrative but still populate all fields\
      \ with the best-available numbers.\n- Ensure the final JSON mirrors the exact\
      \ structure defined in output_structure for downstream consumption."
  evaluate_backtest_risk:
    agent: false
    description: Delivers a detailed risk analysis and evaluation of market exposures
      from the backtested strategy returns, including metrics such as volatility,
      Value-at-Risk, Expected Shortfall, and tail risk, while also assessing position
      concentration and liquidity impact.
    name: evaluate_backtest_risk
    nodes_depended_on:
