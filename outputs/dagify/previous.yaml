            \ year.\n  - `CategoryTotals` (str): JSON‑encoded object mapping category\
            \ names to annual expenditure totals for that year, e.g. `{\"Housing\"\
            : 1234.5, \"Food\": 987.6}`.\n  - `LocationTotals` (str): JSON‑encoded\
            \ object mapping household location labels to annual expenditure totals\
            \ for that year, e.g. `{\"Urban\": 5000.0, \"Rural\": 2300.0}`.\n\n- `is_timeline_successful`\
            \ (bool): True if and only if upstream dependencies reported success and\
            \ the CSVs could be parsed, joined, and serialized without error."
          type: Dict[str, Any]
        summary: Generate a historical timeline CSV by combining the index series
          with category and location expenditure breakdowns on a per‑year basis.
    prompt: 'Combine the index series and the category/household‑location breakdowns
      into a single historical timeline report. Output the report as a CSV string
      with columns: Year,Index,CategoryTotals,LocationTotals.'
  produce_final_report:
    agent: false
    description: Generate the final narrative report that compiles the policy proposal
      summary, recommendations, and feasibility score into a coherent document ready
      for dissemination.
    name: produce_final_report
    nodes_depended_on:
    - draft_policy_proposal
    nodes_dependent_on: []
    output_structure:
    - description: Complete, human-readable report text that compiles the policy proposal
        summary, recommendations, feasibility score, and a brief conclusion into a
        single narrative document suitable for stakeholders.
      key: final_report_text
      type: str
    - description: Boolean flag indicating whether the final report generation succeeded
        given the inputs (e.g., upstream policy proposal was successful and the report
        text was assembled without critical issues).
      key: is_report_successful
      type: bool
    prd:
      conceptual_info: This node converts the structured policy proposal produced
        by `draft_policy_proposal` into a polished final report text that is ready
        to be shared with policymakers and stakeholders. It validates that the policy
        proposal was successfully generated, then weaves together the executive summary,
        recommendations, and feasibility score into a coherent, consistently formatted
        narrative, appending a short concluding statement that emphasizes implications
        and next steps. The result is a single text block plus a success flag.
      docstring:
        examples:
        - lines:
          - 'def produce_final_report(policy_proposal_summary: str,'
          - '                        policy_recommendations: str,'
          - '                        policy_feasibility_score: float,'
          - '                        is_policy_successful: bool,'
          - '                        conclusion_template: str | None = None,'
          - '                        title: str | None = None) -> dict[str, object]:'
          - '    # Example implementation sketch (simplified):'
          - '    if not is_policy_successful:'
          - '        raise ValueError(''Upstream policy proposal failed; cannot generate
            final report.'')'
          - '    if not isinstance(policy_proposal_summary, str) or not isinstance(policy_recommendations,
            str):'
          - '        raise TypeError(''Summary and recommendations must be strings.'')'
          - '    if not isinstance(policy_feasibility_score, (float, int)):'
          - '        raise TypeError(''Feasibility score must be a float.'')'
          - '    policy_feasibility_score = float(policy_feasibility_score)'
          - '    if not 0.0 <= policy_feasibility_score <= 1.0:'
          - '        raise ValueError(''Feasibility score must be in [0.0, 1.0].'')'
          - '    if title is None:'
          - '        title = ''Policy Brief on Alternative Inflation Index and Living
            Standards'''
          - '    feasibility_str = f"Overall Feasibility Score: {policy_feasibility_score:.2f}
            (0=low, 1=high)"'
          - '    if conclusion_template is None:'
          - '        if policy_feasibility_score >= 0.7:'
          - '            conclusion = ("In conclusion, the proposed measures are broadly
            feasible and, if "'
          - '                          "implemented, are likely to materially improve
            living standards under "'
          - '                          "the observed inflation dynamics.")'
          - '        elif policy_feasibility_score >= 0.4:'
          - '            conclusion = ("In conclusion, while the proposal presents
            promising avenues for "'
          - '                          "improving living standards, several implementation
            risks must be "'
          - '                          "managed for successful execution.")'
          - '        else:'
          - '            conclusion = ("In conclusion, the proposed measures face
            significant feasibility "'
          - '                          "challenges and should be refined or piloted
            before full-scale "'
          - '                          "adoption.")'
          - '    else:'
          - '        conclusion = conclusion_template.format(feasibility_score=policy_feasibility_score)'
          - '    # Assemble simple structured report'
          - '    sections = ['
          - '        title,'
          - '        "",'
          - '        "1. Executive Summary",'
          - '        policy_proposal_summary.strip(),'
          - '        "",'
          - '        "2. Policy Recommendations",'
          - '        policy_recommendations.strip(),'
          - '        "",'
          - '        "3. Feasibility Assessment",'
          - '        feasibility_str,'
          - '        "",'
          - '        "4. Conclusion",'
          - '        conclusion.strip(),'
          - '    ]'
          - '    final_report_text = "\n".join(sections).strip()'
          - '    return {'
          - '        ''final_report_text'': final_report_text,'
          - '        ''is_report_successful'': True,'
          - '    }'
          - '# Example usage:'
          - result = produce_final_report(
          - '    policy_proposal_summary=("This brief evaluates an alternative inflation
            index that "'
          - '                             "more accurately reflects household expenditure
            patterns and "'
          - '                             "proposes targeted support for vulnerable
            groups."),'
          - '    policy_recommendations=("- Expand housing vouchers in high-inflation
            metros.\n"'
          - '                            "- Index targeted cash transfers to the alternative
            index.\n"'
          - '                            "- Introduce temporary transport subsidies
            in regions with "'
          - '                            "above-median cost-of-living growth."),'
          - '    policy_feasibility_score=0.78,'
          - '    is_policy_successful=True'
          - )
          - print(result['is_report_successful'])
          - 'print(result[''final_report_text''].split(''\n'')[0])  # Print the title
            line only'
          output: 'True

            Policy Brief on Alternative Inflation Index and Living Standards'
        - lines:
          - '# Example with a custom title and conclusion template, and a mid-range
            feasibility score'
          - result = produce_final_report(
          - '    policy_proposal_summary=("Inflation pressures have been uneven across
            categories and "'
          - '                             "locations. The proposed measures aim to
            ease the burden on "'
          - '                             "low-income households while preserving
            fiscal sustainability."),'
          - '    policy_recommendations=("1) Calibrate minimum wage adjustments using
            the alternative index.\n"'
          - '                            "2) Expand access to childcare subsidies
            in high-cost regions."),'
          - '    policy_feasibility_score=0.55,'
          - '    is_policy_successful=True,'
          - '    conclusion_template=("Based on a feasibility score of {feasibility_score:.2f},
            the proposal "'
          - '                        "warrants phased implementation with robust monitoring
            and evaluation."),'
          - '    title="Targeted Policy Options Under an Alternative Inflation Metric"'
          - )
          - print(result['is_report_successful'])
          - print("--- Report preview ---")
          - print("\n".join(result['final_report_text'].split('\n')[-3:]))
          output: 'True

            --- Report preview ---

            4. Conclusion

            Based on a feasibility score of 0.55, the proposal warrants phased implementation
            with robust monitoring and evaluation.'
        parameters:
        - description: Executive summary of the policy proposal produced by the `draft_policy_proposal`
            node. This should concisely describe the context, key findings, and overall
            policy direction derived from the inflation trend analysis.
          name: policy_proposal_summary
          type: str
        - description: Structured list or narrative of concrete policy recommendations
            generated by `draft_policy_proposal`. This can be formatted as bullet
            points, numbered items, or a paragraph list, and is inserted as the core
            recommendations section of the final report.
          name: policy_recommendations
          type: str
        - description: Feasibility score between 0.0 and 1.0 generated by `draft_policy_proposal`,
            indicating how realistic and implementable the overall policy package
            is, given political, economic, and operational constraints. This value
            is formatted and surfaced prominently in the report.
          name: policy_feasibility_score
          type: float
        - description: Flag produced by `draft_policy_proposal` indicating whether
            the policy proposal was successfully generated. If this is False, the
            node should not emit a normal report and instead fail or return an error
            state.
          name: is_policy_successful
          type: bool
        - description: Optional template or override text for the concluding statement.
            If provided, it may contain placeholders such as '{feasibility_score}'
            that will be formatted with the final score. If None, a default, concise
            conclusion is generated that summarizes the implications and suggests
            next steps.
          name: conclusion_template
          type: str | None
        - description: Optional report title to be placed at the top of the final
            report text (e.g., 'Alternative Inflation Index Policy Brief'). If None,
            a generic but descriptive default title is used.
          name: title
          type: str | None
        raises:
        - description: Raised if `is_policy_successful` is False, indicating that
            the upstream policy proposal failed and a coherent report cannot be constructed.
          type: ValueError
        - description: Raised if input types are incompatible with the specification
            (e.g., `policy_proposal_summary` is not a string or `policy_feasibility_score`
            is not a float).
          type: TypeError
        - description: Raised if `policy_feasibility_score` is outside the expected
            [0.0, 1.0] range, since the final report depends on a normalized feasibility
            measure.
          type: ValueError
        returns:
          description: "A dictionary containing the final report payload.\n\nKeys\n\
            ----\nfinal_report_text : str\n    Complete, formatted report text string\
            \ that includes an optional title, an executive summary section, recommendations\
            \ section, feasibility score section, and a short concluding statement.\n\
            is_report_successful : bool\n    True if the report was successfully generated\
            \ (inputs valid, upstream proposal successful), otherwise False if an\
            \ error state is handled without raising, depending on integration."
          type: dict[str, object]
        summary: Compile the drafted policy proposal into a coherent final report
          text, including summary, recommendations, feasibility score, and a short
          conclusion.
    prompt: Compile the policy proposal into a final report text. Include the summary,
      recommendations, feasibility score, and a short concluding statement.
