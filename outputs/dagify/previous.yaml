dag_type: plain_text
description: DAG workflow generation for transforming a text-based process description
  into a structured directed acyclic graph (DAG) representation with fully connected,
  concurrent nodes
name: create_dag_from_process
nodes:
  establish_node_dependencies:
    agent: false
    description: Implement dependencies between DAG nodes
    name: establish_node_dependencies
    nodes_depended_on:
    - identify_dependencies
    nodes_dependent_on:
    - validate_dag
    prompt: Create explicit forward-directed dependencies between DAG nodes based
      on the identified relationships. Ensure each dependency is directly traceable
      from the source process description.
  format_dag:
    agent: false
    description: Structure DAG into execution-ready format
    name: format_dag
    nodes_depended_on:
    - validate_dag
    nodes_dependent_on:
    - output_dag
    prompt: Convert the validated DAG structure into the standardized JSON execution
      format (name, description, nodes_depended_on, nodes_dependent_on, prompt). Ensure
      all required fields are explicitly defined and properly formatted.
  identify_dependencies:
    agent: false
    description: Extract direct dependencies between tasks
    name: identify_dependencies
    nodes_depended_on:
    - parse_process_description
    nodes_dependent_on:
    - establish_node_dependencies
    prompt: From the extracted process description, identify direct execution dependencies
      between tasks. Specify which tasks must complete before each dependent task
      can execute, ensuring no circular dependencies are present.
  identify_tasks:
    agent: false
    description: Extract atomic tasks from the process description
    name: identify_tasks
    nodes_depended_on:
    - parse_process_description
    nodes_dependent_on:
    - map_tasks_to_dag_nodes
    prompt: From the extracted process components, isolate each individual atomic
      task. Each task must produce a single outcome and accept only direct inputs.
      Specify each task's name, description, and input requirements.
  map_tasks_to_dag_nodes:
    agent: false
    description: Convert atomic tasks to DAG nodes
    name: map_tasks_to_dag_nodes
    nodes_depended_on:
    - identify_tasks
    nodes_dependent_on:
    - validate_dag
    - format_dag
    prompt: Transform each isolated atomic task into a formal DAG node structure.
      Define clear input/output boundaries, ensure statelessness, and represent each
      task as a self-contained execution unit.
  output_dag:
    agent: false
    description: Generate final DAG representation
    name: output_dag
    nodes_depended_on:
    - format_dag
    nodes_dependent_on: []
    prompt: Produce the final DAG representation as a properly escaped JSON object
      showing complete workflow structure with step dependencies, node relationships,
      and execution instructions.
  parse_process_description:
    agent: false
    description: Extract core components from text-based process description
    name: parse_process_description
    nodes_depended_on: []
    nodes_dependent_on:
    - identify_tasks
    - identify_dependencies
    prompt: Analyze the provided text-based process description to extract its core
      components including specific tasks, inputs, outputs, and logical dependencies.
      Return only a structured summary with these elements clearly labeled.
  validate_dag:
    agent: false
    description: Ensure acyclicity and connectivity
    name: validate_dag
    nodes_depended_on:
    - map_tasks_to_dag_nodes
    - establish_node_dependencies
    nodes_dependent_on:
    - format_dag
    prompt: Verify the DAG satisfies acyclicity requirements (no circular dependencies)
      and maintains full connectivity between all nodes. Ensure each node has clear
      dependency relationships and no isolated branches.
