      \ (VaR) of the backtest returns at 95% confidence level\")\n    )\n    expected_shortfall:\
      \ float = (\n        Field(..., description=\"Expected Shortfall (ES) of the\
      \ backtest returns at 95% confidence level\")\n    )\n    max_drawdown: float\
      \ = (\n        Field(..., description=\"Maximum drawdown of the backtest returns\"\
      )\n    )\n    tail_risk: List[float] = (\n        Field(..., description=\"\
      List of tail risk metrics (e.g., 1% and 5% quantile returns)\")\n    )\n   \
      \ position_concentration: float = (\n        Field(..., description=\"Herfindahl-Hirschman\
      \ Index (HHI) of position concentration\")\n    )\n    liquidity_impact: float\
      \ = (\n        Field(..., description=\"Estimated liquidity impact of the strategy\
      \ (e.g., price impact, slippage)\")\n    )\n\n\nclass DesignRiskControlsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for design_risk_controls node outputs.\"\"\"\n   \
      \ position_limits: List[float] = (\n        Field(..., description=\"List of\
      \ position limits for each asset\")\n    )\n    var_constraints: List[float]\
      \ = (\n        Field(..., description=\"List of Value-at-Risk (VaR) constraints\
      \ for each asset\")\n    )\n    stop_loss_thresholds: List[float] = (\n    \
      \    Field(..., description=\"List of stop-loss thresholds for each asset\"\
      )\n    )\n    risk_control_rules: List[str] = (\n        Field(..., description=\"\
      List of risk control rules\")\n    )\n    is_risk_control_satisfied: bool =\
      \ (\n        Field(..., description=\"Whether the risk control rules are satisfied\"\
      )\n    )\n\n\ndef design_risk_controls(evaluate_backtest_risk_input: EvaluateBacktestRiskOutput,\
      \ **kwargs) -> DesignRiskControlsOutput:\n    \"\"\"\n    Designs and implements\
      \ risk management controls for live trading.\n\n    Parameters\n    ----------\n\
      \    backtest_risk_metrics : dict\n        Input risk metrics from the evaluate_backtest_risk\
      \ node.\n    risk_tolerance : dict\n        Risk tolerance parameters, including\
