dag_type: plain_text
description: Generates and displays a placeholder API key.
name: display_api_key
nodes:
  generate_api_key:
    agent: false
    description: Generates a mock API key for demonstration purposes.
    name: generate_api_key
    nodes_depended_on: []
    nodes_dependent_on:
    - output_api_key
    prompt: Create a random placeholder API key formatted as a typical alphanumeric
      token (e.g., 32 characters, uppercase letters and digits). Do not access any
      real secret stores; just produce a mock key.
  output_api_key:
    agent: false
    description: Outputs the generated API key to the user.
    name: output_api_key
    nodes_depended_on:
    - generate_api_key
    nodes_dependent_on: []
    prompt: Print the API key generated by the previous step in plain text.
