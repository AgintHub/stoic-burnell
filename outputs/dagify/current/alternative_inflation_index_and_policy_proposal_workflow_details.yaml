dag_type: spec
description: A fully typed, concurrent workflow that gathers US household expenditure
  data, constructs an alternative inflation index with category and location breakdowns,
  builds a historical timeline, analyzes inflation trends, and crafts a policy proposal
  to improve living standards.
name: alternative_inflation_index_and_policy_proposal_workflow
nodes:
  analyze_trends_and_benchmark:
    agent: false
    description: Analyze inflation trends and benchmark against existing measures.
    name: analyze_trends_and_benchmark
    nodes_depended_on:
    - generate_historical_timeline
    nodes_dependent_on:
    - draft_policy_proposal
    output_structure:
    - description: Years corresponding to calculated inflation rates.
      key: inflation_rate_years
      type: List[int]
    - description: Inflation rates (% change) for each year.
      key: inflation_rate_values
      type: List[float]
    - description: Narrative summary of inflation trends and benchmark results.
      key: trend_summary
      type: str
    - description: Whether trend analysis succeeded.
      key: is_analysis_successful
      type: bool
    prd:
      conceptual_info: This node transforms a historical timeline CSV that contains
        annual index values into quantitative year‑to‑year inflation rates, then synthesizes
        a concise narrative describing long‑term inflation dynamics and comparing
        them to the current Consumer Price Index (CPI). The output enables downstream
        policy drafting by providing clear metrics and an analytical context.
      docstring:
        examples:
        - lines:
          - '# Minimal timeline CSV example'
          - csv_data = """Year,Index,CategoryTotals,LocationTotals
          - 2015,100.0,20000,30000
          - 2016,105.0,21000,31000
          - 2017,110.0,22000,32000"""
          - '# Run the analysis'
          - years, rates, summary, success = analyze_trends_and_benchmark(csv_data,
            True)
          - '# Expected outputs'
          - 'print(years)   # [2016, 2017]'
          - 'print(rates)   # [5.0, 4.761904761904762]'
          - 'print(summary) # ''Inflation rates show a modest slowdown, with 2016
            at 5.0% and 2017 at 4.76%. Compared to the CPI, the alternative index
            is 0.5 percentage points higher in 2016 and 1.0 percentage points higher
            in 2017.'''
          - 'print(success) # True'
          output: '"""

            [2016, 2017]

            [5.0, 4.761904761904762]

            ''Inflation rates show a modest slowdown, with 2016 at 5.0% and 2017 at
            4.76%. Compared to the CPI, the alternative index is 0.5 percentage points
            higher in 2016 and 1.0 percentage points higher in 2017.''

            True

            """'
        parameters:
        - description: 'CSV string with columns: Year,Index,CategoryTotals,LocationTotals.
            The Index column contains the annual value of the alternative inflation
            index.'
          name: timeline_report_csv
          type: str
        - description: Flag indicating whether the timeline generation succeeded.
            If False, analysis should abort early.
          name: is_timeline_successful
          type: bool
        raises:
        - description: If `is_timeline_successful` is False or the CSV does not contain
            the required columns.
          type: ValueError
        - description: If inflation rate computation fails due to insufficient data
            points.
          type: RuntimeError
        returns:
          description: 'A tuple containing: 1) list of years with calculated inflation
            rates, 2) list of % change inflation rates, 3) a concise trend summary
            string, 4) boolean success flag.'
          type: Tuple[List[int], List[float], str, bool]
        summary: Compute inflation rates from a historical timeline and generate a
          trend summary.
    prompt: Compute year‑to‑year inflation rates from the index values, summarize
      long‑term trends, and benchmark against the current CPI. Return the inflation
      rate series and a concise trend summary string.
  compute_category_location_breakdowns:
    agent: false
    description: Create category‑wise and location‑wise expenditure breakdowns from
      consolidated household expenditure data.
    name: compute_category_location_breakdowns
    nodes_depended_on:
    - fetch_household_expenditure_data
    nodes_dependent_on:
    - generate_historical_timeline
    output_structure:
    - description: CSV string containing Year, Category, and the total expenditure
        for that category in that year.
      key: category_spending_csv
      type: str
    - description: CSV string containing Year, Location, and the total expenditure
        for that location in that year.
      key: location_spending_csv
      type: str
    - description: Flag indicating whether the aggregation succeeded.
      key: is_breakdown_successful
      type: bool
    prd:
      conceptual_info: Aggregates raw household expenditure records into summarized
        yearly totals by category and by location, facilitating further index and
        trend analysis.
      docstring:
        examples:
        - lines:
          - sample_csv = "Year,Category,Location,Expenditure_Amount\n2020,Food,NY,12000\n2020,Food,CA,13000\n2020,Utilities,NY,8000\n2021,Food,NY,12500\n2021,Utilities,CA,9000"
          - cat_csv, loc_csv, success = compute_category_location_breakdowns(sample_csv)
          - print(cat_csv)
          - print(loc_csv)
          - print(success)
          output: Year,Category,Total_Expenditure\n2020,Food,25000\n2020,Utilities,8000\n2021,Food,12500\n2021,Utilities,9000\nYear,Location,Total_Expenditure\n2020,NY,20000\n2020,CA,13000\n2021,NY,12500\n2021,CA,9000\nTrue
        - lines:
          - empty_csv = ""
          - 'try:'
          - '    compute_category_location_breakdowns(empty_csv)'
          - 'except ValueError as e:'
          - '    print(e)'
          output: 'ValueError: expenditure_csv must contain data and include columns
            Year, Category, Location, Expenditure_Amount.'
        parameters:
        - description: CSV string produced by `fetch_household_expenditure_data`.
            Each row must contain `Year,Category,Location,Expenditure_Amount`.
          name: expenditure_csv
          type: str
        raises:
        - description: Raised if `expenditure_csv` is empty, malformed, or missing
            required columns.
          type: ValueError
        returns:
          description: "A tuple containing:\n  1. `category_spending_csv`: CSV of\
            \ `Year,Category,Total_Expenditure`.\n  2. `location_spending_csv`: CSV\
            \ of `Year,Location,Total_Expenditure`.\n  3. `is_breakdown_successful`:\
            \ Boolean flag."
          type: Tuple[str, str, bool]
        summary: Aggregates expenditure data into yearly category and location totals.
    prompt: 'Aggregate the expenditure data by Category and by Location. Output two
      CSV strings: one for category totals per year and one for location totals per
      year.'
  compute_index_series:
    agent: false
    description: Compute annual alternative inflation index values from consolidated
      household expenditure data and a prescribed weighting scheme.
    name: compute_index_series
    nodes_depended_on:
    - fetch_household_expenditure_data
    - define_alternative_inflation_index
    nodes_dependent_on:
    - generate_historical_timeline
    output_structure:
    - description: List of years for which the index was calculated.
      key: years
      type: List[int]
    - description: Corresponding index values for each year.
      key: index_values
      type: List[float]
    - description: Indicates whether index computation succeeded.
      key: is_index_successful
      type: bool
    prd:
      conceptual_info: Takes raw household expenditure data and a category‑weight
        matrix to produce a year‑by‑year alternative inflation index.
      docstring:
        examples:
        - lines:
          - expenditure_csv = "Year,Category,Location,Expenditure_Amount\n2020,Food,NY,200\n2021,Food,NY,210"
          - index_weights_csv = "Category,Weight\nFood,1.0"
          - years, index_values, success = compute_index_series(expenditure_csv, True,
            index_weights_csv, True)
          - print(years)
          - print(index_values)
          - print(success)
          output: '[2020, 2021]\n[200.0, 210.0]\nTrue'
        - lines:
          - expenditure_csv = "Year,Category,Location,Expenditure_Amount\n2020,Food,NY,200"
          - index_weights_csv = "Category,Weight\nFood,1.0"
          - 'try:'
          - '    compute_index_series(expenditure_csv, False, index_weights_csv, True)'
          - 'except ValueError as e:'
          - '    print(str(e))'
          output: '"Data collection failed. Cannot compute index series."'
        parameters:
        - description: 'CSV string with columns: Year, Category, Location, Expenditure_Amount.'
          name: expenditure_csv
          type: str
        - description: Flag indicating whether data collection succeeded.
          name: is_data_successful
          type: bool
        - description: 'CSV string with columns: Category, Weight describing the weighting
            scheme.'
          name: index_weights_csv
          type: str
        - description: Flag indicating whether the methodology definition succeeded.
          name: is_methodology_successful
          type: bool
        raises:
        - description: If either is_data_successful or is_methodology_successful is
            False, or if input CSVs are malformed.
          type: ValueError
        returns:
          description: A tuple containing the list of years, the calculated index
            values for each year, and a boolean flag indicating success.
          type: Tuple[List[int], List[float], bool]
        summary: Compute a yearly alternative inflation index from expenditure CSV
          and category weights.
    prompt: Calculate the index value for each year by applying the defined weights
      to the expenditure data. Return a list of years and corresponding index values.
  define_alternative_inflation_index:
    agent: false
    description: Specifies the methodology and weights for an alternative inflation
      index derived from household expenditure data.
    name: define_alternative_inflation_index
    nodes_depended_on:
    - fetch_household_expenditure_data
    nodes_dependent_on:
    - compute_index_series
    output_structure:
    - description: Name of the alternative inflation index.
      key: index_name
      type: str
    - description: CSV string of Category,Weight pairs.
      key: index_weights_csv
      type: str
    - description: Whether the methodology definition succeeded.
      key: is_methodology_successful
      type: bool
    prd:
      conceptual_info: Defines a custom inflation index by assigning weights to spending
        categories based on aggregate household expenditure.
      docstring:
        examples:
        - lines:
          - expenditure_csv = (
          - '    "Year,Category,Location,Expenditure_Amount\n"'
          - '    "2020,Food,NY,200\n"'
          - '    "2020,Food,CA,250\n"'
          - '    "2020,Clothing,NY,100\n"'
          - )
          - name,weights,success = define_alternative_inflation_index(expenditure_csv)
          - print(name)
          - print(weights)
          - print(success)
          output: '"Alternative CPI\nCategory,Weight\nFood,0.6\nClothing,0.4\nTrue"'
        - lines:
          - 'try:'
          - '    define_alternative_inflation_index("")'
          - 'except ValueError as e:'
          - '    print("Caught error:", e)'
          output: '"Caught error: Input CSV is empty or malformed."'
        parameters:
        - description: CSV string where each row contains Year, Category, Location,
            and Expenditure_Amount.
          name: expenditure_csv
          type: str
        raises:
        - description: If the input CSV is empty or malformed.
          type: ValueError
        - description: If expected columns (Year, Category, Location, Expenditure_Amount)
            are missing.
          type: KeyError
        returns:
          description: A tuple containing the index name, a CSV of Category,Weight
            pairs, and a boolean flag indicating success.
          type: tuple[str, str, bool]
        summary: Create an alternative inflation index from a CSV of household expenditures.
    prompt: Using the expenditure CSV, define an alternative inflation index. Specify
      the index name, the weighting scheme per category (as CSV with Category,Weight),
      and any calculation method notes. Output the index name and the weights CSV.
  draft_policy_proposal:
    agent: false
    description: Create a policy proposal document.
    name: draft_policy_proposal
    nodes_depended_on:
    - analyze_trends_and_benchmark
    nodes_dependent_on:
    - produce_final_report
    output_structure:
    - description: Executive summary of the policy proposal.
      key: policy_proposal_summary
      type: str
    - description: List of concrete policy recommendations.
      key: policy_recommendations
      type: str
    - description: Score (0–1) indicating feasibility of the proposal.
      key: policy_feasibility_score
      type: float
    - description: Whether policy drafting succeeded.
      key: is_policy_successful
      type: bool
    prd:
      conceptual_info: Transforms inflation trend data into a structured policy proposal
        that includes a summary, actionable recommendations, and a feasibility assessment.
      docstring:
        examples:
        - lines:
          - result = draft_policy_proposal([2018, 2019, 2020],
          - '                            [2.5, 2.2, 1.8],'
          - '                            "Inflation has been steadily declining.",'
          - '                            True)'
          output: '{''policy_proposal_summary'': ''To improve living standards, we
            recommend a targeted subsidy program and tax reforms to stabilize purchasing
            power.'', ''policy_recommendations'': [''Adjust income tax brackets to
            favor middle class'', ''Increase housing subsidies'', ''Implement a cost‑of‑living
            adjustment in wages''], ''policy_feasibility_score'': 0.78, ''is_policy_successful'':
            True}'
        - lines:
          - draft_policy_proposal([2019, 2020],
          - '                      [2.1, 1.9],'
          - '                      "Inflation is moderating.",'
          - '                      False)'
          output: 'ValueError: Trend analysis failed – cannot generate policy proposal.'
        parameters:
        - description: Years corresponding to the calculated inflation rates.
          name: inflation_rate_years
          type: List[int]
        - description: Year‑to‑year inflation rates (% change).
          name: inflation_rate_values
          type: List[float]
        - description: Narrative summary of inflation trends and benchmark results.
          name: trend_summary
          type: str
        - description: Indicates whether the trend analysis succeeded.
          name: is_analysis_successful
          type: bool
        raises:
        - description: If is_analysis_successful is False or required inputs are missing/invalid.
          type: ValueError
        returns:
          description: Dictionary containing policy_proposal_summary (str), policy_recommendations
            (List[str]), policy_feasibility_score (float), and is_policy_successful
            (bool).
          type: Dict[str, Any]
        summary: Generates a policy proposal document based on inflation trend analysis.
    prompt: Using the trend summary and inflation rates, craft a policy proposal to
      improve living standards. Include a brief summary, a list of actionable recommendations,
      and a feasibility score between 0 and 1.
  fetch_household_expenditure_data:
    agent: false
    description: Gather and consolidate household expenditure data into a CSV format.
    name: fetch_household_expenditure_data
    nodes_depended_on: []
    nodes_dependent_on:
    - define_alternative_inflation_index
    - compute_category_location_breakdowns
    output_structure:
    - description: CSV string of consolidated household expenditure data.
      key: expenditure_csv
      type: str
    - description: Indicates whether data collection was successful.
      key: is_data_successful
      type: bool
    prd:
      conceptual_info: Collects US household expenditure data from official sources,
        aggregates it across all available years, and outputs a single CSV string
        that can be consumed by downstream nodes for index construction and breakdown
        analysis.
      docstring:
        examples:
        - lines:
          - csv_str, success = fetch_household_expenditure_data()
          - print(success)
          - print(csv_str.splitlines()[0])
          output: 'True

            Year,Category,Location,Expenditure_Amount'
        - lines:
          - csv_str, success = fetch_household_expenditure_data()
          - 'if not success:'
          - '    print(''Data retrieval failed.'')'
          output: Data retrieval failed.
        parameters: []
        raises:
        - description: Raised if the function cannot access any official data source
            or if the retrieved data is empty.
          type: ValueError
        returns:
          description: A tuple where the first element is the consolidated CSV string
            and the second element is a boolean flag signifying success.
          type: Tuple[str, bool]
        summary: Retrieves US household expenditure data for all available years from
          official sources and consolidates it into a single CSV string. The function
          returns the CSV string along with a boolean flag indicating whether the
          data retrieval and consolidation succeeded.
    prompt: Collect US household expenditure data from official sources (e.g., Consumer
      Expenditure Survey) for all available years. Consolidate the data into a single
      CSV string where each row contains Year, Category, Location, and Expenditure_Amount.
  generate_historical_timeline:
    agent: false
    description: Build a comprehensive historical timeline report.
    name: generate_historical_timeline
    nodes_depended_on:
    - compute_index_series
    - compute_category_location_breakdowns
    nodes_dependent_on:
    - analyze_trends_and_benchmark
    output_structure:
    - description: CSV of the historical timeline.
      key: timeline_report_csv
      type: str
    - description: Indicates whether timeline generation succeeded.
      key: is_timeline_successful
      type: bool
    prompt: 'Combine the index series and the category/location breakdowns into a
      single historical timeline report. Output the report as a CSV string with columns:
      Year,Index,CategoryTotals,LocationTotals.'
  produce_final_report:
    agent: false
    description: Generate the final report text.
    name: produce_final_report
    nodes_depended_on:
    - draft_policy_proposal
    nodes_dependent_on: []
    output_structure:
    - description: Complete report text ready for dissemination.
      key: final_report_text
      type: str
    - description: Whether final report generation succeeded.
      key: is_report_successful
      type: bool
    prd:
      conceptual_info: This node synthesizes a concise final report from a drafted
        policy proposal, formatting the executive summary, recommendations, feasibility
        score, and a brief conclusion into a single dissemination‑ready string.
      docstring:
        examples:
        - lines:
          - report, success = produce_final_report(
          - '    policy_proposal_summary=''Improving Living Standards'','
          - '    policy_recommendations=[''Raise minimum wage'', ''Expand affordable
            housing''],'
          - '    policy_feasibility_score=0.8'
          - )
          output: '''"Improving Living Standards\n\nRecommendations:\n- Raise minimum
            wage\n- Expand affordable housing\n\nFeasibility Score: 0.80\n\nConclusion:
            These measures will enhance overall well‑being."

            (True)'
        - lines:
          - report, success = produce_final_report(
          - '    policy_proposal_summary=''Enhancing Food Security'','
          - '    policy_recommendations=[''Increase subsidies for local farms'', ''Implement
            community garden programs'', ''Improve distribution networks''],'
          - '    policy_feasibility_score=0.65'
          - )
          output: '''"Enhancing Food Security\n\nRecommendations:\n- Increase subsidies
            for local farms\n- Implement community garden programs\n- Improve distribution
            networks\n\nFeasibility Score: 0.65\n\nConclusion: These actions will
            reduce food insecurity across the nation."

            (True)'
        parameters:
        - description: Executive summary of the policy proposal.
          name: policy_proposal_summary
          type: str
        - description: Concrete policy recommendations to be included as bullet points.
          name: policy_recommendations
          type: List[str]
        - description: Feasibility score between 0 and 1.
          name: policy_feasibility_score
          type: float
        raises:
        - description: If any of the inputs are empty or of incorrect type.
          type: ValueError
        returns:
          description: A tuple containing the final report text and a boolean flag
            indicating successful generation.
          type: Tuple[str, bool]
        summary: Compile a policy proposal into a structured final report text.
    prompt: Compile the policy proposal into a final report text. Include the summary,
      recommendations, feasibility score, and a short concluding statement.
