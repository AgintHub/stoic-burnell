dag_type: plain_text
description: A detailed, fully concurrent workflow for building and deploying a high‑volume
  options trading strategy from strategy definition through live deployment.
name: high_volume_options_trading_strategy
nodes:
  acquire_market_data:
    agent: false
    description: Implement data ingestion from all sources.
    name: acquire_market_data
    nodes_depended_on:
    - identify_data_sources
    nodes_dependent_on:
    - validate_acquired_data
    prompt: Write a script or description that pulls the identified data sources,
      handling authentication, rate limits, and storage into the proposed database.
  clean_and_prepare_data:
    agent: false
    description: Prepare the data for modeling.
    name: clean_and_prepare_data
    nodes_depended_on:
    - validate_acquired_data
    nodes_dependent_on:
    - engineer_features
    - run_backtest
    prompt: Clean the validated data, handling missing values, aligning timestamps,
      and calculating necessary derived fields. Return a clean dataset ready for feature
      engineering.
  define_strategy_objectives:
    agent: false
    description: Specify the main financial and operational goals for the options
      strategy.
    name: define_strategy_objectives
    nodes_depended_on: []
    nodes_dependent_on:
    - identify_data_sources
    - set_up_code_repository
    prompt: Define the primary business objectives for a high‑volume options trading
      strategy, including target annual return, acceptable volatility, maximum drawdown,
      liquidity requirements, and market scope.
  deploy_strategy:
    agent: false
    description: Deploy the strategy to production.
    name: deploy_strategy
    nodes_depended_on:
    - design_order_management
    - design_risk_controls
    - design_monitoring_and_alerts
    - set_up_data_storage
    - set_up_code_repository
    - generate_reports
    nodes_dependent_on: []
    prompt: 'Prepare deployment steps: containerization, CI/CD pipeline, API endpoints,
      and monitoring hooks. Include deployment checklist.'
  design_execution_logic:
    agent: false
    description: Define how orders will be executed.
    name: design_execution_logic
    nodes_depended_on:
    - design_strategy_logic
    nodes_dependent_on:
    - design_order_management
    prompt: 'Outline the execution layer: order routing, execution algorithms (e.g.,
      VWAP, TWAP), and compliance checks.'
  design_monitoring_and_alerts:
    agent: false
    description: Configure operational oversight.
    name: design_monitoring_and_alerts
    nodes_depended_on:
    - design_risk_controls
    nodes_dependent_on:
    - generate_reports
    - deploy_strategy
    prompt: Design monitoring dashboards and alert rules for key metrics (PnL, risk
      limits, system health). Specify alert channels.
  design_order_management:
    agent: false
    description: Plan how orders are tracked and updated.
    name: design_order_management
    nodes_depended_on:
    - design_execution_logic
    nodes_dependent_on:
    - deploy_strategy
    prompt: 'Define order management workflow: order creation, modification, cancellation,
      and status tracking. Specify data structures for orders.'
  design_risk_controls:
    agent: false
    description: Set up live risk management safeguards.
    name: design_risk_controls
    nodes_depended_on:
    - evaluate_backtest_risk
    nodes_dependent_on:
    - design_monitoring_and_alerts
    prompt: Create risk control rules that enforce position limits, VaR constraints,
      and stop‑loss thresholds during live trading.
  design_strategy_logic:
    agent: false
    description: Define the decision rules of the strategy.
    name: design_strategy_logic
    nodes_depended_on:
    - engineer_features
    nodes_dependent_on:
    - setup_backtest_environment
    - design_execution_logic
    prompt: 'Describe the core trading logic: entry signals, exit rules, position
      sizing, and risk limits. Outline the decision tree or rule set.'
  engineer_features:
    agent: false
    description: Create the feature set for strategy signals.
    name: engineer_features
    nodes_depended_on:
    - clean_and_prepare_data
    nodes_dependent_on:
    - design_strategy_logic
    prompt: Generate option‑specific features such as implied volatility, Greeks,
      moneyness, time‑to‑expiration, and market sentiment indicators. Provide formulas
      and a feature list.
  evaluate_backtest_performance:
    agent: false
    description: Assess how well the strategy meets performance goals.
    name: evaluate_backtest_performance
    nodes_depended_on:
    - run_backtest
    nodes_dependent_on:
    - optimize_strategy_parameters
    prompt: Analyze backtest performance metrics, comparing them to the defined objectives.
      Summarize strengths and weaknesses.
  evaluate_backtest_risk:
    agent: false
    description: Evaluate risk metrics from the backtest.
    name: evaluate_backtest_risk
    nodes_depended_on:
    - run_backtest
    nodes_dependent_on:
    - optimize_strategy_parameters
    - design_risk_controls
    prompt: 'Assess risk aspects of the backtest: volatility, tail risk, position
      concentration, and liquidity impact. Provide risk tables.'
  generate_reports:
    agent: false
    description: Produce a final performance and risk report.
    name: generate_reports
    nodes_depended_on:
    - evaluate_backtest_performance
    - evaluate_backtest_risk
    - design_monitoring_and_alerts
    nodes_dependent_on: []
    prompt: Generate a comprehensive report summarizing backtest results, risk assessment,
      and live simulation outputs. Format as Markdown with tables.
  identify_data_sources:
    agent: false
    description: Identify the data feeds required to support the strategy.
    name: identify_data_sources
    nodes_depended_on:
    - define_strategy_objectives
    nodes_dependent_on:
    - acquire_market_data
    - set_up_data_storage
    prompt: List all necessary data sources for the strategy (e.g., exchange tick
      data, option chain feeds, volatility indices). Include vendor names, data frequency,
      and licensing constraints.
  optimize_strategy_parameters:
    agent: false
    description: Tune the strategy for improved performance and risk.
    name: optimize_strategy_parameters
    nodes_depended_on:
    - evaluate_backtest_performance
    - evaluate_backtest_risk
    nodes_dependent_on:
    - simulate_live_performance
    prompt: Optimize strategy hyperparameters (e.g., lookback windows, thresholds)
      using an appropriate method (grid search, Bayesian). Return the best parameter
      set.
  run_backtest:
    agent: false
    description: Perform the strategy backtest.
    name: run_backtest
    nodes_depended_on:
    - setup_backtest_environment
    - clean_and_prepare_data
    nodes_dependent_on:
    - evaluate_backtest_performance
    - evaluate_backtest_risk
    prompt: 'Execute the backtest using the prepared data and strategy logic. Return
      key metrics: cumulative return, Sharpe ratio, max drawdown, win rate.'
  set_up_code_repository:
    agent: false
    description: Define the code repository layout and essential files.
    name: set_up_code_repository
    nodes_depended_on:
    - define_strategy_objectives
    nodes_dependent_on:
    - deploy_strategy
    prompt: Create a minimal repository structure for the strategy code. Provide folder
      names and file templates (e.g., main.py, data_loader.py).
  set_up_data_storage:
    agent: false
    description: Select and describe the database for storing market data.
    name: set_up_data_storage
    nodes_depended_on:
    - identify_data_sources
    nodes_dependent_on:
    - deploy_strategy
    prompt: Propose a data storage solution suitable for high‑volume option data,
      specifying database type, schema outline, partition strategy, and retention
      policy.
  setup_backtest_environment:
    agent: false
    description: Prepare the backtesting platform.
    name: setup_backtest_environment
    nodes_depended_on:
    - design_strategy_logic
    nodes_dependent_on:
    - run_backtest
    prompt: Set up a backtesting framework (e.g., Zipline, backtrader). Specify configuration,
      data adapters, and simulation parameters.
  simulate_live_performance:
    agent: false
    description: Project live‑trading outcomes.
    name: simulate_live_performance
    nodes_depended_on:
    - optimize_strategy_parameters
    nodes_dependent_on:
    - deploy_strategy
    prompt: Simulate live execution using the optimized parameters and realistic slippage
      and latency models. Report expected performance metrics.
  validate_acquired_data:
    agent: false
    description: Ensure the ingested data is correct and complete.
    name: validate_acquired_data
    nodes_depended_on:
    - acquire_market_data
    nodes_dependent_on:
    - clean_and_prepare_data
    prompt: Validate the acquired data for completeness and accuracy. Provide a checklist
      of checks (e.g., missing timestamps, price consistency).
