        \    \n    if len(years) != len(rates) or len(years) < 2:\n        raise ValueError(\"\
        Input inflation data or benchmark results are invalid or malformed\")\n  \
        \  \n    start_year = years[0]\n    end_year = years[-1]\n    start_rate =\
        \ rates[0]\n    end_rate = rates[-1]\n    \n    if start_rate < end_rate:\n\
        \        trend_word = \"increased\" if len(years) == 2 else \"rose\"\n   \
        \ elif start_rate > end_rate:\n        trend_word = \"decreased\"\n    else:\n\
        \        trend_word = \"remained stable\"\n    \n    if start_rate < end_rate:\n\
