    shims:
    - agent: false
      code_node_type: virtual-pure
      description: Validates and parses a CSV string into a structured format.
      implementation: "import csv\nimport io\nimport json\n\n\ndef validate_and_parse_csv(csv_string:\
        \ str) -> str:\n    \"\"\"\n    Validates and parses a CSV string into a structured\
        \ format.\n\n    Parameters\n    ----------\n    csv_string : str\n      \
        \  The input CSV string to be validated and parsed.\n\n    Returns\n    -------\n\
        \    dict\n        A dictionary containing a boolean 'is_valid' indicating\
        \ whether the\n        CSV string is valid, and a list of dictionaries 'parsed_data'\n\
        \        containing the parsed CSV data.\n\n    Raises\n    ------\n    ValueError\n\
        \        When the input CSV string is malformed or invalid.\n    TypeError\n\
        \        When the input type is not a string.\n\n    Examples\n    --------\n\
        \    >>> validate_and_parse_csv('Year,Index,CategoryTotals,LocationTotals')\n\
        \    >>> validate_and_parse_csv('2022,100,1000,5000')\n    {'is_valid': True,\
        \ 'parsed_data': [{'Year': '2022', 'Index': '100',\n    'CategoryTotals':\
        \ '1000', 'LocationTotals': '5000'}]}\n\n    >>> validate_and_parse_csv('invalid_csv_string')\n\
        \    {'is_valid': False, 'parsed_data': []}\n\n    \"\"\"\n    \n    if not\
        \ isinstance(csv_string, str):\n        raise TypeError(\"Input must be a\
        \ string\")\n    \n    try:\n        csv_file = io.StringIO(csv_string.strip())\n\
        \        \n        reader = csv.DictReader(csv_file)\n        \n        parsed_data\
        \ = list(reader)\n        \n        if not parsed_data and csv_string.strip():\n\
        \            return json.dumps({'is_valid': False, 'parsed_data': []})\n \
        \       \n        result = {\n            'is_valid': True,\n            'parsed_data':\
        \ parsed_data\n        }\n        \n        return json.dumps(result)\n  \
        \      \n    except (csv.Error, UnicodeDecodeError):\n        return json.dumps({'is_valid':\
        \ False, 'parsed_data': []})\n    except Exception:\n        return json.dumps({'is_valid':\
        \ False, 'parsed_data': []})"
      name: validate_and_parse_csv
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
