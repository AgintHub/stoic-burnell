        \ is not a number\")\n    \n    if total_exp <= 0:\n        raise ValueError(\"\
        total expenditure is zero or negative\")\n    \n    weights = {}\n    for\
        \ category, total in category_totals_dict.items():\n        weights[category]\
        \ = total / total_exp\n    \n    return json.dumps(weights)"
