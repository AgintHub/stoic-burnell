        \ year.\n    category_col : str\n        The column name in the data that\
        \ represents the category.\n    amount_col : str\n        The column name\
        \ in the data that represents the expenditure amount.\n\n    Returns\n   \
        \ -------\n    dict\n        A dictionary where keys are categories and values\
        \ are the total\n        expenditure amounts for each category, structured\
        \ as '{category:\n        total_amount}'.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the input data is not in the expected format or if required\n\
        \        columns are missing.\n    TypeError\n        If the input parameters\
        \ are not of the expected types.\n\n    Examples\n    --------\n    >>> data\
        \ = [{'Year': '2022', 'Category': 'Food', 'Expenditure_Amount': 100},\n  \
        \  ...         {'Year': '2022', 'Category': 'Transport', 'Expenditure_Amount':\n\
        \    50}]\n    >>> year_col = 'Year'\n    >>> category_col = 'Category'\n\
        \    >>> amount_col = 'Expenditure_Amount'\n    >>> result = aggregate_by_category(data,\
        \ year_col, category_col, amount_col)\n    {'Food': 100, 'Transport': 50}\n\
        \n    \"\"\"\n    \n    try:\n        parsed_data = json.loads(data)\n   \
        \ except json.JSONDecodeError:\n        try:\n            csv_reader = csv.DictReader(StringIO(data))\n\
        \            parsed_data = list(csv_reader)\n        except Exception:\n \
        \           raise ValueError(\"Input data is not in expected format (JSON\
        \ list or CSV)\")\n    \n    if not isinstance(parsed_data, list):\n     \
        \   raise TypeError(\"Input data must be a list of records\")\n    \n    if\
        \ not parsed_data:\n        return json.dumps({})\n    \n    required_columns\
        \ = {year_col, category_col, amount_col}\n    if parsed_data:\n        available_columns\
        \ = set(parsed_data[0].keys())\n        missing_columns = required_columns\
        \ - available_columns\n        if missing_columns:\n            raise ValueError(f\"\
        Required columns missing: {missing_columns}\")\n    \n    category_totals\
        \ = {}\n    \n    for record in parsed_data:\n        if not isinstance(record,\
        \ dict):\n            raise TypeError(\"Each record must be a dictionary\"\
        )\n        \n        category = record.get(category_col)\n        amount_str\
        \ = record.get(amount_col)\n        \n        if category is None or amount_str\
        \ is None:\n            continue\n        \n        try:\n            amount\
        \ = float(amount_str)\n        except (ValueError, TypeError):\n         \
        \   continue\n        \n        if category in category_totals:\n        \
        \    category_totals[category] += amount\n        else:\n            category_totals[category]\
        \ = amount\n    \n    return json.dumps(category_totals)"
