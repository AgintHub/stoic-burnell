    - agent: false
      code_node_type: virtual-pure
      description: Compares inflation rates against a Consumer Price Index (CPI) baseline
        to provide benchmarking results.
      implementation: "import json\n\n\ndef benchmark_against_cpi(inflation_rates:\
        \ str, years: str, cpi_data: str) -> str:\n    \"\"\"\n    Compares inflation\
        \ rates against a Consumer Price Index (CPI) baseline to\n    provide benchmarking\
        \ results.\n\n    Parameters\n    ----------\n    inflation_rates : str\n\
        \        A string representation of a list of inflation rates as percent\n\
        \        changes.\n    years : str\n        A string representation of a list\
        \ of years corresponding to the\n        inflation rates.\n    cpi_data :\
        \ str\n        A string representation of the CPI data used as a baseline\
        \ for\n        benchmarking.\n\n    Returns\n    -------\n    str\n      \
        \  A dictionary containing benchmarking results, including comparisons\n \
        \       of inflation rates against the CPI baseline.\n\n    Raises\n    ------\n\
        \    ValueError\n        When input validation fails due to incorrect or missing\
        \ data.\n    TypeError\n        When input types are incorrect or incompatible\
        \ with expected\n        formats.\n\n    Examples\n    --------\n    >>> benchmark_against_cpi(inflation_rates='[0.02,\
        \ 0.03, 0.01]',\n    years='[2020, 2021, 2022]', cpi_data='{'2020': 100, '2021':\
        \ 105, '2022':\n    110}')\n    {'benchmarking_results': [1.05, 1.02, 0.95],\
        \ 'comparison_summary':\n    'Inflation rates are 5% higher than CPI in 2020,\
        \ 2% higher in 2021, and 5%\n    lower in 2022'}\n\n    \"\"\"\n    \n   \
        \ try:\n        inflation_list = json.loads(inflation_rates)\n        years_list\
        \ = json.loads(years)\n        cpi_dict = json.loads(cpi_data)\n    except\
        \ json.JSONDecodeError:\n        raise ValueError(\"Failed to parse input\
        \ data as valid JSON\")\n    \n    if not isinstance(inflation_list, list)\
        \ or not isinstance(years_list, list) or not isinstance(cpi_dict, dict):\n\
        \        raise TypeError(\"Input types are incorrect or incompatible with\
        \ expected formats\")\n    \n    if len(inflation_list) != len(years_list):\n\
        \        raise ValueError(\"Inflation rates and years lists must have the\
        \ same length\")\n    \n    benchmarking_results = []\n    comparison_details\
        \ = []\n    \n    for i, year in enumerate(years_list):\n        year_str\
        \ = str(year)\n        if year_str not in cpi_dict:\n            raise ValueError(f\"\
        CPI data not available for year {year}\")\n        \n        inflation_rate\
        \ = inflation_list[i]\n        cpi_value = cpi_dict[year_str]\n        \n\
        \        if i == 0:\n            baseline_cpi = cpi_value\n            benchmarking_results.append(1.0)\n\
        \            comparison_details.append(f\"baseline year {year}\")\n      \
        \  else:\n            prev_year_str = str(years_list[i-1])\n            prev_cpi\
        \ = cpi_dict[prev_year_str]\n            cpi_change_rate = (cpi_value - prev_cpi)\
        \ / prev_cpi\n            \n            if cpi_change_rate == 0:\n       \
        \         ratio = float('inf') if inflation_rate != 0 else 1.0\n         \
        \   else:\n                ratio = inflation_rate / cpi_change_rate\n    \
        \        \n            benchmarking_results.append(round(ratio, 2))\n    \
        \        \n            diff_percent = round((inflation_rate - cpi_change_rate)\
        \ * 100, 0)\n            if diff_percent > 0:\n                comparison_details.append(f\"\
        {int(abs(diff_percent))}% higher than CPI in {year}\")\n            elif diff_percent\
        \ < 0:\n                comparison_details.append(f\"{int(abs(diff_percent))}%\
        \ lower than CPI in {year}\")\n            else:\n                comparison_details.append(f\"\
        equal to CPI in {year}\")\n    \n    comparison_summary = \"Inflation rates\
        \ are \" + \", \".join(comparison_details)\n    \n    result = {\n       \
        \ \"benchmarking_results\": benchmarking_results,\n        \"comparison_summary\"\
        : comparison_summary\n    }\n    \n    return json.dumps(result)"
      name: benchmark_against_cpi
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type dict
