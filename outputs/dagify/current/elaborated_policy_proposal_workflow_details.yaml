        \ -> str:\n    \"\"\"\n    Generate a dictionary mapping years to index values\
        \ from input strings of\n    years and index values.\n\n    Parameters\n \
        \   ----------\n    years : str\n        A comma-separated string of years.\n\
        \    index_values : str\n        A comma-separated string of index values\
