        \   if not isinstance(expenditure_data, str):\n        raise TypeError(\"\
        Input expenditure data must be a string\")\n    \n    if not expenditure_data.strip():\n\
        \        raise ValueError(\"Input expenditure data cannot be empty\")\n  \
