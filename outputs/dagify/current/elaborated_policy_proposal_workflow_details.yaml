          returns:
            description: A dictionary containing a boolean 'is_valid' indicating whether
              the CSV string is valid, and a list of dictionaries 'parsed_data' containing
              the parsed CSV data.
            type: dict
          summary: Validates and parses a CSV string into a structured format.
      prompt: Implement a shim function to validate and parse a CSV string.
      shims: []
    - agent: false
      code_node_type: virtual-pure
      description: Calculates year-over-year inflation rates from a given timeline
        data.
      implementation: "import json\n\n\ndef calculate_year_over_year_inflation(timeline_data:\
        \ str) -> str:\n    \"\"\"\n    Calculates year-over-year inflation rates\
        \ from a given timeline data.\n\n    Parameters\n    ----------\n    timeline_data\
        \ : List[dict]\n        A list of dictionaries representing the timeline data,\
        \ where each\n        dictionary contains information about a specific year.\n\
        \n    Returns\n    -------\n    dict\n        A dictionary containing two\
        \ keys: 'years' and 'rates', where 'years'\n        is a list of years and\
        \ 'rates' is a list of corresponding inflation\n        rates.\n\n    Raises\n\
        \    ------\n    ValueError\n        When the input timeline data is malformed\
        \ or incomplete.\n    TypeError\n        When the input timeline data is not\
        \ a list of dictionaries.\n\n    Examples\n    --------\n    >>> calculate_year_over_year_inflation(timeline_data=[{'year':\
        \ 2020,\n    'value': 100}, {'year': 2021, 'value': 110}])\n    {'years':\
        \ [2020, 2021], 'rates': [0, 0.1]}\n\n    >>> calculate_year_over_year_inflation(timeline_data=[{'year':\
        \ 2019,\n    'value': 90}, {'year': 2020, 'value': 100}, {'year': 2021, 'value':\
        \ 110}])\n    {'years': [2019, 2020, 2021], 'rates': [0, 0.1111, 0.1]}\n\n\
        \    \"\"\"\n    \n    try:\n        data = json.loads(timeline_data)\n  \
        \  except json.JSONDecodeError:\n        raise ValueError(\"When the input\
        \ timeline data is malformed or incomplete.\")\n    \n    if not isinstance(data,\
        \ list):\n        raise TypeError(\"When the input timeline data is not a\
        \ list of dictionaries.\")\n    \n    for item in data:\n        if not isinstance(item,\
        \ dict):\n            raise TypeError(\"When the input timeline data is not\
        \ a list of dictionaries.\")\n        if 'year' not in item or 'value' not\
        \ in item:\n            raise ValueError(\"When the input timeline data is\
        \ malformed or incomplete.\")\n    \n    sorted_data = sorted(data, key=lambda\
        \ x: x['year'])\n    \n    years = []\n    rates = []\n    \n    for i, item\
        \ in enumerate(sorted_data):\n        years.append(item['year'])\n       \
        \ \n        if i == 0:\n            rates.append(0)\n        else:\n     \
        \       prev_value = sorted_data[i-1]['value']\n            current_value\
        \ = item['value']\n            if prev_value == 0:\n                raise\
        \ ValueError(\"When the input timeline data is malformed or incomplete.\"\
        )\n            rate = (current_value - prev_value) / prev_value\n        \
        \    rates.append(round(rate, 4))\n    \n    result = {'years': years, 'rates':\
        \ rates}\n    return json.dumps(result)"
      name: calculate_year_over_year_inflation
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type dict
        key: output
        type: str
      - description: Input parameter of type str
        key: timeline_data
        type: str
      prd:
        conceptual_info: This shim function calculates year-over-year inflation rates
          from a given timeline data, which is a crucial step in trend analysis and
          benchmarking.
        docstring:
          examples:
          - lines:
            - 'calculate_year_over_year_inflation(timeline_data=[{''year'': 2020,
              ''value'': 100}, {''year'': 2021, ''value'': 110}])'
            output: '{''years'': [2020, 2021], ''rates'': [0, 0.1]}'
          - lines:
            - 'calculate_year_over_year_inflation(timeline_data=[{''year'': 2019,
              ''value'': 90}, {''year'': 2020, ''value'': 100}, {''year'': 2021, ''value'':
              110}])'
            output: '{''years'': [2019, 2020, 2021], ''rates'': [0, 0.1111, 0.1]}'
          parameters:
          - description: A list of dictionaries representing the timeline data, where
              each dictionary contains information about a specific year.
            name: timeline_data
            type: List[dict]
          raises:
          - description: When the input timeline data is malformed or incomplete.
            type: ValueError
          - description: When the input timeline data is not a list of dictionaries.
            type: TypeError
          returns:
            description: 'A dictionary containing two keys: ''years'' and ''rates'',
              where ''years'' is a list of years and ''rates'' is a list of corresponding
              inflation rates.'
            type: dict
          summary: Calculates year-over-year inflation rates from a given timeline
            data.
      prompt: the right prompt for the shim implementation
      shims: []
    - agent: false
      code_node_type: virtual-pure
      description: Fetches the current CPI baseline data.
      implementation: "import json\n\n\ndef fetch_current_cpi_baseline() -> str:\n\
        \    \"\"\"\n    Fetches the current CPI baseline data.\n\n    Returns\n \
        \   -------\n    dict\n        The current CPI baseline data as a dictionary.\n\
        \n    Raises\n    ------\n    ValueError\n        When the CPI data cannot\
        \ be retrieved or is invalid.\n    TypeError\n        When the CPI data is\
        \ not in the expected format.\n\n    Examples\n    --------\n    >>> fetch_current_cpi_baseline()\n\
        \    {\"2022\": 294.3, \"2023\": 304.2}\n\n    >>> fetch_current_cpi_baseline()\n\
        \    {\"error\": \"Failed to retrieve CPI data\"}\n\n    \"\"\"\n    try:\n\
        \        baseline_data = {\n            \"2022\": 294.3,\n            \"2023\"\
        : 304.2,\n            \"2024\": 310.8\n        }\n        \n        if not\
        \ isinstance(baseline_data, dict):\n            raise TypeError(\"CPI data\
        \ is not in the expected format\")\n        \n        for year, value in baseline_data.items():\n\
        \            if not isinstance(value, (int, float)):\n                raise\
        \ ValueError(\"CPI data cannot be retrieved or is invalid\")\n        \n \
        \       return json.dumps(baseline_data)\n        \n    except (KeyError,\
        \ AttributeError) as e:\n        raise ValueError(\"When the CPI data cannot\
        \ be retrieved or is invalid.\") from e\n    except Exception as e:\n    \
        \    if not isinstance(e, (ValueError, TypeError)):\n            raise TypeError(\"\
        When the CPI data is not in the expected format.\") from e\n        raise"
      name: fetch_current_cpi_baseline
      nodes_depended_on: []
