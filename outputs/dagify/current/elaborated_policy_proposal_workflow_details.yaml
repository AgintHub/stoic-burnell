        \    {'Food': 2200.0}\n\n    >>> expenditure_data = '[{\"Category\": \"Housing\"\
        , \"Year\": 2020, \"Location\":\n    \"Los Angeles\", \"Expenditure_Amount\"\
        : 5000.0}, {\"Category\": \"Transportation\",\n    \"Year\": 2021, \"Location\"\
        : \"Chicago\", \"Expenditure_Amount\": 2000.0}]'\n    >>> result = calculate_category_expenditure_totals(expenditure_data)\n\
