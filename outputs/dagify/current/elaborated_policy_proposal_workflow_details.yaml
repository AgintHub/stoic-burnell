            name: cpi_data
            type: str
          raises:
          - description: When input validation fails due to incorrect or missing data.
            type: ValueError
          - description: When input types are incorrect or incompatible with expected
              formats.
            type: TypeError
          returns:
            description: A dictionary containing benchmarking results, including comparisons
              of inflation rates against the CPI baseline.
            type: str
          summary: Compares inflation rates against a Consumer Price Index (CPI) baseline
            to provide benchmarking results.
      prompt: benchmark inflation rates against CPI
      shims: []
    - agent: false
      code_node_type: virtual-pure
      description: This shim generates a narrative summary of inflation trends and
