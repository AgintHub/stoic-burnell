        \        \n        if abs(total_weight - 1.0) > 1e-10:\n            return\
        \ False\n        \n        return True\n        \n    except ValueError:\n\
        \        raise\n    except Exception as e:\n        raise ValueError(f\"Failed\
        \ to parse weights: {str(e)}\")"
