        type: str
      - description: Input parameter of type str
        key: inflation_rates
        type: str
      - description: Input parameter of type str
        key: years
        type: str
      - description: Input parameter of type str
        key: cpi_data
        type: str
      prd:
        conceptual_info: The benchmark_against_cpi shim function provides a comparison
          of inflation rates against a Consumer Price Index (CPI) baseline, generating
          benchmarking results that can be used for trend analysis and decision-making.
        docstring:
          examples:
          - lines:
            - 'benchmark_against_cpi(inflation_rates=''[0.02, 0.03, 0.01]'', years=''[2020,
              2021, 2022]'', cpi_data=''{''2020'': 100, ''2021'': 105, ''2022'': 110}'')'
            output: '{''benchmarking_results'': [1.05, 1.02, 0.95], ''comparison_summary'':
              ''Inflation rates are 5% higher than CPI in 2020, 2% higher in 2021,
              and 5% lower in 2022''}'
          parameters:
          - description: A string representation of a list of inflation rates as percent
              changes.
            name: inflation_rates
            type: str
          - description: A string representation of a list of years corresponding
              to the inflation rates.
            name: years
            type: str
          - description: A string representation of the CPI data used as a baseline
