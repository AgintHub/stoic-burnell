        \        raise ValueError(\"Input expenditure data is malformed - not valid\
        \ JSON\")\n    \n    if not isinstance(data, list):\n        raise TypeError(\"\
        Expenditure data must be a list of dictionaries\")\n    \n    if len(data)\
        \ == 0:\n        raise ValueError(\"Expenditure data cannot be empty\")\n\
        \    \n    category_totals = {}\n    \n    for item in data:\n        if not\
        \ isinstance(item, dict):\n            raise TypeError(\"Each item in expenditure\
