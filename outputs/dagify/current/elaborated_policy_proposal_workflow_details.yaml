        \        are not provided.\n    TypeError\n        If category totals are\
        \ not a dictionary or if total expenditure is\n        not a number.\n\n \
        \   Examples\n    --------\n    >>> category_weights = calculate_category_weights(category_totals={'Food':\n\
        \    1000, 'Transport': 500}, total_expenditure=1500)\n    {'Food': 0.6666666666666666,\
        \ 'Transport': 0.3333333333333333}\n\n    >>> category_weights =\n    calculate_category_weights(category_totals={'Housing':\
        \ 2000, 'Utilities':\n    300}, total_expenditure=2300)\n    {'Housing': 0.8695652173913043,\
        \ 'Utilities': 0.1304347826086957}\n\n    \"\"\"\n    \n    try:\n       \
        \ category_totals_dict = json.loads(category_totals)\n    except (json.JSONDecodeError,\
        \ TypeError):\n        raise TypeError(\"category_totals must be a valid JSON\
        \ string representing a dictionary\")\n    \n    if not isinstance(category_totals_dict,\
        \ dict):\n        raise TypeError(\"category_totals must be a dictionary\"\
        )\n    \n    if not category_totals_dict:\n        raise ValueError(\"category\
        \ totals are not provided\")\n    \n    try:\n        total_exp = float(total_expenditure)\n\
