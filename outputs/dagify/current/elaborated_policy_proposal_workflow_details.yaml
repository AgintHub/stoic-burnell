        docstring:
          examples:
          - lines:
            - validate_and_parse_csv('Year,Index,CategoryTotals,LocationTotals')
            - validate_and_parse_csv('2022,100,1000,5000')
            output: '{''is_valid'': True, ''parsed_data'': [{''Year'': ''2022'', ''Index'':
              ''100'', ''CategoryTotals'': ''1000'', ''LocationTotals'': ''5000''}]}'
          - lines:
            - validate_and_parse_csv('invalid_csv_string')
            output: '{''is_valid'': False, ''parsed_data'': []}'
          parameters:
