        \        If the input report text is not a string.\n\n    Examples\n    --------\n\
        \    >>> formatted_report = apply_professional_formatting(report_text='This\
        \ is a\n    sample report.')\n    'This is a sample report.' with professional\
        \ formatting applied.\n\n    >>> formatted_report = apply_professional_formatting(report_text='Another\n\
        \    sample report with multiple lines.\\nLine 2.\\nLine 3.')\n    'Another\
        \ sample report with multiple lines.\\nLine 2.\\nLine 3.' with\n    professional\
        \ formatting applied.\n\n    \"\"\"\n    if not isinstance(report_text, str):\n\
        \        raise TypeError(\"If the input report text is not a string.\")\n\
        \    \n    if not report_text or not report_text.strip():\n        raise ValueError(\"\
        If the input report text is empty, null, or invalid.\")\n    \n    \n    formatted_text\
        \ = re.sub(r'\\s+', ' ', report_text.strip())\n    \n    formatted_text =\
        \ re.sub(r'\\s*\\.\\s*', '. ', formatted_text)\n    formatted_text = re.sub(r'\\\
        s*,\\s*', ', ', formatted_text)\n    formatted_text = re.sub(r'\\s*;\\s*',\
        \ '; ', formatted_text)\n    formatted_text = re.sub(r'\\s*:\\s*', ': ', formatted_text)\n\
        \    \n    formatted_text = re.sub(r'\\n\\s*\\n', '\\n\\n', formatted_text)\n\
        \    \n    sentences = re.split(r'(\\. )', formatted_text)\n    capitalized_sentences\
        \ = []\n    for i, part in enumerate(sentences):\n        if i % 2 == 0 and\
        \ part:  # Actual sentence content (not delimiter)\n            part = part.strip()\n\
        \            if part:\n                part = part[0].upper() + part[1:] if\
        \ len(part) > 1 else part.upper()\n        capitalized_sentences.append(part)\n\
        \    \n    formatted_text = ''.join(capitalized_sentences)\n    \n    formatted_text\
        \ = formatted_text.strip()\n    \n    return formatted_text"
