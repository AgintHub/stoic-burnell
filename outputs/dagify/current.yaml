dag_type: spec
description: Generated workflow from UI.
name: high_volume_options_trading_strategy
nodes:
  acquire_market_data:
    agent: false
    description: Implement data ingestion from all sources.
    name: acquire_market_data
    nodes_depended_on:
    - identify_data_sources
    nodes_dependent_on: []
    output_structure:
    - description: Whether data acquisition was successful
      key: acquisition_successful
      type: bool
    - description: List of data sources from which data was acquired
      key: data_sources
      type: str
    - description: Start timestamp of the acquired data
      key: start_timestamp
      type: str
    - description: End timestamp of the acquired data
      key: end_timestamp
      type: str
    - description: List of error messages encountered during data acquisition
      key: error_messages
      type: str
    prd:
      conceptual_info: This node is responsible for acquiring market data from various
        sources and storing it in a proposed database.
      docstring:
        examples:
        - lines:
          - data_sources = ['source1', 'source2']
          - 'database_config = {''host'': ''localhost'', ''port'': 5432, ''database'':
            ''market_data''}'
          - 'authentication_credentials = {''source1'': ''username1:password1'', ''source2'':
            ''username2:password2''}'
          - result = acquire_market_data(data_sources, database_config, authentication_credentials)
          output: '{''acquisition_successful'': True, ''data_sources'': [''source1'',
            ''source2''], ''start_timestamp'': ''2022-01-01 00:00:00'', ''end_timestamp'':
            ''2022-01-01 23:59:59'', ''error_messages'': []}'
        parameters:
        - description: List of data sources to acquire data from
          name: data_sources
          type: List[str]
        - description: Dictionary containing database connection configuration
          name: database_config
          type: dict
        - description: Dictionary containing authentication credentials for data sources
          name: authentication_credentials
          type: dict
        raises:
        - description: If an error occurs during data acquisition or storage
          type: Exception
        returns:
          description: Dictionary containing acquisition status, list of data sources,
            start and end timestamps, and error messages
          type: dict
        summary: Acquire market data from identified sources and store it in a database.
    prompt: Write a script or description that pulls the identified data sources,
      handling authentication, rate limits, and storage into the proposed database.
  clean_and_prepare_data:
    agent: false
    description: Safely transforms raw, dirty data into a consistent, analytically-ready
      format by filling missing values, aligning timestamps, and computing derived
      fields.
    name: clean_and_prepare_data
    nodes_depended_on:
    - validate_acquired_data
    nodes_dependent_on: []
    output_structure:
    - description: Whether the data cleaning and preparation were successful
      key: cleaning_successful
      type: bool
    - description: Number of missing values handled during the cleaning process
      key: number_of_missing_values_handled
      type: int
    - description: List of derived fields calculated during the preparation process
      key: derived_fields_calculated
      type: str
    - description: Whether the dataset is ready for feature engineering
      key: dataset_ready
      type: bool
    prd:
      conceptual_info: Data Transformation and Cleaning
      docstring:
        examples:
        - lines:
          - import pandas as pd
          - from sklearn.impute import SimpleImputer
          - from sklearn.preprocessing import StandardScaler
          output: Cleaned DataFrame
        parameters: []
        raises: []
        returns:
          description: The transformed dataset in a suitable format for modeling.
          type: Pandas DataFrame
        summary: Performs a series of data cleaning and transformation operations.
    prompt: 'Clean and prepare the validated data by performing the following steps:

      1. Replace or interpolate missing values using KNN imputation and/or mean/median
      imputation for numerical features (e.g., numeric columns).

      2. Standardize numeric features by rescaling or normalizing them.

      3. One-hot encode categorical variables to transform them into numerical representations.

      4. Aggregate data when necessary, such as grouping by date and rolling averages.

      5. Handle timestamps and date ranges by converting them into appropriate formats
      and aggregating data accordingly.

      6. Transform data into a suitable format for modeling by dropping unnecessary
      columns, creating new features, or converting data types.

      7. Validate the cleanliness and correctness of the data.

      Output the processed dataset in a format suitable for further analysis, like
      a Pandas dataframe.'
  define_strategy_objectives:
    agent: false
    description: Establishes comprehensive, technically precise financial and operational
      targets for a high-volume options trading strategy, ensuring alignment with
      market conditions, risk appetite, and liquidity constraints. Incorporates detailed
      quantitative metrics, constraints, and rationale for each objective to guide
      subsequent strategy development phases.
    name: define_strategy_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Target annual return for the strategy (e.g., 20.0 for 20%)
      key: target_annual_return
      type: float
    - description: Acceptable volatility for the strategy (e.g., 10.0 for 10%)
      key: acceptable_volatility
      type: float
    - description: Maximum drawdown for the strategy (e.g., 30.0 for 30%)
      key: maximum_drawdown
      type: float
    - description: Liquidity requirements for the strategy (e.g., 'high', 'medium',
        'low')
      key: liquidity_requirements
      type: str
    - description: Market scope for the strategy (e.g., 'US stocks', 'EU stocks',
        'currencies')
      key: market_scope
      type: str
    prd:
      conceptual_info: Provides a rigorous, quantifiable framework for strategic goal
        setting, integrating constraints from risk management, liquidity analysis,
        and market conditions, facilitating a disciplined, data-driven approach to
        strategy development.
      docstring:
        examples:
        - lines:
          - Define target annual return as 20.0%
          - Set acceptable volatility to 10.0%
          - Limit maximum drawdown to 30.0%
          - Require high liquidity for execution reliability
          - Focus on US stock options market
          output: Configuration parameters established with justified thresholds,
            suitable for incorporation into trading system constraints and risk controls.
        parameters:
        - description: Expected annualized return percentage, derived from backtesting
            and simulation under assumed market conditions, incorporating considerations
            for compounding, slippage, and transaction costs.
          name: target_annual_return
          type: float
        - description: Maximum acceptable annualized standard deviation of returns,
            based on historical data and stress test scenarios; controls exposure
            to risky market fluctuations and ensures manageable drawdowns.
          name: acceptable_volatility
          type: float
        - description: Predefined cap on the largest peak-to-trough decline during
            the strategy lifecycle, aligned with investor risk appetite, tolerances
            learned from historical market drawdowns, and postulated stress scenarios.
          name: maximum_drawdown
          type: float
        - description: Liquidity threshold setting, guiding the positioning and order
            size limits; derived from minimum bid-ask spreads, average daily volume,
            and settlement cycles, to ensure seamless trade execution without significant
            market impact.
          name: liquidity_requirements
          type: str
        - description: Explicit market universe inclusion criteria, considering regulatory
            constraints, data granularity, trading hours, and systemic risk factors,
            to ensure the strategy operates within feasible and compliant domains.
          name: market_scope
          type: str
        raises: []
        returns:
          description: This function outputs configuration parameters and constraints
            that inform downstream module design, risk controls, and performance monitoring
            protocols, serving as a blueprint for strategy implementation.
          type: void
        summary: Defines detailed quantitative objectives and their technical rationales
          for a high-frequency options trading strategy, supporting precise implementation
          and risk-adjusted performance targets.
    prompt: Develop a detailed, technically grounded specification of the core financial
      and operational objectives for a high-frequency options trading system, including
      parameters such as target annual return, acceptable volatility, maximum drawdown,
      liquidity thresholds, and market scope. Your task is to define these objectives
      with precise quantification, justifications for chosen thresholds, and constraints
      rooted in market microstructure, risk management principles, and system capacity,
      to inform subsequent architecture and implementation decisions.
  deploy_strategy:
    agent: false
    description: Orchestrates a safe, observable, and auditable production deployment
      of the strategy, integrating containerization, CI/CD automation, API exposure,
      and comprehensive monitoring hooks. Ensures rollback readiness, data integrity,
      security compliance, and post-deployment validation across all dependent services.
    name: deploy_strategy
    nodes_depended_on:
    - design_order_management
    - design_risk_controls
    - design_monitoring_and_alerts
    - set_up_data_storage
    - set_up_code_repository
    - generate_reports
    nodes_dependent_on: []
    output_structure:
    - description: Whether the deployment was successful
      key: deployment_status
      type: bool
    - description: List of steps taken during deployment
      key: deployment_steps
      type: List[str]
    - description: Details of the containerization process
      key: containerization_details
      type: str
    - description: Configuration of the CI/CD pipeline
      key: ci_cd_pipeline_config
      type: str
    - description: List of API endpoints used in the deployment
      key: api_endpoints
      type: List[str]
    - description: List of monitoring hooks used in the deployment
      key: monitoring_hooks
      type: List[str]
    - description: List of items in the deployment checklist
      key: deployment_checklist
      type: List[str]
    prd:
      conceptual_info: Deployment orchestration for a production-ready strategy, ensuring
        repeatability, observability, security, and safety with auditable changes,
        controlled releases, and rapid rollback.
      docstring:
        examples:
        - lines:
          - deploy_strategy.run(deployment_version='v2.1.0', canary_percentage=0.15,
            environment='production', rollback_on_failure=True, dependencies=['design_order_management','design_monitoring_and_alerts'],
            observability_config='default')
          output: Deployment initiated with 15% canary; rollback on failure enabled.
            Observability hooks streaming to Grafana/Prometheus.
        parameters:
        - description: Version tag or git SHA of the deployment artifacts
          name: deployment_version
          type: str
        - description: Initial proportion of traffic to route to the new release (0.0
            - 1.0)
          name: canary_percentage
          type: float
        - description: Target deployment environment (staging, production)
          name: environment
          type: str
        - description: Whether to automatically rollback on failure
          name: rollback_on_failure
          type: bool
        - description: List of dependent nodes/services verified before deploy
          name: dependencies
          type: List[str]
        - description: Configuration of monitoring, logging, and alerting hooks to
            enable post-deploy validation
          name: observability_config
          type: str
        raises:
        - description: Raised if prerequisites are not met or deployment fails
          type: Exception
        returns:
          description: Structured success/failure narrative with deployment metadata
          type: str
        summary: Deploys the strategy to production with containerization, automated
          delivery, and validated post-deployment health. Provides a structured artifact
          detailing steps, endpoints, monitoring, and rollback procedures.
    prompt: 'You are an expert in production deployment orchestration. Using outputs
      from the parent nodes (design_order_management, design_risk_controls, design_monitoring_and_alerts,
      set_up_data_storage, set_up_code_repository, generate_reports) as well as the
      current system context, produce a detailed production deployment plan for the
      strategy. The output must populate the following fields exactly in this order:


      - deployment_status (bool): Final status of the deployment (true if successful,
      false otherwise).

      - deployment_steps (List[str]): Step-by-step actions executed during deployment,
      in strict order. Each item should be a concise, action-oriented bullet. Reference
      upstream outputs where relevant (e.g., artifact versions, feature flags, risk
      controls gating, monitoring hooks).

      - containerization_details (str): Comprehensive description of containerization,
      including base images, tags/versions, registries, multi-arch considerations,
      image signing, security scanning, resource limits, and runtime configuration
      (env vars, secrets handling, and volume mounts).

      - ci_cd_pipeline_config (str): Detailed CI/CD configuration plan. Include pipeline
      stages (lint, unit tests, integration tests, security scans, build, publish,
      deployment), environment segmentation (staging vs production), canary/blue-green
      strategy, rollback triggers, secret management, and audit logging.

      - api_endpoints (List[str]): Versioned API endpoint list to be exposed in production
      (paths, HTTP methods, auth requirements, feature flags, and canary routes if
      applicable).

      - monitoring_hooks (List[str]): Monitoring and observability hooks to enable
      post-deploy validation (metrics, logs, traces, dashboards, alert rules, and
      incident channels).

      - deployment_checklist (List[str]): Pre/post deployment checks, data migrations,
      backup/restore steps, rollback criteria, and validation criteria.


      For each section, produce concrete, executable details and rationale. Ensure
      the plan remains consistent with the outputs and constraints of parent nodes,
      and aligns with the target output structure defined below. The plan must also
      describe:

      - Deployment strategy (canary, blue/green, or equivalent) and rationale, including
      canary percentage and promotion criteria.

      - Rollback plan with explicit rollback steps and data considerations.

      - Post-deployment validation plan including smoke tests, health checks, and
      performance checks.

      - Security and compliance considerations (secret management, TLS, access controls,
      audit logging).

      - Data integrity and migrations approach (backward-compatible migrations, downtime
      minimization).


      Output the content in plain text for each field so it can be serialized directly
      into the target schema.'
  design_execution_logic:
    agent: false
    description: Define how orders will be executed.
    name: design_execution_logic
    nodes_depended_on:
    - design_strategy_logic
    nodes_dependent_on: []
    output_structure:
    - description: List of execution algorithms used (e.g., VWAP, TWAP, Market)
      key: execution_algorithms
      type: List[str]
    - description: Details about order routing, including routing protocols and destinations
      key: order_routing_info
      type: str
    - description: List of compliance checks performed during order execution (e.g.,
        position limits, risk checks)
      key: compliance_checks
      type: List[str]
    - description: Whether the execution is automated
      key: is_auto_execution
      type: bool
    prd:
      conceptual_info: This node defines the execution logic for trading orders, including
        the algorithms used, order routing, and compliance checks.
      docstring:
        examples:
        - lines:
          - 'design_execution_logic(strategy_logic={''entry_signals'': [''signal1'',
            ''signal2''], ''exit_rules'': [''rule1'', ''rule2'']})'
          output: '{''execution_algorithms'': [''VWAP'', ''TWAP''], ''order_routing_info'':
            ''routing_protocol: dest1'', ''compliance_checks'': [''position_limits'',
            ''risk_checks''], ''is_auto_execution'': True}'
        parameters:
        - description: The strategy logic defined in the parent node, including entry
            signals, exit rules, position sizing, and risk limits.
          name: strategy_logic
          type: dict
        raises:
        - description: If the strategy logic is incomplete or invalid.
          type: ValueError
        returns:
          description: A dictionary containing the execution algorithms, order routing
            information, compliance checks, and auto-execution flag.
          type: dict
        summary: Defines the execution logic for trading orders.
    prompt: 'Outline the execution layer: order routing, execution algorithms (e.g.,
      VWAP, TWAP), and compliance checks.'
  design_monitoring_and_alerts:
    agent: false
    description: Creates a self-sustainable, real-time monitoring and alerting system,
      exposing a flexible metrics selection, adaptable alerting logic, and customizable
      channel delivery for business-critical metrics, ensuring optimal operational
      control and prompt issue detection.
    name: design_monitoring_and_alerts
    nodes_depended_on:
    - design_risk_controls
    nodes_dependent_on: []
    output_structure:
    - description: Description of the monitoring dashboard design
      key: monitoring_dashboard_design
      type: str
    - description: List of alert rules for key metrics
      key: alert_rules
      type: List[str]
    - description: List of alert channels (e.g., email, SMS, webhook)
      key: alert_channels
      type: List[str]
    - description: List of key metrics to be monitored (e.g., PnL, risk limits, system
        health)
      key: key_metrics
      type: List[str]
    - description: List of threshold values for each key metric
      key: threshold_values
      type: List[float]
    prd:
      conceptual_info: This node creates a self-sustainable, real-time monitoring
        and alerting system that offers flexible metrics selection, adaptable alerting
        logic, and customizable channel delivery for business-critical metrics, ensuring
        optimal operational control and prompt issue detection.
      docstring:
        examples:
        - lines:
          - Create a monitoring system using design_monitoring_and_alerts.
          output: The monitoring system has been successfully created and is ready
            for use.
        parameters:
        - description: Threshold values for each key metric.
          name: threshold_values
          type: List[float]
        - description: Alert channels to use.
          name: alert_channels
          type: List[str]
        raises:
        - description: Raises an exception if there's an error setting up the monitoring
            system.
          type: Exception
        returns:
          description: The output of the monitoring and alerting system.
          type: Dict[str, object]
        summary: Design and deploy a scalable monitoring platform to track crucial
          performance indicators and ensure prompt issue detection.
    prompt: Create a comprehensive monitoring and alerting system, incorporating multi-metric
      dashboards, adaptable alert rules that cover key performance indicators (PnL,
      risk limits, system health), and customizable alert channels.
  design_order_management:
    agent: false
    description: Designs a comprehensive order management workflow, including creation,
      modification, cancellation, and status tracking, and determines if the order
      management process can be automated.
    name: design_order_management
    nodes_depended_on:
    - design_execution_logic
    nodes_dependent_on: []
    output_structure:
    - description: Description of the order management workflow
      key: order_workflow_description
      type: str
    - description: List of possible order status options
      key: order_status_options
      type: List[str]
    - description: List of data structures used to store order information
      key: data_structures_used
      type: List[str]
    - description: List of rules for modifying existing orders
      key: modification_rules
      type: List[str]
    - description: Description of the procedures for cancelling orders
      key: cancellation_procedures
      type: str
    - description: Whether the order management process is automated
      key: is_order_management_automated
      type: bool
    prd:
      conceptual_info: Designs a comprehensive order management workflow, including
        creation, modification, cancellation, and status tracking, and determines
        if the order management process can be automated.
      docstring:
        examples: []
        parameters: []
        raises: []
        returns:
          description: A dictionary containing the order workflow description, order
            status options, data structures used, modification rules, cancellation
            procedures, and automation status.
          type: PrimitiveType.DICT
        summary: Designs a comprehensive order management workflow, including creation,
          modification, cancellation, and status tracking, and determines if the order
          management process can be automated.
    prompt: Process the output from node `design_execution_logic` and create a detailed
      specification for a scalable order management system.
  design_risk_controls:
    agent: false
    description: Develops and deploys advanced risk management safeguards for live
      trading by creating data-driven risk control rules, enforcing position limits,
      Value-at-Risk (VaR) constraints, and stop-loss thresholds.
    name: design_risk_controls
    nodes_depended_on:
    - evaluate_backtest_risk
    nodes_dependent_on: []
    output_structure:
    - description: List of position limits for each asset
      key: position_limits
      type: List[float]
    - description: List of Value-at-Risk (VaR) constraints for each asset
      key: var_constraints
      type: List[float]
    - description: List of stop-loss thresholds for each asset
      key: stop_loss_thresholds
      type: List[float]
    - description: List of risk control rules
      key: risk_control_rules
      type: List[str]
    - description: Whether the risk control rules are satisfied
      key: is_risk_control_satisfied
      type: bool
    prd:
      conceptual_info: This node develops and deploys advanced risk management safeguards
        for live trading by creating data-driven risk control rules.
      docstring:
        examples:
        - lines:
          - backtest_risk_metrics = evaluate_backtest_risk().output
          - 'risk_tolerance = {''position_limits'': [100000, 500000], ''var_constraints'':
            [0.05, 0.10], ''stop_loss_thresholds'': [50, 100]}'
          - risk_control_rules, is_risk_control_satisfied = design_risk_controls(backtest_risk_metrics,
            risk_tolerance)
          output: '{''risk_control_rules'': [''Position limit 100000 reached on asset
            A'', ''VaR constraint 0.05 exceeded on asset B''], ''is_risk_control_satisfied'':
            False}'
        parameters:
        - description: Input risk metrics from the evaluate_backtest_risk node.
          name: backtest_risk_metrics
          type: dict
        - description: Risk tolerance parameters, including position limits, VaR constraints,
            and stop-loss thresholds.
          name: risk_tolerance
          type: dict
        raises:
        - description: Raised if input data is invalid or risk tolerance parameters
            are contradictory.
          type: ValueError
        returns:
          description: A set of risk control rules and an indicator of whether they
            are currently satisfied.
          type: dict
        summary: Designs and implements risk management controls for live trading.
    prompt: 'Create risk control rules that enforce position limits, VaR constraints,
      and stop-loss thresholds during live trading. To produce these outputs, perform
      the following steps:

      1. Retrieve the input data from the evaluate_backtest_risk node, containing
      calculated risk metrics.

      2. Define position limits based on industry standards, regulatory requirements,
      and customer-defined constraints.

      3. Set VaR constraints using a combination of historical simulation, Monte Carlo
      methods, and statistical models.

      4. Configure stop-loss thresholds as a function of trading strategy and market
      conditions.

      5. Validate the risk control rules against market data and stress testing scenarios.

      6. Integrate the risk control rules into the trading platform, ensuring seamless
      interaction with existing systems and processes.'
  design_strategy_logic:
    agent: false
    description: Crafts a high-performance, adaptive, and risk-controlled strategy
      framework incorporating expert-knowledge and data-driven insights.
    name: design_strategy_logic
    nodes_depended_on:
    - engineer_features
    nodes_dependent_on: []
    output_structure:
    - description: List of conditions for entering a trade
      key: entry_signals
      type: List[str]
    - description: List of conditions for exiting a trade
      key: exit_rules
      type: List[str]
    - description: Method for determining position size (e.g., fixed, risk-based)
      key: position_sizing
      type: str
    - description: List of risk limits (e.g., stop-loss, take-profit levels)
      key: risk_limits
      type: List[float]
    - description: High-level overview of the decision-making process
      key: decision_tree
      type: str
    prd:
      conceptual_info: "Develops expert-driven trading strategy using advanced decision-making\
        \ processes.\"\n        \"docstring\": {\n          \"summary\": \"Designs\
        \ and refines trading strategy to achieve optimal performance and risk management."
      docstring:
        examples: []
        parameters: []
        raises: []
        returns: null
        summary: ''
    prompt: Process the feature outputs and create a sophisticated trading strategy
      outline. This includes determining rules for entering trades, exiting trades,
      position sizing, risk limits, and defining a high-level decision tree. Ensure
      all logic is transparent, adaptable, and scalable.
  engineer_features:
    agent: false
    description: Generate a list of features tailored for options trading scenarios,
      including price movement, volatility, moneyness, and time-to-expiration, to
      inform trading strategies that adapt to market conditions and sentiment.
    name: engineer_features
    nodes_depended_on:
    - clean_and_prepare_data
    nodes_dependent_on: []
    output_structure:
    - description: List of feature names engineered for the strategy
      key: feature_list
      type: List[str]
    - description: Formulas or descriptions for each feature in the feature list
      key: feature_formulas
      type: List[str]
    - description: Descriptions of each feature in the feature list
      key: feature_descriptions
      type: List[str]
    prd:
      conceptual_info: This node generates a set of features relevant to options trading
        strategies, including implied volatility, Greeks, moneyness, time-to-expiration,
        and market sentiment indicators.
      docstring:
        examples: []
        parameters: []
        raises: []
        returns:
          description: Object containing feature_list, feature_formulas, and feature_descriptions
          type: object
        summary: Engineer features for options trading strategy signals.
    prompt: 'Process the output of the clean_and_prepare_data node to generate a list
      of features tailored for options trading scenarios.


      Generate a list of features that quantify key aspects of options trading, including
      price movement, volatility, moneyness, and time-to-expiration. Use these features
      to inform trading strategies that adapt to market conditions and sentiment.


      The features to be engineered are:


      * Implied volatility (IV), measuring the market''s expected volatility of the
      underlying asset

      * Greeks (delta, gamma, theta, and vega), quantifying the sensitivity of an
      option''s price to changes in the underlying asset''s price, volatility, and
      time to expiration

      * Moneyness (in-the-money (ITM), at-the-money (ATM), out-of-the-money (OTM)),
      indicating the option''s profitability relative to the underlying asset

      * Time-to-expiration (TTE), measuring the remaining time until the option''s
      expiration date

      * Market sentiment indicators, reflecting the overall bullishness or bearishness
      of the market


      Provide a list of feature names and their corresponding formulas or mathematical
      representations. Output the features in the following structure:


      - feature_list (List[str]): List of feature names

      - feature_formulas (List[str]): Formulas or descriptions for each feature in
      the feature list

      - feature_descriptions (List[str]): Descriptions of each feature in the feature
      list


      Perform all calculations based on the clean and prepared data provided by the
      clean_and_prepare_data node.'
  evaluate_backtest_performance:
    agent: false
    description: Delivers a comprehensive performance evaluation of the backtested
      trading strategy, assessing strategic fit, risk management, and profit potential.
    name: evaluate_backtest_performance
    nodes_depended_on:
    - run_backtest
    nodes_dependent_on: []
    output_structure:
    - description: Whether the strategy meets its performance goals
      key: meets_performance_goals
      type: bool
    - description: Cumulative return of the strategy
      key: cumulative_return
      type: float
    - description: Sharpe ratio of the strategy
      key: sharpe_ratio
      type: float
    - description: Maximum drawdown of the strategy
      key: max_drawdown
      type: float
    - description: Win rate of the strategy
      key: win_rate
      type: float
    - description: List of strengths of the strategy
      key: strengths
      type: List[str]
    - description: List of weaknesses of the strategy
      key: weaknesses
      type: List[str]
    prd:
      conceptual_info: Evaluates the performance of a backtested trading strategy
        against predefined objectives.
      docstring:
        examples: []
        parameters: []
        raises: []
        returns:
          description: A JSON object containing performance metrics and strategy evaluation
            results.
          type: Dict[str, object]
        summary: Evaluates the performance of a backtested trading strategy.
    prompt: 'Process the output of the run_backtest node and generate a JSON object
      with these fields:

      - meets_performance_goals (bool)

      - cumulative_return (float)

      - sharpe_ratio (float)

      - max_drawdown (float)

      - win_rate (float)

      - strengths (List[str])

      - weaknesses (List[str])


