  deploy_strategy:
    agent: false
    code_node_type: shim
    description: Orchestrates a safe, observable, and auditable production deployment
      of the strategy, integrating containerization, CI/CD automation, API exposure,
      and comprehensive monitoring hooks. Ensures rollback readiness, data integrity,
      security compliance, and post-deployment validation across all dependent services.
    implementation: "from ._deploy_strategy.validate_prerequisites import validate_prerequisites\n\
      from ._deploy_strategy.create_containers import create_containers\nfrom ._deploy_strategy.setup_ci_cd_pipeline\
      \ import setup_ci_cd_pipeline\nfrom ._deploy_strategy.execute_deployment import\
      \ execute_deployment\nfrom ._deploy_strategy.configure_api_endpoints import\
      \ configure_api_endpoints\nfrom ._deploy_strategy.setup_observability import\
      \ setup_observability\nfrom ._deploy_strategy.validate_post_deployment_health\
      \ import validate_post_deployment_health\nfrom ._deploy_strategy.execute_rollback\
      \ import execute_rollback\nfrom ._deploy_strategy.generate_deployment_checklist\
      \ import generate_deployment_checklist\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass DesignOrderManagementOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for design_order_management node outputs.\"\"\"\n\
      \    order_workflow_description: str = (\n        Field(..., description=\"\
      Description of the order management workflow\")\n    )\n    order_status_options:\
      \ List[str] = (\n        Field(..., description=\"List of possible order status\
      \ options\")\n    )\n    data_structures_used: List[str] = (\n        Field(...,\
      \ description = (\n            \"List of data structures used to store order\
      \ information\")\n        )\n    )\n    modification_rules: List[str] = (\n\
      \        Field(..., description=\"List of rules for modifying existing orders\"\
      )\n    )\n    cancellation_procedures: str = (\n        Field(..., description\
      \ = (\n            \"Description of the procedures for cancelling orders\")\n\
      \        )\n    )\n    is_order_management_automated: bool = (\n        Field(...,\
      \ description = (\n            \"Whether the order management process is automated\"\
      )\n        )\n    )\n\n\nclass DesignRiskControlsOutput(BaseModel):\n    \"\"\
      \"Pydantic model for design_risk_controls node outputs.\"\"\"\n    position_limits:\
      \ List[float] = (\n        Field(..., description=\"List of position limits\
      \ for each asset\")\n    )\n    var_constraints: List[float] = (\n        Field(...,\
      \ description = (\n            \"List of Value-at-Risk (VaR) constraints for\
      \ each asset\")\n        )\n    )\n    stop_loss_thresholds: List[float] = (\n\
      \        Field(..., description=\"List of stop-loss thresholds for each asset\"\
      )\n    )\n    risk_control_rules: List[str] = (\n        Field(..., description=\"\
      List of risk control rules\")\n    )\n    is_risk_control_satisfied: bool =\
      \ (\n        Field(..., description=\"Whether the risk control rules are satisfied\"\
      )\n    )\n\n\nclass DesignMonitoringAndAlertsOutput(BaseModel):\n    \"\"\"\
      Pydantic model for design_monitoring_and_alerts node outputs.\"\"\"\n    monitoring_dashboard_design:\
      \ str = (\n        Field(..., description=\"Description of the monitoring dashboard\
      \ design\")\n    )\n    alert_rules: List[str] = (\n        Field(..., description=\"\
      List of alert rules for key metrics\")\n    )\n    alert_channels: List[str]\
      \ = (\n        Field(..., description = (\n            \"List of alert channels\
      \ (e.g., email, SMS, webhook)\")\n        )\n    )\n    key_metrics: List[str]\
      \ = (\n        Field(..., description = (\n            \"List of key metrics\
      \ to be monitored (e.g., PnL, risk limits, system health)\")\n        )\n  \
      \  )\n    threshold_values: List[float] = (\n        Field(..., description=\"\
      List of threshold values for each key metric\")\n    )\n\n\nclass SetUpDataStorageOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_up_data_storage node outputs.\"\"\"\n    database_type:\
      \ str = (\n        Field(..., description = (\n            \"Type of the database\
      \ (e.g., relational, NoSQL, time-series)\")\n        )\n    )\n    schema_outline:\
      \ str = (\n        Field(..., description=\"Detailed outline of the database\
      \ schema\")\n    )\n    partition_strategy: str = (\n        Field(..., description\
      \ = (\n            \"Strategy used for partitioning data (e.g., by date, by\
      \ type)\")\n        )\n    )\n    retention_policy: str = (\n        Field(...,\
      \ description = (\n            \"Policy for data retention (e.g., time-based,\
      \ size-based)\")\n        )\n    )\n    data_storage_size: int = (\n       \
      \ Field(..., description=\"Estimated size of the data storage needed\")\n  \
      \  )\n    is_cloud_based: bool = (\n        Field(..., description = (\n   \
      \         \"Whether the data storage solution is cloud-based\")\n        )\n\
      \    )\n\n\nclass SetUpCodeRepositoryOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for set_up_code_repository node outputs.\"\"\"\n    repository_layout:\
      \ str = (\n        Field(..., description=\"Description of the repository layout\"\
      )\n    )\n    folder_names: List[str] = (\n        Field(..., description=\"\
      List of folder names in the repository\")\n    )\n    file_templates: List[str]\
      \ = (\n        Field(..., description=\"List of file templates in the repository\"\
      )\n    )\n\n\nclass GenerateReportsOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for generate_reports node outputs.\"\"\"\n    report_markdown: str = (\n \
      \       Field(..., description=\"The comprehensive report in Markdown format\"\
      )\n    )\n    performance_metrics: List[str] = (\n        Field(..., description\
      \ = (\n            \"List of performance metrics (e.g., cumulative return, Sharpe\
      \ ratio, max drawdown)\")\n        )\n    )\n    risk_assessment: str = (\n\
      \        Field(..., description = (\n            \"Summary of risk assessment\
      \ (e.g., volatility, tail risk, position concentration)\")\n        )\n    )\n\
      \    monitoring_alerts: List[str] = (\n        Field(..., description = (\n\
      \            \"List of monitoring alerts and their configurations\")\n     \
      \   )\n    )\n\n\nclass DeployStrategyOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for deploy_strategy node outputs.\"\"\"\n    deployment_status: bool\
      \ = (\n        Field(..., description=\"Whether the deployment was successful\"\
      )\n    )\n    deployment_steps: List[str] = (\n        Field(..., description=\"\
      List of steps taken during deployment\")\n    )\n    containerization_details:\
      \ str = (\n        Field(..., description=\"Details of the containerization\
      \ process\")\n    )\n    ci_cd_pipeline_config: str = (\n        Field(...,\
      \ description=\"Configuration of the CI/CD pipeline\")\n    )\n    api_endpoints:\
      \ List[str] = (\n        Field(..., description=\"List of API endpoints used\
      \ in the deployment\")\n    )\n    monitoring_hooks: List[str] = (\n       \
      \ Field(..., description = (\n            \"List of monitoring hooks used in\
      \ the deployment\")\n        )\n    )\n    deployment_checklist: List[str] =\
      \ (\n        Field(..., description=\"List of items in the deployment checklist\"\
      )\n    )\n\n\ndef deploy_strategy(design_order_management_input: DesignOrderManagementOutput,\
      \ design_risk_controls_input: DesignRiskControlsOutput, design_monitoring_and_alerts_input:\
      \ DesignMonitoringAndAlertsOutput, set_up_data_storage_input: SetUpDataStorageOutput,\
      \ set_up_code_repository_input: SetUpCodeRepositoryOutput, generate_reports_input:\
      \ GenerateReportsOutput, **kwargs) -> DeployStrategyOutput:\n    \"\"\"\n  \
      \  Deploys the strategy to production with containerization, automated\n   \
      \ delivery, and validated post-deployment health. Provides a structured\n  \
      \  artifact detailing steps, endpoints, monitoring, and rollback procedures.\n\
      \n    Parameters\n    ----------\n    deployment_version : str\n        Version\
      \ tag or git SHA of the deployment artifacts\n    canary_percentage : float\n\
      \        Initial proportion of traffic to route to the new release (0.0 -\n\
      \        1.0)\n    environment : str\n        Target deployment environment\
      \ (staging, production)\n    rollback_on_failure : bool\n        Whether to\
      \ automatically rollback on failure\n    dependencies : List[str]\n        List\
      \ of dependent nodes/services verified before deploy\n    observability_config\
      \ : str\n        Configuration of monitoring, logging, and alerting hooks to\
      \ enable\n        post-deploy validation\n\n    Returns\n    -------\n    str\n\
      \        Structured success/failure narrative with deployment metadata\n\n \
      \   Raises\n    ------\n    Exception\n        Raised if prerequisites are not\
      \ met or deployment fails\n\n    Examples\n    --------\n    >>> deploy_strategy.run(deployment_version='v2.1.0',\
      \ canary_percentage=0.15,\n    environment='production', rollback_on_failure=True,\n\
      \    dependencies=['design_order_management','design_monitoring_and_alerts'],\n\
      \    observability_config='default')\n    Deployment initiated with 15% canary;\
      \ rollback on failure enabled.\n    Observability hooks streaming to Grafana/Prometheus.\n\
      \n    \"\"\"\n    deployment_version: str = kwargs.get('deployment_version',\
      \ 'latest')\n    canary_percentage: float = kwargs.get('canary_percentage',\
      \ 0.1)\n    environment: str = kwargs.get('environment', 'production')\n   \
      \ rollback_on_failure: bool = kwargs.get('rollback_on_failure', True)\n    dependencies:\
      \ List[str] = kwargs.get('dependencies', [])\n    observability_config: str\
      \ = kwargs.get('observability_config', 'default')\n    \n    validate_prerequisites(dependencies=dependencies,\
      \ environment=environment)\n    \n    containerization_result: str = create_containers(\n\
      \        version=deployment_version,\n        repository_config=set_up_code_repository_input,\n\
      \        storage_config=set_up_data_storage_input\n    )\n    \n    pipeline_config:\
      \ str = setup_ci_cd_pipeline(\n        version=deployment_version,\n       \
      \ environment=environment,\n        canary_percentage=canary_percentage\n  \
      \  )\n    \n    deployment_steps: List[str] = execute_deployment(\n        version=deployment_version,\n\
      \        environment=environment,\n        canary_percentage=canary_percentage,\n\
      \        order_management=design_order_management_input,\n        risk_controls=design_risk_controls_input\n\
      \    )\n    \n    api_endpoints: List[str] = configure_api_endpoints(\n    \
      \    environment=environment,\n        order_workflow=design_order_management_input.order_workflow_description\n\
      \    )\n    \n    monitoring_hooks: List[str] = setup_observability(\n     \
      \   config=observability_config,\n        monitoring_design=design_monitoring_and_alerts_input,\n\
      \        alert_rules=design_monitoring_and_alerts_input.alert_rules\n    )\n\
      \    \n    health_status: bool = validate_post_deployment_health(\n        endpoints=api_endpoints,\n\
      \        monitoring_hooks=monitoring_hooks,\n        canary_percentage=canary_percentage\n\
      \    )\n    \n    if not health_status and rollback_on_failure:\n        rollback_steps:\
      \ List[str] = execute_rollback(\n            version=deployment_version,\n \
      \           environment=environment\n        )\n        deployment_steps.extend(rollback_steps)\n\
      \        final_status = False\n    else:\n        final_status = health_status\n\
      \    \n    deployment_checklist: List[str] = generate_deployment_checklist(\n\
      \        status=final_status,\n        steps=deployment_steps,\n        endpoints=api_endpoints,\n\
      \        monitoring=monitoring_hooks\n    )\n    \n    return DeployStrategyOutput(\n\
      \        deployment_status=final_status,\n        deployment_steps=deployment_steps,\n\
      \        containerization_details=containerization_result,\n        ci_cd_pipeline_config=pipeline_config,\n\
      \        api_endpoints=api_endpoints,\n        monitoring_hooks=monitoring_hooks,\n\
      \        deployment_checklist=deployment_checklist\n    )"
    name: deploy_strategy
    nodes_depended_on:
    - design_order_management
    - design_risk_controls
    - design_monitoring_and_alerts
    - set_up_data_storage
    - set_up_code_repository
    - generate_reports
