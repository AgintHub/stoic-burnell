      \ import calculate_position_concentration_hhi\nfrom ._evaluate_backtest_risk.estimate_liquidity_impact\
      \ import estimate_liquidity_impact\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass RunBacktestOutput(BaseModel):\n    \"\"\"\
      Pydantic model for run_backtest node outputs.\"\"\"\n    cumulative_return:\
      \ float = (\n        Field(..., description = (\n            \"The total return\
      \ of the strategy over the backtest period\")\n        )\n    )\n    sharpe_ratio:\
