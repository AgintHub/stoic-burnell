      \ import evaluate_market_constraints\nfrom ._define_strategy_objectives.define_market_scope\
      \ import define_market_scope\n\nfrom pydantic import BaseModel, Field\n\n\n\
      class DefineStrategyObjectivesOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ define_strategy_objectives node outputs.\"\"\"\n    target_annual_return:\
      \ float = (\n        Field(..., description = (\n            \"Target annual\
      \ return for the strategy (e.g., 20.0 for 20%)\")\n        )\n    )\n    acceptable_volatility:\
      \ float = (\n        Field(..., description = (\n            \"Acceptable volatility\
      \ for the strategy (e.g., 10.0 for 10%)\")\n        )\n    )\n    maximum_drawdown:\
      \ float = (\n        Field(..., description = (\n            \"Maximum drawdown\
      \ for the strategy (e.g., 30.0 for 30%)\")\n        )\n    )\n    liquidity_requirements:\
      \ str = (\n        Field(..., description = (\n            \"Liquidity requirements\
      \ for the strategy (e.g., 'high', 'medium', 'low')\")\n        )\n    )\n  \
      \  market_scope: str = (\n        Field(..., description = (\n            \"\
      Market scope for the strategy (e.g., 'US stocks', 'EU stocks', 'currencies')\"\
      )\n        )\n    )\n\n\ndef define_strategy_objectives(general_input: str,\
      \ **kwargs) -> DefineStrategyObjectivesOutput:\n    \"\"\"\n    Defines detailed\
      \ quantitative objectives and their technical rationales for\n    a high-frequency\
      \ options trading strategy, supporting precise implementation\n    and risk-adjusted\
      \ performance targets.\n\n    Parameters\n    ----------\n    target_annual_return\
      \ : float\n        Expected annualized return percentage, derived from backtesting\
      \ and\n        simulation under assumed market conditions, incorporating\n \
      \       considerations for compounding, slippage, and transaction costs.\n \
      \   acceptable_volatility : float\n        Maximum acceptable annualized standard\
      \ deviation of returns, based\n        on historical data and stress test scenarios;\
      \ controls exposure to\n        risky market fluctuations and ensures manageable\
      \ drawdowns.\n    maximum_drawdown : float\n        Predefined cap on the largest\
      \ peak-to-trough decline during the\n        strategy lifecycle, aligned with\
      \ investor risk appetite, tolerances\n        learned from historical market\
      \ drawdowns, and postulated stress\n        scenarios.\n    liquidity_requirements\
      \ : str\n        Liquidity threshold setting, guiding the positioning and order\
      \ size\n        limits; derived from minimum bid-ask spreads, average daily\
      \ volume,\n        and settlement cycles, to ensure seamless trade execution\
      \ without\n        significant market impact.\n    market_scope : str\n    \
      \    Explicit market universe inclusion criteria, considering regulatory\n \
      \       constraints, data granularity, trading hours, and systemic risk\n  \
      \      factors, to ensure the strategy operates within feasible and\n      \
      \  compliant domains.\n\n    Returns\n    -------\n    void\n        This function\
      \ outputs configuration parameters and constraints that\n        inform downstream\
      \ module design, risk controls, and performance\n        monitoring protocols,\
      \ serving as a blueprint for strategy\n        implementation.\n\n    Examples\n\
      \    --------\n    >>> Define target annual return as 20.0%\n    >>> Set acceptable\
      \ volatility to 10.0%\n    >>> Limit maximum drawdown to 30.0%\n    >>> Require\
      \ high liquidity for execution reliability\n    >>> Focus on US stock options\
      \ market\n    Configuration parameters established with justified thresholds,\
      \ suitable for\n    incorporation into trading system constraints and risk controls.\n\
      \n    \"\"\"\n    parsed_input: dict = parse_strategy_input(input_text=general_input,\
      \ kwargs=kwargs)\n    \n    historical_data: dict = fetch_market_historical_data(market_scope=parsed_input.get('market_scope',\
      \ 'US stock options'))\n    \n    backtesting_results: dict = run_strategy_backtesting(historical_data=historical_data,\
      \ parameters=parsed_input)\n    \n    target_return: float = calculate_target_annual_return(backtesting_results=backtesting_results,\
      \ compounding_factor=True, transaction_costs=True)\n    \n    stress_test_results:\
      \ dict = perform_stress_testing(historical_data=historical_data, scenarios=['market_crash',\
      \ 'volatility_spike', 'liquidity_crisis'])\n    \n    volatility_threshold:\
      \ float = determine_acceptable_volatility(stress_results=stress_test_results,\
      \ historical_volatility=historical_data)\n    \n    drawdown_limit: float =\
      \ calculate_maximum_drawdown(stress_results=stress_test_results, risk_appetite='moderate')\n\
      \    \n    liquidity_analysis: dict = analyze_market_liquidity(market_data=historical_data,\
      \ bid_ask_spreads=True, daily_volumes=True)\n    \n    liquidity_level: str\
      \ = determine_liquidity_requirements(analysis=liquidity_analysis, execution_needs='high_frequency')\n\
      \    \n    market_constraints: dict = evaluate_market_constraints(regulatory_requirements=True,\
      \ data_availability=True, trading_hours=True)\n    \n    final_market_scope:\
      \ str = define_market_scope(constraints=market_constraints, liquidity_analysis=liquidity_analysis)\n\
      \    \n    return DefineStrategyObjectivesOutput(\n        target_annual_return=target_return,\n\
      \        acceptable_volatility=volatility_threshold,\n        maximum_drawdown=drawdown_limit,\n\
      \        liquidity_requirements=liquidity_level,\n        market_scope=final_market_scope\n\
      \    )"
