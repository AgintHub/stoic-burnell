      key: data_adapters
      type: List[str]
    - description: Simulation parameters such as start and end dates, initial capital,
        and frequency
      key: simulation_parameters
      type: str
    - description: Any additional configuration details for the backtesting framework
      key: configuration
      type: str
    - description: Whether the backtesting environment was successfully set up
      key: is_setup_successful
      type: bool
    prd:
      conceptual_info: This node sets up the backtesting environment for a trading
        strategy.
      docstring:
        examples:
        - lines:
          - 'setup_backtest_environment(strategy_logic={''entry_signals'': [''SMA
            crossover'']}, backtesting_framework=''Zipline'', data_adapters=[''CSV''],
            simulation_parameters={''start_date'': ''2020-01-01'', ''end_date'': ''2020-12-31''},
            configuration={''initial_capital'': 10000})'
          output: '{''backtesting_framework'': ''Zipline'', ''data_adapters'': [''CSV''],
            ''simulation_parameters'': {''start_date'': ''2020-01-01'', ''end_date'':
            ''2020-12-31''}, ''configuration'': {''initial_capital'': 10000}, ''is_setup_successful'':
            True}'
        parameters:
        - description: The decision rules of the strategy, including entry signals,
            exit rules, position sizing, and risk limits.
          name: strategy_logic
          type: dict
        - description: The name of the backtesting framework to use (e.g., Zipline,
            backtrader).
          name: backtesting_framework
          type: str
        - description: List of data adapters to use for the backtest (e.g., CSV, database
            connections).
          name: data_adapters
          type: List[str]
        - description: Simulation parameters such as start and end dates, initial
            capital, and frequency.
          name: simulation_parameters
          type: str
        - description: Any additional configuration details for the backtesting framework.
          name: configuration
          type: str
        raises:
        - description: If the backtesting framework is not supported or if there is
            an issue with the configuration.
          type: ValueError
        returns:
          description: A dictionary containing the backtesting framework used, data
            adapters, simulation parameters, configuration, and setup success status.
          type: dict
        summary: Sets up a backtesting framework with specified configuration, data
          adapters, and simulation parameters.
    prompt: Set up a backtesting framework (e.g., Zipline, backtrader). Specify configuration,
      data adapters, and simulation parameters.
  simulate_live_performance:
    agent: false
    description: Project live-trading outcomes.
