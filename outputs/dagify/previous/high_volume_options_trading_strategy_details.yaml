      \ decline in the strategy's value during the backtest\")\n        )\n    )\n\
      \    win_rate: float = (\n        Field(..., description = (\n            \"\
      The percentage of trades that resulted in a profit\")\n        )\n    )\n\n\n\
      class EvaluateBacktestRiskOutput(BaseModel):\n    \"\"\"Pydantic model for evaluate_backtest_risk\
      \ node outputs.\"\"\"\n    volatility: float = (\n        Field(..., description=\"\
      Annualized volatility of the backtest returns\")\n    )\n    value_at_risk:\
      \ float = (\n        Field(..., description = (\n            \"Value-at-Risk\
      \ (VaR) of the backtest returns at 95% confidence level\")\n        )\n    )\n\
      \    expected_shortfall: float = (\n        Field(..., description = (\n   \
      \         \"Expected Shortfall (ES) of the backtest returns at 95% confidence\
      \ level\")\n        )\n    )\n    max_drawdown: float = (\n        Field(...,\
      \ description=\"Maximum drawdown of the backtest returns\")\n    )\n    tail_risk:\
      \ List[float] = (\n        Field(..., description = (\n            \"List of\
      \ tail risk metrics (e.g., 1% and 5% quantile returns)\")\n        )\n    )\n\
      \    position_concentration: float = (\n        Field(..., description = (\n\
      \            \"Herfindahl-Hirschman Index (HHI) of position concentration\"\
      )\n        )\n    )\n    liquidity_impact: float = (\n        Field(..., description\
      \ = (\n            \"Estimated liquidity impact of the strategy (e.g., price\
      \ impact, slippage)\")\n        )\n    )\n\n\ndef evaluate_backtest_risk(run_backtest_input:\
      \ RunBacktestOutput, **kwargs) -> EvaluateBacktestRiskOutput:\n    \"\"\"\n\
      \    Evaluates the risk metrics of a backtest, including volatility, value-at-\n\
      \    risk, expected shortfall, maximum drawdown, tail risk, position\n    concentration,\
      \ and liquidity impact.\n\n    Returns\n    -------\n    dict\n        A dictionary\
      \ containing the calculated risk metrics\n\n    Examples\n    --------\n   \
      \ >>> return evaluate_backtest_risk(backtest_result)\n    A dictionary with\
      \ the following structure:\n    \n    {'volatility': 0.12, 'value_at_risk':\
      \ 0.05, 'expected_shortfall': 0.03,\n    'max_drawdown': 0.25, 'tail_risk':\
      \ [0.01, 0.05], 'position_concentration':\n    0.8, 'liquidity_impact': 0.05}\n\
