    description: Tunes the strategy's hyperparameters to achieve improved performance
      and risk profiles by leveraging advanced optimization techniques.
    implementation: "from ._optimize_strategy_parameters.combine_performance_and_risk_metrics\
      \ import combine_performance_and_risk_metrics\nfrom ._optimize_strategy_parameters.select_optimization_method\
      \ import select_optimization_method\nfrom ._optimize_strategy_parameters.define_parameter_search_space\
      \ import define_parameter_search_space\nfrom ._optimize_strategy_parameters.run_optimization_algorithm\
      \ import run_optimization_algorithm\nfrom ._optimize_strategy_parameters.extract_best_parameters\
      \ import extract_best_parameters\nfrom ._optimize_strategy_parameters.validate_optimization_success\
      \ import validate_optimization_success\nfrom ._optimize_strategy_parameters.calculate_best_performance_metric\
      \ import calculate_best_performance_metric\n\nfrom pydantic import BaseModel,\
      \ Field\nfrom typing import List\n\n\nclass EvaluateBacktestPerformanceOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for evaluate_backtest_performance node outputs.\"\"\
      \"\n    meets_performance_goals: bool = (\n        Field(..., description =\
      \ (\n            \"Whether the strategy meets its performance goals\")\n   \
      \     )\n    )\n    cumulative_return: float = (\n        Field(..., description=\"\
      Cumulative return of the strategy\")\n    )\n    sharpe_ratio: float = Field(...,\
      \ description=\"Sharpe ratio of the strategy\")\n    max_drawdown: float = (\n\
      \        Field(..., description=\"Maximum drawdown of the strategy\")\n    )\n\
      \    win_rate: float = Field(..., description=\"Win rate of the strategy\")\n\
      \    strengths: List[str] = (\n        Field(..., description=\"List of strengths\
      \ of the strategy\")\n    )\n    weaknesses: List[str] = (\n        Field(...,\
      \ description=\"List of weaknesses of the strategy\")\n    )\n\n\nclass EvaluateBacktestRiskOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for evaluate_backtest_risk node outputs.\"\"\"\n \
      \   volatility: float = (\n        Field(..., description=\"Annualized volatility\
      \ of the backtest returns\")\n    )\n    value_at_risk: float = (\n        Field(...,\
      \ description = (\n            \"Value-at-Risk (VaR) of the backtest returns\
      \ at 95% confidence level\")\n        )\n    )\n    expected_shortfall: float\
      \ = (\n        Field(..., description = (\n            \"Expected Shortfall\
      \ (ES) of the backtest returns at 95% confidence level\")\n        )\n    )\n\
      \    max_drawdown: float = (\n        Field(..., description=\"Maximum drawdown\
      \ of the backtest returns\")\n    )\n    tail_risk: List[float] = (\n      \
      \  Field(..., description = (\n            \"List of tail risk metrics (e.g.,\
      \ 1% and 5% quantile returns)\")\n        )\n    )\n    position_concentration:\
      \ float = (\n        Field(..., description = (\n            \"Herfindahl-Hirschman\
      \ Index (HHI) of position concentration\")\n        )\n    )\n    liquidity_impact:\
      \ float = (\n        Field(..., description = (\n            \"Estimated liquidity\
      \ impact of the strategy (e.g., price impact, slippage)\")\n        )\n    )\n\
      \n\nclass OptimizeStrategyParametersOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for optimize_strategy_parameters node outputs.\"\"\"\n    optimized_parameters:\
      \ List[str] = (\n        Field(..., description=\"List of optimized strategy\
      \ hyperparameters\")\n    )\n    optimization_method: str = (\n        Field(...,\
      \ description = (\n            \"Method used for optimization (e.g., grid search,\
      \ Bayesian)\")\n        )\n    )\n    is_optimization_successful: bool = (\n\
      \        Field(..., description = (\n            \"Whether the optimization\
      \ process was successful\")\n        )\n    )\n    best_performance_metric:\
      \ float = (\n        Field(..., description=\"Value of the best performance\
      \ metric achieved\")\n    )\n\n\ndef optimize_strategy_parameters(evaluate_backtest_performance_input:\
      \ EvaluateBacktestPerformanceOutput, evaluate_backtest_risk_input: EvaluateBacktestRiskOutput,\
      \ **kwargs) -> OptimizeStrategyParametersOutput:\n    \"\"\"\n    Optimizes\
      \ strategy hyperparameters to achieve improved performance and risk\n    profiles\n\
      \n    Returns\n    -------\n    dict\n        Dictionary containing the optimized\
      \ strategy hyperparameters, the\n        optimization method used, and the best\
      \ performance metric achieved\n    \"\"\"\n    current_metrics = combine_performance_and_risk_metrics(performance=evaluate_backtest_performance_input,\
      \ risk=evaluate_backtest_risk_input)\n    optimization_method: str = select_optimization_method(performance_data=evaluate_backtest_performance_input,\
      \ risk_data=evaluate_backtest_risk_input)\n    parameter_space = define_parameter_search_space(current_performance=evaluate_backtest_performance_input,\
      \ weaknesses=evaluate_backtest_performance_input.weaknesses)\n    optimization_results\
      \ = run_optimization_algorithm(method=optimization_method, parameter_space=parameter_space,\
      \ target_metrics=current_metrics)\n    optimized_params: List[str] = extract_best_parameters(results=optimization_results)\n\
      \    is_successful: bool = validate_optimization_success(results=optimization_results,\
      \ original_metrics=current_metrics)\n    best_metric: float = calculate_best_performance_metric(results=optimization_results)\n\
      \    return OptimizeStrategyParametersOutput(\n        optimized_parameters=optimized_params,\n\
      \        optimization_method=optimization_method,\n        is_optimization_successful=is_successful,\n\
      \        best_performance_metric=best_metric\n    )"
