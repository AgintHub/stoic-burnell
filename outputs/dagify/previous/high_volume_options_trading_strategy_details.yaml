      key: folder_names
      type: List[str]
    - description: List of file templates in the repository
      key: file_templates
      type: List[str]
    prd:
      conceptual_info: This node sets up a basic code repository structure for the
        strategy, including essential folders and file templates.
      docstring:
        examples:
        - lines: []
          output: '{''repository_layout'': ''A high-level description of the repository
            layout.'', ''folder_names'': [''src'', ''tests'', ''docs''], ''file_templates'':
            [''main.py'', ''data_loader.py'']}'
        parameters: []
        raises: []
        returns:
          description: A dictionary containing the repository layout description,
            a list of folder names, and a list of file templates.
          type: '{repository_layout: str, folder_names: List[str], file_templates:
            List[str]}'
        summary: Defines a minimal code repository layout for a high-volume options
          trading strategy.
    prompt: Create a minimal repository structure for the strategy code. Provide folder
      names and file templates (e.g., main.py, data_loader.py).
  set_up_data_storage:
    agent: false
    description: Select and describe the database for storing market data.
    name: set_up_data_storage
    nodes_depended_on:
    - identify_data_sources
    nodes_dependent_on: []
    output_structure:
    - description: Type of the database (e.g., relational, NoSQL, time-series)
      key: database_type
      type: str
    - description: Detailed outline of the database schema
      key: schema_outline
      type: str
    - description: Strategy used for partitioning data (e.g., by date, by type)
      key: partition_strategy
      type: str
    - description: Policy for data retention (e.g., time-based, size-based)
      key: retention_policy
      type: str
    - description: Estimated size of the data storage needed
      key: data_storage_size
      type: int
    - description: Whether the data storage solution is cloud-based
      key: is_cloud_based
      type: bool
    prd:
      conceptual_info: This node proposes a data storage solution for high-volume
        option data.
      docstring:
        examples:
        - lines:
          - set_up_data_storage(data_sources=['exchange_tick_data', 'option_chain_feeds'])
          output: '{''database_type'': ''time-series'', ''schema_outline'': ''...'',
            ''partition_strategy'': ''by_date'', ''retention_policy'': ''time-based'',
            ''data_storage_size'': 1000, ''is_cloud_based'': True}'
        parameters:
        - description: List of data sources required for the strategy
          name: data_sources
          type: List[str]
        raises:
        - description: If the data source is invalid or unsupported
          type: ValueError
        returns:
          description: A dictionary containing the proposed data storage solution
            details
          type: '{database_type: str, schema_outline: str, partition_strategy: str,
            retention_policy: str, data_storage_size: int, is_cloud_based: bool}'
        summary: Proposes a data storage solution suitable for high-volume option
          data.
    prompt: Propose a data storage solution suitable for high-volume option data,
      specifying database type, schema outline, partition strategy, and retention
      policy.
  setup_backtest_environment:
    agent: false
    description: Prepare the backtesting platform.
    name: setup_backtest_environment
    nodes_depended_on:
    - design_strategy_logic
    nodes_dependent_on: []
    output_structure:
    - description: The name of the backtesting framework used (e.g., Zipline, backtrader)
      key: backtesting_framework
      type: str
    - description: List of data adapters used for the backtest (e.g., CSV, database
