    agent: false
    code_node_type: shim
    description: Safely transforms raw, dirty data into a consistent, analytically-ready
      format by filling missing values, aligning timestamps, and computing derived
      fields.
    implementation: "from ._clean_and_prepare_data.load_raw_dataset import load_raw_dataset\n\
      from ._clean_and_prepare_data.handle_missing_values import handle_missing_values\n\
      from ._clean_and_prepare_data.remove_outliers import remove_outliers\nfrom ._clean_and_prepare_data.standardize_data\
      \ import standardize_data\nfrom ._clean_and_prepare_data.calculate_derived_features\
      \ import calculate_derived_features\nfrom ._clean_and_prepare_data.validate_cleaned_data\
      \ import validate_cleaned_data\nfrom ._clean_and_prepare_data.assess_dataset_readiness\
      \ import assess_dataset_readiness\n\nfrom pydantic import BaseModel, Field\n\
      from typing import List\n\n\nclass ValidateAcquiredDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for validate_acquired_data node outputs.\"\"\"\n \
      \   validation_status: bool = (\n        Field(..., description=\"Whether the\
      \ data is valid\")\n    )\n    checks_performed: List[str] = (\n        Field(...,\
      \ description=\"List of checks performed during validation\")\n    )\n    check_results:\
      \ List[bool] = (\n        Field(..., description=\"List of results for each\
      \ check performed\")\n    )\n    missing_timestamps: List[int] = (\n       \
      \ Field(..., description=\"List of timestamps with missing data\")\n    )\n\
      \    price_consistency_issues: List[str] = (\n        Field(..., description=\"\
      List of price consistency issues found\")\n    )\n\n\nclass CleanAndPrepareDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for clean_and_prepare_data node outputs.\"\"\"\n \
      \   cleaning_successful: bool = (\n        Field(..., description = (\n    \
      \        \"Whether the data cleaning and preparation were successful\")\n  \
      \      )\n    )\n    number_of_missing_values_handled: int = (\n        Field(...,\
      \ description = (\n            \"Number of missing values handled during the\
      \ cleaning process\")\n        )\n    )\n    derived_fields_calculated: str\
      \ = (\n        Field(..., description = (\n            \"List of derived fields\
      \ calculated during the preparation process\")\n        )\n    )\n    dataset_ready:\
      \ bool = (\n        Field(..., description = (\n            \"Whether the dataset\
      \ is ready for feature engineering\")\n        )\n    )\n\n\ndef clean_and_prepare_data(validate_acquired_data_input:\
      \ ValidateAcquiredDataOutput, **kwargs) -> CleanAndPrepareDataOutput:\n    \"\
      \"\"\n    Performs a series of data cleaning and transformation operations.\n\
      \n    Returns\n    -------\n    Pandas DataFrame\n        The transformed dataset\
      \ in a suitable format for modeling.\n\n    Examples\n    --------\n    >>>\
      \ import pandas as pd\n    >>> from sklearn.impute import SimpleImputer\n  \
      \  >>> from sklearn.preprocessing import StandardScaler\n    Cleaned DataFrame\n\
      \n    \"\"\"\n    raw_dataset = load_raw_dataset(validation_input=validate_acquired_data_input)\n\
      \    \n    missing_value_count: int = handle_missing_values(dataset=raw_dataset,\
      \ strategy=\"imputation\")\n    \n    cleaned_dataset = remove_outliers(dataset=raw_dataset,\
      \ method=\"zscore\")\n    \n    standardized_dataset = standardize_data(dataset=cleaned_dataset,\
      \ scaler_type=\"standard\")\n    \n    derived_fields: str = calculate_derived_features(dataset=standardized_dataset)\n\
      \    \n    data_quality_check: bool = validate_cleaned_data(dataset=standardized_dataset)\n\
      \    \n    dataset_readiness: bool = assess_dataset_readiness(dataset=standardized_dataset,\
      \ quality_passed=data_quality_check)\n    \n    return CleanAndPrepareDataOutput(\n\
      \        cleaning_successful=data_quality_check,\n        number_of_missing_values_handled=missing_value_count,\n\
      \        derived_fields_calculated=derived_fields,\n        dataset_ready=dataset_readiness\n\
      \    )"
