dag_type: shim
description: Generated workflow from UI.
name: high_volume_options_trading_strategy
nodes:
  acquire_market_data:
    agent: false
    code_node_type: shim
    description: Implement data ingestion from all sources.
    implementation: "from ._acquire_market_data.validate_data_sources import validate_data_sources\n\
      from ._acquire_market_data.establish_database_connection import establish_database_connection\n\
      from ._acquire_market_data.get_current_timestamp import get_current_timestamp\n\
      from ._acquire_market_data.get_source_credentials import get_source_credentials\n\
      from ._acquire_market_data.authenticate_data_source import authenticate_data_source\n\
      from ._acquire_market_data.fetch_market_data import fetch_market_data\nfrom\
      \ ._acquire_market_data.store_data_in_database import store_data_in_database\n\
      from ._acquire_market_data.format_error_message import format_error_message\n\
      from ._acquire_market_data.close_database_connection import close_database_connection\n\
      from ._acquire_market_data.format_source_list import format_source_list\nfrom\
      \ ._acquire_market_data.format_error_list import format_error_list\n\nfrom pydantic\
      \ import BaseModel, Field\nfrom typing import List\n\n\nclass IdentifyDataSourcesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_data_sources node outputs.\"\"\"\n  \
      \  data_source_names: List[str] = (\n        Field(..., description=\"List of\
      \ data source names\")\n    )\n    vendor_names: List[str] = (\n        Field(...,\
      \ description=\"List of vendor names for each data source\")\n    )\n    data_frequencies:\
      \ List[str] = (\n        Field(..., description = (\n            \"List of data\
      \ frequencies for each data source (e.g., real-time, 1min, 1day)\")\n      \
      \  )\n    )\n    licensing_constraints: List[str] = (\n        Field(..., description\
      \ = (\n            \"List of licensing constraints for each data source\")\n\
      \        )\n    )\n\n\nclass AcquireMarketDataOutput(BaseModel):\n    \"\"\"\
      Pydantic model for acquire_market_data node outputs.\"\"\"\n    acquisition_successful:\
      \ bool = (\n        Field(..., description=\"Whether data acquisition was successful\"\
      )\n    )\n    data_sources: str = (\n        Field(..., description = (\n  \
      \          \"List of data sources from which data was acquired\")\n        )\n\
      \    )\n    start_timestamp: str = (\n        Field(..., description=\"Start\
      \ timestamp of the acquired data\")\n    )\n    end_timestamp: str = (\n   \
      \     Field(..., description=\"End timestamp of the acquired data\")\n    )\n\
      \    error_messages: str = (\n        Field(..., description = (\n         \
      \   \"List of error messages encountered during data acquisition\")\n      \
      \  )\n    )\n\n\ndef acquire_market_data(identify_data_sources_input: IdentifyDataSourcesOutput,\
      \ **kwargs) -> AcquireMarketDataOutput:\n    \"\"\"\n    Acquire market data\
      \ from identified sources and store it in a database.\n\n    Parameters\n  \
      \  ----------\n    data_sources : List[str]\n        List of data sources to\
      \ acquire data from\n    database_config : dict\n        Dictionary containing\
      \ database connection configuration\n    authentication_credentials : dict\n\
      \        Dictionary containing authentication credentials for data sources\n\
      \n    Returns\n    -------\n    dict\n        Dictionary containing acquisition\
      \ status, list of data sources,\n        start and end timestamps, and error\
      \ messages\n\n    Raises\n    ------\n    Exception\n        If an error occurs\
      \ during data acquisition or storage\n\n    Examples\n    --------\n    >>>\
      \ data_sources = ['source1', 'source2']\n    >>> database_config = {'host':\
      \ 'localhost', 'port': 5432, 'database':\n    'market_data'}\n    >>> authentication_credentials\
      \ = {'source1': 'username1:password1',\n    'source2': 'username2:password2'}\n\
      \    >>> result = acquire_market_data(data_sources, database_config,\n    authentication_credentials)\n\
      \    {'acquisition_successful': True, 'data_sources': ['source1', 'source2'],\n\
      \    'start_timestamp': '2022-01-01 00:00:00', 'end_timestamp': '2022-01-01\n\
      \    23:59:59', 'error_messages': []}\n\n    \"\"\"\n    database_config: dict\
      \ = kwargs.get('database_config', {})\n    authentication_credentials: dict\
      \ = kwargs.get('authentication_credentials', {})\n    \n    validated_sources:\
      \ List[str] = validate_data_sources(data_sources=identify_data_sources_input.data_source_names)\n\
      \    \n    db_connection = establish_database_connection(config=database_config)\n\
      \    \n    error_messages: List[str] = []\n    acquired_data_sources: List[str]\
      \ = []\n    start_time: str = get_current_timestamp()\n    \n    for source\
      \ in validated_sources:\n        try:\n            credentials = get_source_credentials(source=source,\
      \ auth_config=authentication_credentials)\n            source_connection = authenticate_data_source(source=source,\
      \ credentials=credentials)\n            market_data: dict = fetch_market_data(source_connection=source_connection,\
      \ source=source)\n            store_data_in_database(db_connection=db_connection,\
      \ data=market_data, source=source)\n            acquired_data_sources.append(source)\n\
      \        except Exception as e:\n            error_msg: str = format_error_message(source=source,\
      \ error=e)\n            error_messages.append(error_msg)\n    \n    end_time:\
      \ str = get_current_timestamp()\n    close_database_connection(connection=db_connection)\n\
      \    \n    acquisition_success: bool = len(acquired_data_sources) > 0\n    formatted_sources:\
      \ str = format_source_list(sources=acquired_data_sources)\n    formatted_errors:\
      \ str = format_error_list(errors=error_messages)\n    \n    return AcquireMarketDataOutput(\n\
      \        acquisition_successful=acquisition_success,\n        data_sources=formatted_sources,\n\
      \        start_timestamp=start_time,\n        end_timestamp=end_time,\n    \
      \    error_messages=formatted_errors\n    )"
    name: acquire_market_data
    nodes_depended_on:
    - identify_data_sources
    nodes_dependent_on: []
    output_structure:
    - description: Whether data acquisition was successful
      key: acquisition_successful
      type: bool
    - description: List of data sources from which data was acquired
      key: data_sources
      type: str
    - description: Start timestamp of the acquired data
      key: start_timestamp
      type: str
    - description: End timestamp of the acquired data
      key: end_timestamp
      type: str
    - description: List of error messages encountered during data acquisition
      key: error_messages
      type: str
    prd:
      conceptual_info: This node is responsible for acquiring market data from various
        sources and storing it in a proposed database.
      docstring:
        examples:
        - lines:
          - data_sources = ['source1', 'source2']
          - 'database_config = {''host'': ''localhost'', ''port'': 5432, ''database'':
            ''market_data''}'
          - 'authentication_credentials = {''source1'': ''username1:password1'', ''source2'':
            ''username2:password2''}'
          - result = acquire_market_data(data_sources, database_config, authentication_credentials)
          output: '{''acquisition_successful'': True, ''data_sources'': [''source1'',
            ''source2''], ''start_timestamp'': ''2022-01-01 00:00:00'', ''end_timestamp'':
            ''2022-01-01 23:59:59'', ''error_messages'': []}'
        parameters:
        - description: List of data sources to acquire data from
          name: data_sources
          type: List[str]
        - description: Dictionary containing database connection configuration
          name: database_config
          type: dict
        - description: Dictionary containing authentication credentials for data sources
          name: authentication_credentials
          type: dict
        raises:
        - description: If an error occurs during data acquisition or storage
          type: Exception
        returns:
          description: Dictionary containing acquisition status, list of data sources,
            start and end timestamps, and error messages
          type: dict
        summary: Acquire market data from identified sources and store it in a database.
    prompt: Write a script or description that pulls the identified data sources,
      handling authentication, rate limits, and storage into the proposed database.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: This shim function validates and filters a list of data source
        names to ensure they conform to expected criteria before further processing.
      implementation: "from typing import List\n\n\ndef validate_data_sources(data_sources:\
        \ str) -> List[str]:\n    \"\"\"\n    Validates and filters a list of data\
        \ source names, ensuring they meet\n    specified criteria before downstream\
        \ use.\n\n    Parameters\n    ----------\n    data_sources : str\n       \
        \ A string representing the list of data source names to be validated,\n \
        \       usually from an external source.\n\n    Returns\n    -------\n   \
        \ list[str]\n        A list of validated data source names that are suitable\
        \ for\n        subsequent processing.\n\n    Raises\n    ------\n    ValueError\n\
        \        Raised if the input data_sources string is malformed or contains\n\
        \        invalid entries.\n    TypeError\n        Raised if the input data_sources\
        \ is not of type str.\n\n    Examples\n    --------\n    >>> validated_sources\
        \ = validate_data_sources('source1, source2,\n    invalid_source')\n    >>>\
        \ print(validated_sources)\n    ['source1', 'source2']\n\n    >>> validated_sources\
        \ = validate_data_sources('')\n    >>> print(validated_sources)\n    []\n\n\
        \    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node that\
        \ needs to be implemented\")"
      name: validate_data_sources
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: data_sources
        type: str
      prd:
        conceptual_info: The shim validates and filters the provided list of data
          source names to ensure only valid and recognized sources are processed further.
        docstring:
          examples:
          - lines:
            - validated_sources = validate_data_sources('source1, source2, invalid_source')
            - print(validated_sources)
            output: '[''source1'', ''source2'']'
          - lines:
            - validated_sources = validate_data_sources('')
            - print(validated_sources)
            output: '[]'
          parameters:
          - description: A string representing the list of data source names to be
              validated, usually from an external source.
            name: data_sources
            type: str
          raises:
          - description: Raised if the input data_sources string is malformed or contains
              invalid entries.
            type: ValueError
          - description: Raised if the input data_sources is not of type str.
            type: TypeError
          returns:
            description: A list of validated data source names that are suitable for
              subsequent processing.
            type: list[str]
          summary: Validates and filters a list of data source names, ensuring they
            meet specified criteria before downstream use.
      prompt: 'Description: Typed node for shim validate_data_sources'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim function abstracts the process of establishing a database
        connection based on provided configuration details.
      implementation: "def establish_database_connection(config: str) -> str:\n  \
        \  \"\"\"\n    Creates and returns a database connection string or handle\
        \ based on the\n    provided configuration.\n\n    Parameters\n    ----------\n\
        \    config : str\n        A string containing the database configuration\
        \ details, such as\n        connection parameters or a connection URI.\n\n\
        \    Returns\n    -------\n    str\n        A string representing the established\
        \ database connection, which can\n        be used for further database interactions.\n\
        \n    Raises\n    ------\n    ValueError\n        Raised if the configuration\
        \ string is invalid or missing required\n        parameters.\n    TypeError\n\
        \        Raised if the input parameter is not a string.\n\n    Examples\n\
        \    --------\n    >>> connection = establish_database_connection(config='postgresql://user:pas\n\
        \    s@localhost:5432/mydb')\n    'ConnectionObjectIdentifierOrHandleString'\n\
        \n    >>> conn = establish_database_connection(config='')\n    Error: Invalid\
        \ configuration string.\n\n    \"\"\"\n    raise NotImplementedError(\"This\
        \ is a virtual stub node that needs to be implemented\")"
      name: establish_database_connection
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: config
        type: str
      prd:
        conceptual_info: The establish_database_connection shim initializes and returns
          a database connection using the specified configuration settings, enabling
          subsequent database operations.
        docstring:
          examples:
          - lines:
            - connection = establish_database_connection(config='postgresql://user:pass@localhost:5432/mydb')
            output: '''ConnectionObjectIdentifierOrHandleString'''
          - lines:
            - conn = establish_database_connection(config='')
            output: 'Error: Invalid configuration string.'
          parameters:
          - description: A string containing the database configuration details, such
              as connection parameters or a connection URI.
            name: config
            type: str
          raises:
          - description: Raised if the configuration string is invalid or missing
              required parameters.
            type: ValueError
          - description: Raised if the input parameter is not a string.
            type: TypeError
          returns:
            description: A string representing the established database connection,
              which can be used for further database interactions.
            type: str
          summary: Creates and returns a database connection string or handle based
            on the provided configuration.
      prompt: 'Description: Typed node for shim establish_database_connection'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim retrieves the current timestamp as a formatted string,
        to be used for marking data acquisition start and end times within the data
        pipeline.
      implementation: "def get_current_timestamp() -> str:\n    \"\"\"\n    Retrieve\
        \ the current system timestamp as a string for use in data pipeline\n    timing,\
        \ logging, and metadata purposes.\n\n    Returns\n    -------\n    str\n \
        \       A string representing the current timestamp when called, typically\n\
        \        formatted in ISO 8601 or the system's standard timestamp format.\n\
        \n    Examples\n    --------\n    >>> current_time = get_current_timestamp()\n\
        \    >>> print(current_time)\n    \"2024-04-27T10:15:30Z\"\n\n    >>> start_time\
        \ = get_current_timestamp\n    >>> end_time = get_current_timestamp\n    \"\
        2024-04-27T10:15:30Z\" and \"2024-04-27T10:15:30Z\" (example timestamps)\n\
        \n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node\
        \ that needs to be implemented\")"
      name: get_current_timestamp
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      prd:
        conceptual_info: This shim provides a reliable way to obtain the current timestamp
          as a string, supporting data pipeline timing and logging.
        docstring:
          examples:
          - lines:
            - current_time = get_current_timestamp()
            - print(current_time)
            output: '"2024-04-27T10:15:30Z"'
          - lines:
            - start_time = get_current_timestamp
            - end_time = get_current_timestamp
            output: '"2024-04-27T10:15:30Z" and "2024-04-27T10:15:30Z" (example timestamps)'
          parameters: []
          raises: []
          returns:
            description: A string representing the current timestamp when called,
              typically formatted in ISO 8601 or the system's standard timestamp format.
            type: str
          summary: Retrieve the current system timestamp as a string for use in data
            pipeline timing, logging, and metadata purposes.
      prompt: 'Description: Typed node for shim get_current_timestamp'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim function retrieves and returns the credentials for a
        specified data source based on the provided authentication configuration.
      implementation: "def get_source_credentials(source: str, auth_config: str) ->\
        \ str:\n    \"\"\"\n    Retrieve credentials for a given data source based\
        \ on provided\n    authentication configuration.\n\n    Parameters\n    ----------\n\
        \    source : str\n        The identifier or name of the data source for which\
        \ credentials are\n        to be retrieved.\n    auth_config : str\n     \
        \   A string or structured data containing authentication parameters or\n\
        \        configuration needed to obtain credentials.\n\n    Returns\n    -------\n\
        \    str\n        A string representing the credentials or authentication\
        \ token for\n        accessing the specified data source.\n\n    Raises\n\
        \    ------\n    ValueError\n        If the provided source name or auth_config\
        \ is invalid or missing\n        required information.\n    TypeError\n  \
        \      If the input parameters are of incorrect types.\n\n    Examples\n \
        \   --------\n    >>> get_source_credentials(source='finance_db', auth_config='api_key')\n\
        \    'credentials_token_or_info_for_finance_db'\n\n    >>> get_source_credentials(source='market_data',\
        \ auth_config='oauth_token')\n    'oauth_credentials_for_market_data'\n\n\
        \    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node that\
        \ needs to be implemented\")"
      name: get_source_credentials
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: source
        type: str
      - description: Input parameter of type str
        key: auth_config
        type: str
      prd:
        conceptual_info: This shim function abstracts the process of retrieving security
          credentials for a data source, facilitating secure data access within the
          larger data acquisition workflow.
        docstring:
          examples:
          - lines:
            - get_source_credentials(source='finance_db', auth_config='api_key')
            output: '''credentials_token_or_info_for_finance_db'''
          - lines:
            - get_source_credentials(source='market_data', auth_config='oauth_token')
            output: '''oauth_credentials_for_market_data'''
          parameters:
          - description: The identifier or name of the data source for which credentials
              are to be retrieved.
            name: source
            type: str
          - description: A string or structured data containing authentication parameters
              or configuration needed to obtain credentials.
            name: auth_config
            type: str
          raises:
          - description: If the provided source name or auth_config is invalid or
              missing required information.
            type: ValueError
          - description: If the input parameters are of incorrect types.
            type: TypeError
          returns:
            description: A string representing the credentials or authentication token
              for accessing the specified data source.
            type: str
          summary: Retrieve credentials for a given data source based on provided
            authentication configuration.
      prompt: 'Description: Typed node for shim get_source_credentials'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: A shim function that authenticates a data source using provided
        credentials and returns a connection object.
      implementation: "def authenticate_data_source(source: str, credentials: str)\
        \ -> str:\n    \"\"\"\n    Authenticates a data source using provided credentials\
        \ and returns a string\n    representing the data source connection or status.\n\
        \n    Parameters\n    ----------\n    source : str\n        Identifier or\
        \ name of the data source to authenticate.\n    credentials : str\n      \
        \  Authentication credentials required to access the data source.\n\n    Returns\n\
        \    -------\n    str\n        A string representation of the authenticated\
        \ connection object or\n        status indicator.\n\n    Raises\n    ------\n\
        \    ValueError\n        Raised if authentication fails due to invalid credentials\
        \ or source.\n    TypeError\n        Raised if input parameters are not of\
        \ the expected string type.\n\n    Examples\n    --------\n    >>> connection\
        \ = authenticate_data_source('DataSource1', 'api_key_123')\n    'connection_object_representation_or_status'\n\
        \n    >>> connection = authenticate_data_source('DataSource2',\n    'invalid_credentials')\n\
        \    Raises ValueError\n\n    \"\"\"\n    raise NotImplementedError(\"This\
        \ is a virtual stub node that needs to be implemented\")"
      name: authenticate_data_source
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: source
        type: str
      - description: Input parameter of type str
        key: credentials
        type: str
      prd:
        conceptual_info: This shim function encapsulates the process of authenticating
          a data source with given credentials, enabling secure data access within
          the larger data retrieval workflow.
        docstring:
          examples:
          - lines:
            - connection = authenticate_data_source('DataSource1', 'api_key_123')
            output: '''connection_object_representation_or_status'''
          - lines:
            - connection = authenticate_data_source('DataSource2', 'invalid_credentials')
            output: Raises ValueError
          parameters:
          - description: Identifier or name of the data source to authenticate.
            name: source
            type: str
          - description: Authentication credentials required to access the data source.
            name: credentials
            type: str
          raises:
          - description: Raised if authentication fails due to invalid credentials
              or source.
            type: ValueError
          - description: Raised if input parameters are not of the expected string
              type.
            type: TypeError
          returns:
            description: A string representation of the authenticated connection object
              or status indicator.
            type: str
          summary: Authenticates a data source using provided credentials and returns
            a string representing the data source connection or status.
      prompt: 'Description: Typed node for shim authenticate_data_source'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: This shim retrieves market data from specified sources by establishing
        connections, authenticating, fetching data, and storing it in a database.
      implementation: "def fetch_market_data(source_connection: str, source: str)\
        \ -> str:\n    \"\"\"\n    Fetches market data from specified sources, manages\
        \ database connections,\n    authenticates sources, retrieves data, logs errors,\
        \ and outputs the\n    acquisition result with metadata.\n\n    Parameters\n\
        \    ----------\n    source_connection : str\n        String representing\
        \ the established connection to the data source\n    source : str\n      \
        \  Name or identifier of the data source to fetch data from\n\n    Returns\n\
        \    -------\n    str\n        A serialized JSON string detailing acquisition\
        \ success, data\n        sources, timestamps, and errors\n\n    Raises\n \
        \   ------\n    ValueError\n        If input parameters are invalid or missing\
        \ required information\n    TypeError\n        If input parameters are of\
        \ incorrect types\n\n    Examples\n    --------\n    >>> fetch_market_data('connection_str',\
        \ 'NYSE')\n    \"{\\\"acquisition_successful\\\": true, \\\"data_sources\\\
        \": \\\"NYSE, NASDAQ\\\",\n    \\\"start_timestamp\\\": \\\"2024-04-27T10:00:00Z\\\
        \", \\\"end_timestamp\\\":\n    \\\"2024-04-27T10:05:00Z\\\", \\\"error_messages\\\
        \": \\\"\\\"}\"\n\n    >>> fetch_market_data('connection_str', 'CryptoExchange')\n\
        \    \"{\\\"acquisition_successful\\\": false, \\\"data_sources\\\": \\\"\
        CryptoExchange\\\",\n    \\\"start_timestamp\\\": \\\"2024-04-27T11:00:00Z\\\
        \", \\\"end_timestamp\\\":\n    \\\"2024-04-27T11:02:00Z\\\", \\\"error_messages\\\
        \": \\\"Failed to fetch data from\n    CryptoExchange\\\"}\"\n\n    \"\"\"\
        \n    raise NotImplementedError(\"This is a virtual stub node that needs to\
        \ be implemented\")"
      name: fetch_market_data
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type dict
        key: output
        type: str
      - description: Input parameter of type str
        key: source_connection
        type: str
      - description: Input parameter of type str
        key: source
        type: str
      prd:
        conceptual_info: This shim encapsulates the process of acquiring market data
          from various sources, handling authentication, data retrieval, storage,
          and error management to integrate real-time or historical market data into
          the system.
        docstring:
          examples:
          - lines:
            - fetch_market_data('connection_str', 'NYSE')
            output: '"{\"acquisition_successful\": true, \"data_sources\": \"NYSE,
              NASDAQ\", \"start_timestamp\": \"2024-04-27T10:00:00Z\", \"end_timestamp\":
              \"2024-04-27T10:05:00Z\", \"error_messages\": \"\"}"'
          - lines:
            - fetch_market_data('connection_str', 'CryptoExchange')
            output: '"{\"acquisition_successful\": false, \"data_sources\": \"CryptoExchange\",
              \"start_timestamp\": \"2024-04-27T11:00:00Z\", \"end_timestamp\": \"2024-04-27T11:02:00Z\",
              \"error_messages\": \"Failed to fetch data from CryptoExchange\"}"'
          parameters:
          - description: String representing the established connection to the data
              source
            name: source_connection
            type: str
          - description: Name or identifier of the data source to fetch data from
            name: source
            type: str
          raises:
          - description: If input parameters are invalid or missing required information
            type: ValueError
          - description: If input parameters are of incorrect types
            type: TypeError
          returns:
            description: A serialized JSON string detailing acquisition success, data
              sources, timestamps, and errors
            type: str
          summary: Fetches market data from specified sources, manages database connections,
            authenticates sources, retrieves data, logs errors, and outputs the acquisition
            result with metadata.
      prompt: Typed node for shim fetch_market_data
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Stores market data in the database for later retrieval.
