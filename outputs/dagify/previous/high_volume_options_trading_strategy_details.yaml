      \    var_95: float = calculate_value_at_risk(backtest_data=run_backtest_input,\
      \ confidence_level=0.95)\n    expected_shortfall: float = calculate_expected_shortfall(backtest_data=run_backtest_input,\
      \ confidence_level=0.95)\n    max_dd: float = extract_max_drawdown(backtest_data=run_backtest_input)\n\
