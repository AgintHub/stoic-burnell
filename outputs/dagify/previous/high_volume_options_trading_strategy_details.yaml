    agent: false
    code_node_type: shim
    description: Select and describe the database for storing market data.
    implementation: "from ._set_up_data_storage.validate_data_sources import validate_data_sources\n\
      from ._set_up_data_storage.estimate_data_volumes import estimate_data_volumes\n\
      from ._set_up_data_storage.determine_optimal_database_type import determine_optimal_database_type\n\
      from ._set_up_data_storage.design_database_schema import design_database_schema\n\
      from ._set_up_data_storage.define_partition_strategy import define_partition_strategy\n\
      from ._set_up_data_storage.define_retention_policy import define_retention_policy\n\
      from ._set_up_data_storage.calculate_storage_requirements import calculate_storage_requirements\n\
      from ._set_up_data_storage.recommend_cloud_deployment import recommend_cloud_deployment\n\
      \nfrom pydantic import BaseModel, Field\nfrom typing import List\n\n\nclass\
      \ IdentifyDataSourcesOutput(BaseModel):\n    \"\"\"Pydantic model for identify_data_sources\
      \ node outputs.\"\"\"\n    data_source_names: List[str] = (\n        Field(...,\
      \ description=\"List of data source names\")\n    )\n    vendor_names: List[str]\
      \ = (\n        Field(..., description=\"List of vendor names for each data source\"\
      )\n    )\n    data_frequencies: List[str] = (\n        Field(..., description\
      \ = (\n            \"List of data frequencies for each data source (e.g., real-time,\
      \ 1min, 1day)\")\n        )\n    )\n    licensing_constraints: List[str] = (\n\
      \        Field(..., description = (\n            \"List of licensing constraints\
      \ for each data source\")\n        )\n    )\n\n\nclass SetUpDataStorageOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for set_up_data_storage node outputs.\"\"\"\n    database_type:\
      \ str = (\n        Field(..., description = (\n            \"Type of the database\
      \ (e.g., relational, NoSQL, time-series)\")\n        )\n    )\n    schema_outline:\
      \ str = (\n        Field(..., description=\"Detailed outline of the database\
      \ schema\")\n    )\n    partition_strategy: str = (\n        Field(..., description\
      \ = (\n            \"Strategy used for partitioning data (e.g., by date, by\
      \ type)\")\n        )\n    )\n    retention_policy: str = (\n        Field(...,\
      \ description = (\n            \"Policy for data retention (e.g., time-based,\
      \ size-based)\")\n        )\n    )\n    data_storage_size: int = (\n       \
      \ Field(..., description=\"Estimated size of the data storage needed\")\n  \
      \  )\n    is_cloud_based: bool = (\n        Field(..., description = (\n   \
      \         \"Whether the data storage solution is cloud-based\")\n        )\n\
      \    )\n\n\ndef set_up_data_storage(identify_data_sources_input: IdentifyDataSourcesOutput,\
      \ **kwargs) -> SetUpDataStorageOutput:\n    \"\"\"\n    Proposes a data storage\
      \ solution suitable for high-volume option data.\n\n    Parameters\n    ----------\n\
      \    data_sources : List[str]\n        List of data sources required for the\
      \ strategy\n\n    Returns\n    -------\n    {database_type: str, schema_outline:\
      \ str, partition_strategy: str, retention_policy: str, data_storage_size: int,\
      \ is_cloud_based: bool}\n        A dictionary containing the proposed data storage\
      \ solution details\n\n    Raises\n    ------\n    ValueError\n        If the\
      \ data source is invalid or unsupported\n\n    Examples\n    --------\n    >>>\
      \ set_up_data_storage(data_sources=['exchange_tick_data',\n    'option_chain_feeds'])\n\
      \    {'database_type': 'time-series', 'schema_outline': '...',\n    'partition_strategy':\
      \ 'by_date', 'retention_policy': 'time-based',\n    'data_storage_size': 1000,\
      \ 'is_cloud_based': True}\n\n    \"\"\"\n    validated_sources: List[str] =\
      \ validate_data_sources(data_sources=identify_data_sources_input.data_source_names)\n\
      \    \n    volume_estimates: dict = estimate_data_volumes(data_sources=validated_sources,\
      \ frequencies=identify_data_sources_input.data_frequencies)\n    \n    optimal_db_type:\
      \ str = determine_optimal_database_type(data_sources=validated_sources, volume_estimates=volume_estimates)\n\
      \    \n    schema_design: str = design_database_schema(database_type=optimal_db_type,\
      \ data_sources=validated_sources, frequencies=identify_data_sources_input.data_frequencies)\n\
      \    \n    partition_plan: str = define_partition_strategy(database_type=optimal_db_type,\
      \ data_volume=volume_estimates, frequencies=identify_data_sources_input.data_frequencies)\n\
      \    \n    retention_plan: str = define_retention_policy(data_sources=validated_sources,\
      \ licensing_constraints=identify_data_sources_input.licensing_constraints)\n\
      \    \n    storage_size: int = calculate_storage_requirements(volume_estimates=volume_estimates,\
      \ retention_policy=retention_plan)\n    \n    cloud_recommendation: bool = recommend_cloud_deployment(storage_size=storage_size,\
      \ data_sources=validated_sources)\n    \n    return SetUpDataStorageOutput(\n\
      \        database_type=optimal_db_type,\n        schema_outline=schema_design,\n\
      \        partition_strategy=partition_plan,\n        retention_policy=retention_plan,\n\
      \        data_storage_size=storage_size,\n        is_cloud_based=cloud_recommendation\n\
      \    )"
    name: set_up_data_storage
    nodes_depended_on:
    - identify_data_sources
    nodes_dependent_on: []
    output_structure:
    - description: Type of the database (e.g., relational, NoSQL, time-series)
