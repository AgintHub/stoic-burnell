    nodes_dependent_on: []
    output_structure:
    - description: The expected annual return of the strategy
      key: expected_annual_return
      type: float
    - description: The expected volatility of the strategy
      key: expected_volatility
      type: float
    - description: The Sharpe ratio of the strategy
      key: sharpe_ratio
      type: float
    - description: The maximum drawdown of the strategy
      key: max_drawdown
      type: float
    - description: The number of trades executed
      key: trade_count
      type: int
    - description: The win rate of the strategy
      key: win_rate
      type: float
    - description: The Value-at-Risk (VaR) of the strategy
      key: value_at_risk
      type: float
    prd:
      conceptual_info: Simulates live trading performance using optimized strategy
        parameters and realistic market conditions.
      docstring:
        examples:
        - lines:
          - simulate_live_performance(optimized_parameters=['param1', 'param2'], optimization_method='grid_search')
          output: '{''expected_annual_return'': 0.2, ''expected_volatility'': 0.1,
            ''sharpe_ratio'': 1.5, ''max_drawdown'': 0.3, ''trade_count'': 1000, ''win_rate'':
            0.6, ''value_at_risk'': 0.05}'
        parameters:
        - description: List of optimized strategy hyperparameters
          name: optimized_parameters
          type: List[str]
        - description: Method used for optimization (e.g., grid search, Bayesian)
          name: optimization_method
          type: str
        raises:
        - description: If optimized_parameters is empty or invalid
          type: ValueError
        returns:
          description: 'Dictionary containing performance metrics: expected_annual_return,
            expected_volatility, sharpe_ratio, max_drawdown, trade_count, win_rate,
            value_at_risk'
          type: dict
        summary: Simulates live trading performance using optimized strategy parameters
          and realistic market conditions.
    prompt: Simulate live execution using the optimized parameters and realistic slippage
      and latency models. Report expected performance metrics.
  validate_acquired_data:
    agent: false
    description: Ensure the ingested data is correct and complete.
    name: validate_acquired_data
    nodes_depended_on:
    - acquire_market_data
    nodes_dependent_on: []
    output_structure:
    - description: Whether the data is valid
      key: validation_status
      type: bool
    - description: List of checks performed during validation
      key: checks_performed
      type: List[str]
    - description: List of results for each check performed
      key: check_results
      type: List[bool]
    - description: List of timestamps with missing data
      key: missing_timestamps
      type: List[int]
    - description: List of price consistency issues found
      key: price_consistency_issues
      type: List[str]
    prd:
      conceptual_info: Validates the completeness and accuracy of acquired market
        data.
      docstring:
        examples:
        - lines:
          - acquired_data = {
          - '    ''data_sources'': [''source1'', ''source2''],'
          - '    ''start_timestamp'': ''2022-01-01'','
          - '    ''end_timestamp'': ''2022-01-02'','
          - '    ''data'': [...]'
          - '}'
          - validate_acquired_data(acquired_data)
          output: '{''validation_status'': True, ''checks_performed'': [''timestamp_check'',
            ''price_consistency_check''], ''check_results'': [True, True], ''missing_timestamps'':
            [], ''price_consistency_issues'': []}'
        - lines:
          - acquired_data = {
          - '    ''data_sources'': [''source1'', ''source2''],'
          - '    ''start_timestamp'': ''2022-01-01'','
          - '    ''end_timestamp'': ''2022-01-02'','
          - '    ''data'': [...]'
          - '}'
          - validate_acquired_data(acquired_data)
          output: '{''validation_status'': False, ''checks_performed'': [''timestamp_check'',
            ''price_consistency_check''], ''check_results'': [False, True], ''missing_timestamps'':
            [1640995200], ''price_consistency_issues'': [''inconsistent_price'']}'
        parameters:
        - description: Dictionary containing the acquired market data. It should include
            keys such as 'data_sources', 'start_timestamp', 'end_timestamp', and 'data'.
          name: acquired_data
          type: dict
        raises:
        - description: If the acquired data is not provided or is empty.
          type: ValueError
        returns:
          description: A dictionary containing the validation status, checks performed,
            results of checks, missing timestamps, and price consistency issues.
          type: dict
        summary: Validates acquired market data for completeness and accuracy.
    prompt: Validate the acquired data for completeness and accuracy. Provide a checklist
      of checks (e.g., missing timestamps, price consistency).
