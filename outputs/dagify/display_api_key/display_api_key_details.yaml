dag_type: plain_text
description: Generates a mock API key and displays it to the user.
name: display_api_key
nodes:
  generate_api_key:
    agent: false
    description: Create a random placeholder API key (32 alphanumeric characters,
      uppercase letters and digits).
    name: generate_api_key
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Generate a mock API key formatted as a typical 32‑character alphanumeric
      token using only uppercase letters A‑Z and digits 0‑9. Do not access any real
      secret stores.
  output_api_key:
    agent: false
    description: Print the API key produced by the previous step.
    name: output_api_key
    nodes_depended_on:
    - generate_api_key
    nodes_dependent_on: []
    prompt: Output the API key generated in the 'generate_api_key' step in plain text.
